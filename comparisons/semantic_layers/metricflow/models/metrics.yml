metrics:
  - name: aov_usd
    label: Average Order Value (USD)
    type: ratio
    numerator: revenue_usd
    denominator: orders

  - name: session_order_conversions_7d
    label: Orders Within 7 Days Of A Session
    type: conversion
    entity: customer
    calculation: conversions
    base_metric: session_starts
    conversion_metric: orders
    window: 7 days

  - name: same_store_session_order_conversions_7d
    label: Same-Store Orders Within 7 Days Of A Session
    type: conversion
    entity: customer
    calculation: conversions
    base_metric: session_starts
    conversion_metric: orders
    window: 7 days
    constant_properties:
      - base_property: store
        conversion_property: store

  - name: session_to_order_conversion_rate_7d
    label: Session To Order Conversion Rate (7d)
    type: ratio
    numerator: converted_sessions_7d
    denominator: session_starts

  - name: same_store_session_to_order_conversion_rate_7d
    label: Same Store Session To Order Conversion Rate (7d)
    type: ratio
    numerator: same_store_converted_sessions_7d
    denominator: session_starts
