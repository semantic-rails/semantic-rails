models:
  - name: customer_history
    description: Historical customer segment states (SCD Type II).
    semantic_model:
      enabled: true
    primary_entity: customer
    agg_time_dimension: valid_from
    columns:
      - name: customer_id
        entity:
          type: natural
          name: customer
      - name: valid_from
        granularity: day
        dimension:
          type: time
          validity_params:
            is_start: true
      - name: valid_to
        granularity: day
        dimension:
          type: time
          validity_params:
            is_end: true
      - name: customer_segment
        dimension:
          type: categorical

  - name: order_lifecycle
    description: One row per order lifecycle state with multiple business clocks.
    semantic_model:
      enabled: true
    primary_entity: order
    agg_time_dimension: delivered_at
    columns:
      - name: order_id
        entity:
          type: unique
          name: order
      - name: customer_id
        entity:
          type: foreign
          name: customer
      - name: store_id
        entity:
          type: foreign
          name: store
      - name: prepared_at
        granularity: minute
        dimension:
          type: time
      - name: delivered_at
        granularity: minute
        dimension:
          type: time
    metrics:
      - name: delivered_revenue
        label: Delivered Revenue
        description: Revenue anchored to delivered time.
        type: simple
        agg: sum
        expr: order_total_cents / 100.0

  - name: storefront_sessions
    description: One row per storefront session.
    semantic_model:
      enabled: true
    agg_time_dimension: started_at
    columns:
      - name: session_id
        entity:
          type: primary
          name: session
      - name: customer_id
        entity:
          type: foreign
          name: customer
      - name: store_id
        entity:
          type: foreign
          name: store
      - name: started_at
        granularity: minute
        dimension:
          type: time
    metrics:
      - name: session_starts
        label: Session Starts
        type: simple
        agg: sum
        expr: "1"
      # A conversion metric counts conversion events (orders), each credited to the latest
      # session before it. These count the sessions credited with at least one of them.
      - name: converted_sessions_7d
        label: Sessions Converted Within 7 Days
        type: simple
        agg: sum
        expr: "1"
        filter: |
          {{ Metric('session_order_conversions_7d', group_by=['session']) }} > 0
      - name: same_store_converted_sessions_7d
        label: Sessions Converted At The Same Store Within 7 Days
        type: simple
        agg: sum
        expr: "1"
        filter: |
          {{ Metric('same_store_session_order_conversions_7d', group_by=['session']) }} > 0
