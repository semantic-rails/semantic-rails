# The frozen-model questions (questions.yml `scope_level: variant`, q17-q24) are answered with
# each layer's model for q01-q16 unchanged, through the layer's documented query-time interface
# only. See rubric.md, "Frozen-model questions".
#
# - `model`: the files that are the layer's model, relative to comparisons/semantic_layers/.
#   `sha256` pins them as they were when the variants were answered, the same files that answer
#   q01-q16. apply_rubric.py refuses to label anything if they differ, so a variant can't be
#   answered by editing the model.
# - `interface`: the query-time interface the variants use.
# - `requires_model_change`: the variants that interface can't express, each with the reason and
#   the documentation (or the executed refusal) behind it. The rubric labels these first.
# A layer not listed here isn't assessed on the variants.
semantic_rails:
  model: [semantic_rails/package]
  sha256: 0cb15a8c4e73df9e1f2ce418f9d4c5a581c784d96371f7765db6944cb8b0bc9d
  interface: The Query API (conversion, rolling, prior_period, aggregate overrides, scoped aggregates and metric_filters).
  requires_model_change:
    q19_trailing_3_month_revenue_by_month: &sr_calendar
      reason: >-
        `rolling` and `prior_period` are query-time expressions, but they run over a dense
        calendar, and this package declares no calendar entity. The engine refuses the query
        ("time.fill requires a calendar entity in the package"), so the package needs a calendar
        entity first.
      doc: https://github.com/semantic-rails/semantic-rails/blob/main/docs/QUERY_IR_SCHEMA.md#dense-fill-timefill
    q20_revenue_and_prior_month_revenue_by_month: *sr_calendar

metricflow:
  model: [metricflow/models, metricflow/dbt_project.yml]
  sha256: 5abc5437c0ea3c8131762a824b6efcf71dbaa9aac409002270e18cf3eb91d7ec
  interface: "`mf query`: metrics, group-by, where (including metric filters), time bounds, order and limit."
  requires_model_change:
    q17_session_to_order_conversion_14d:
      reason: >-
        The conversion window is part of the conversion metric's definition (`window: 7 days`).
        No query option changes it, so a 14-day window needs a new conversion metric.
      doc: https://docs.getdbt.com/docs/build/conversion
    q18_same_store_session_to_order_conversion_50m:
      reason: >-
        The window and the same-store constant property are part of the conversion metric's
        definition. No query option changes the window, so a 50-minute window needs a new
        conversion metric.
      doc: https://docs.getdbt.com/docs/build/conversion
    q19_trailing_3_month_revenue_by_month:
      reason: >-
        A trailing window is a cumulative metric's `window`, set in its definition. The query
        interface has no window option, so it needs a new cumulative metric.
      doc: https://docs.getdbt.com/docs/build/cumulative
    q20_revenue_and_prior_month_revenue_by_month:
      reason: >-
        A prior-period value is a derived metric with an `offset_window`, set in its definition.
        The query interface has no offset option, so it needs a new derived metric.
      doc: https://docs.getdbt.com/docs/build/derived
    q21_revenue_and_large_order_revenue_by_month:
      reason: >-
        A query's `--where` filters every metric in the query. A metric filter grouped by `order`
        selects the large orders, so one query returns large-order revenue or total revenue, but
        not both side by side; that needs a metric with its own `filter:`.
      doc: https://docs.getdbt.com/docs/build/metricflow-commands
    q22_average_and_max_item_revenue_by_product_type_by_month:
      reason: >-
        A simple metric's aggregation is part of its definition (`agg: sum` for
        `item_revenue_usd`). The query interface can't choose another aggregation, so the average
        and the maximum each need a new simple metric.
      doc: https://docs.getdbt.com/docs/build/simple

cube:
  model: [cube/model]
  sha256: eff21c7eaa5b7233b32c922dc051f1bf3db7ff40e5ecd377e81b333e868aa138
  interface: >-
    REST queries (members, filters and time dimensions), and SQL API queries sent to /v1/cubesql,
    which can wrap a Cube query in SQL (post-processing or pushdown).
  requires_model_change:
    q17_session_to_order_conversion_14d: &cube_window
      reason: >-
        The model's session-to-order join carries the 7-day window, and a query can't change a
        join's condition. The SQL API refuses a non-equality join between two Cube queries
        ("Unsupported expressions in Left JOIN"), and the model exposes no session key to count
        converted sessions with, since a primary key is hidden unless it is marked public. A
        different window needs a new join in the model.
      doc: https://docs.cube.dev/reference/data-modeling/joins
    q18_same_store_session_to_order_conversion_50m: *cube_window
    q21_revenue_and_large_order_revenue_by_month:
      reason: >-
        Query filters apply to the whole query, and a filtered measure (`filters:` on a measure)
        is set in the model. The model exposes no order-total dimension to filter on and no order
        key for an SQL API query to total revenue per order (a primary key is hidden unless it is
        marked public), so large-order revenue beside total revenue needs a model change.
      doc: https://docs.cube.dev/reference/data-modeling/measures
    q22_average_and_max_item_revenue_by_product_type_by_month:
      reason: >-
        A measure's type is set in the model (`sum` for `item_revenue_usd`), and the SQL API
        refuses an aggregate that doesn't match it. The model exposes no item key and no
        item-revenue dimension to aggregate per item (a primary key is hidden unless it is marked
        public), so the average and the maximum need new measures.
      doc: https://docs.cube.dev/reference/core-data-apis/sql-api/query-format

malloy:
  model: [malloy/models]
  sha256: f915065cc95d53fc7970c61168a317e2fada0202d1ec49efb8898aba89bee9fa
  interface: >-
    Malloy queries in their own files that import the model: filtered and ad hoc aggregates,
    calculations (window functions), and query-level source extensions.
  requires_model_change: {}

ktx:
  model: [ktx/sources]
  sha256: e693a2ad08ad312dd237f70ad64b97e1d8dc348f3f53993fbb84ff82e686afc4
  interface: "ktx-sl semantic queries: predefined or inline measure expressions, dimensions, filters and segments."
  requires_model_change:
    q17_session_to_order_conversion_14d: &ktx_window
      reason: >-
        The 7-day window is inside the pack's conversion SQL sources. ktx-sl joins are
        equality-only, and a semantic query has no join or window option, so a different window
        needs a new SQL source.
      doc: https://github.com/Kaelio/ktx/blob/main/docs-site/content/docs/concepts/semantic-layer-internals.mdx
    q18_same_store_session_to_order_conversion_50m: *ktx_window
    q19_trailing_3_month_revenue_by_month: &ktx_over
      reason: >-
        ktx-sl rejects window functions in measures, inline query measures included ("Window
        functions (OVER clause) are not supported in measures"), so a trailing or prior-period
        value needs a SQL source.
      doc: https://github.com/Kaelio/ktx/blob/main/docs-site/content/docs/concepts/semantic-layer-internals.mdx
    q20_revenue_and_prior_month_revenue_by_month: *ktx_over
    q23_orders_from_customers_with_5plus_orders_in_month:
      reason: >-
        The more-than-10 threshold is inside the pack's customer-month SQL source. A query filter
        is row-level or applies at the query's own grain, so it can't count each customer-month's
        orders; a new threshold needs a new SQL source.
      doc: https://github.com/Kaelio/ktx/blob/main/docs-site/content/docs/concepts/semantic-layer-internals.mdx
