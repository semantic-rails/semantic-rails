name: daily_orders_from_high_frequency_customers_month
sql: |
  with customer_months as (
    select
      customer_id,
      date_trunc('month', ordered_at) as ordered_month,
      count(*) as monthly_orders
    from comparison_orders
    group by 1, 2
  )
  select
    o.order_id as qualifying_order_id,
    date_trunc('day', o.ordered_at) as ordered_day
  from comparison_orders as o
  inner join customer_months as c
    on o.customer_id = c.customer_id
   and date_trunc('month', o.ordered_at) = c.ordered_month
  where c.monthly_orders > 10
grain: [qualifying_order_id]
columns:
  - name: qualifying_order_id
    type: string
  - name: ordered_day
    type: time
    role: time
measures:
  - name: qualifying_orders
    expr: count_distinct(qualifying_order_id)
