cubes:
  - name: customers
    sql_table: comparison_customers

    dimensions:
      - name: customer_id
        sql: customer_id
        type: string
        primary_key: true

      - name: customer_name
        sql: customer_name
        type: string

      - name: customer_type
        sql: customer_type
        type: string

      - name: lifetime_order_count
        sql: lifetime_order_count
        type: number

      - name: lifetime_spend_usd
        sql: "lifetime_spend_cents / 100.0"
        type: number

      - name: first_order_at
        sql: first_order_at
        type: time
