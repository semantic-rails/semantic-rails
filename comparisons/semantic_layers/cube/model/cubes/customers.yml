cubes:
  - name: customers
    sql_table: comparison_customers

    joins:  # Stretch scope: back to orders, for the subquery dimensions (q11, q12).
      - name: orders
        relationship: one_to_many
        sql: "{CUBE}.customer_id = {orders.customer_id}"

    dimensions:
      - name: customer_id
        sql: customer_id
        type: string
        primary_key: true

      - name: customer_name
        sql: customer_name
        type: string

      - name: customer_type
        sql: customer_type
        type: string

      # Stretch scope: subquery dimensions over each customer's orders (q11, q12).
      - name: lifetime_orders
        sql: "{orders.order_count}"
        type: number
        sub_query: true
      - name: lifetime_spend_usd
        sql: "{orders.revenue_usd}"
        type: number
        sub_query: true
