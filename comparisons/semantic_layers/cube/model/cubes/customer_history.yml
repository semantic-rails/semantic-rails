cubes:
  - name: customer_history
    sql_table: comparison_customer_history

    dimensions:
      - name: customer_history_key
        sql: "customer_id || '|' || cast(valid_from as varchar)"
        type: string
        primary_key: true

      - name: customer_id
        sql: customer_id
        type: string

      - name: customer_segment
        sql: customer_segment
        type: string

      - name: valid_from
        sql: valid_from
        type: time

      - name: valid_to
        sql: valid_to
        type: time
