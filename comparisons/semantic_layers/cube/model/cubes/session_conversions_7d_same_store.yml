cubes:
  - name: session_conversions_7d_same_store
    sql: |
      with matched as (
        select
          s.session_id,
          s.customer_id,
          s.store_id,
          s.started_at,
          min(o.ordered_at) as first_ordered_at
        from comparison_storefront_sessions as s
        left join comparison_orders as o
          on s.customer_id = o.customer_id
         and s.store_id = o.store_id
         and o.ordered_at >= s.started_at
         and o.ordered_at < s.started_at + interval '7 day'
        group by 1, 2, 3, 4
      )
      select
        session_id,
        customer_id,
        store_id,
        started_at,
        case when first_ordered_at is not null then true else false end as converted_within_7d
      from matched

    dimensions:
      - name: session_id
        sql: session_id
        type: string
        primary_key: true

      - name: customer_id
        sql: customer_id
        type: string

      - name: store_id
        sql: store_id
        type: string

      - name: started_at
        sql: started_at
        type: time

      - name: converted_within_7d
        sql: converted_within_7d
        type: boolean

    measures:
      - name: session_starts
        sql: session_id
        type: count_distinct

      - name: same_store_converted_sessions_7d
        sql: "CASE WHEN {CUBE}.converted_within_7d THEN {CUBE}.session_id END"
        type: count_distinct

      - name: same_store_session_to_order_conversion_rate_7d
        sql: "{same_store_converted_sessions_7d} * 1.0 / NULLIF({session_starts}, 0)"
        type: number
