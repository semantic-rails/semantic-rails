cubes:
  - name: qualified_orders
    sql: |
      with customer_months as (
        select
          customer_id,
          date_trunc('month', ordered_at) as ordered_month,
          count(*) as monthly_orders
        from comparison_orders
        group by 1, 2
      )
      select
        o.order_id,
        o.customer_id,
        o.store_id,
        o.ordered_at,
        date_trunc('month', o.ordered_at) as ordered_month
      from comparison_orders as o
      inner join customer_months as c
        on o.customer_id = c.customer_id
       and date_trunc('month', o.ordered_at) = c.ordered_month
      where c.monthly_orders > 10

    dimensions:
      - name: order_id
        sql: order_id
        type: string
        primary_key: true

      - name: customer_id
        sql: customer_id
        type: string

      - name: store_id
        sql: store_id
        type: string

      - name: ordered_at
        sql: ordered_at
        type: time

      - name: ordered_month
        sql: ordered_month
        type: time

    measures:
      - name: qualifying_orders
        sql: order_id
        type: count_distinct
