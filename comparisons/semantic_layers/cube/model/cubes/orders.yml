cubes:
  - name: orders
    sql_table: comparison_orders

    joins:
      - name: stores
        relationship: many_to_one
        sql: "{CUBE}.store_id = {stores.store_id}"

      - name: customers
        relationship: many_to_one
        sql: "{CUBE}.customer_id = {customers.customer_id}"

      # The customer-history row valid when the order was placed (q08).
      - name: customer_history
        relationship: many_to_one
        sql: >
          {CUBE}.customer_id = {customer_history.customer_id}
          AND {CUBE.ordered_at} >= {customer_history.valid_from}
          AND ({CUBE.ordered_at} < {customer_history.valid_to} OR {customer_history.valid_to} IS NULL)

    dimensions:
      - name: order_id
        sql: order_id
        type: string
        primary_key: true

      - name: customer_id
        sql: customer_id
        type: string

      - name: store_id
        sql: store_id
        type: string

      - name: ordered_at
        sql: ordered_at
        type: time

      # The calendar month of the order, a fixed grain for the customer-month predicates.
      - name: ordered_month
        sql: "date_trunc('month', {CUBE}.ordered_at)"
        type: time

      - name: is_new_customer_order
        sql: is_new_customer_order
        type: boolean

    measures:
      - name: orders
        sql: order_id
        type: count_distinct

      # The same count under another name, for customers.lifetime_orders: a query that counts
      # orders.orders and filters on a subquery dimension over that same measure renders the
      # measure as the subquery's column (Cube 1.7.45 Tesseract).
      - name: order_count
        type: count

      - name: revenue_usd
        sql: "order_total_cents / 100.0"
        type: sum

      - name: new_customer_orders
        sql: order_id
        type: count_distinct
        filters:
          - sql: "{CUBE}.is_new_customer_order"

      - name: aov_usd
        sql: "{CUBE.revenue_usd} / NULLIF({CUBE.orders}, 0)"
        type: number

      # Orders per (customer, calendar month), whatever the query's own grain (q10, q13).
      - name: customer_month_orders
        multi_stage: true
        sql: "{CUBE.orders}"
        type: sum
        grain:
          keep_only:
            - customer_id
            - ordered_month

      - name: orders_from_customers_with_10plus_orders_in_month
        multi_stage: true
        sql: "CASE WHEN {CUBE.customer_month_orders} > 10 THEN {CUBE.orders} END"
        type: sum
        grain:
          include:
            - customer_id
            - ordered_month

      # Orders per (customer, store, calendar month) (q14).
      - name: customer_store_month_orders
        multi_stage: true
        sql: "{CUBE.orders}"
        type: sum
        grain:
          keep_only:
            - customer_id
            - store_id
            - ordered_month

      - name: revenue_from_customers_with_10plus_orders_in_store_month
        multi_stage: true
        sql: "CASE WHEN {CUBE.customer_store_month_orders} > 10 THEN {CUBE.revenue_usd} END"
        type: sum
        grain:
          include:
            - customer_id
            - store_id
            - ordered_month
