cubes:
  - name: storefront_sessions
    sql_table: comparison_storefront_sessions

    joins:
      # The same customer's orders placed within 7 days after the session started (q09).
      - name: orders
        relationship: one_to_many
        sql: >
          {CUBE}.customer_id = {orders.customer_id}
          AND {orders.ordered_at} > {CUBE.started_at}
          AND {orders.ordered_at} <= {CUBE.started_at} + INTERVAL '7 day'

      # The same pairing, also requiring the order's store to be the session's store (q15).
      - name: same_store_orders
        relationship: one_to_many
        sql: >
          {CUBE}.customer_id = {same_store_orders.customer_id}
          AND {CUBE}.store_id = {same_store_orders.store_id}
          AND {same_store_orders.ordered_at} > {CUBE.started_at}
          AND {same_store_orders.ordered_at} <= {CUBE.started_at} + INTERVAL '7 day'

    dimensions:
      - name: session_id
        sql: session_id
        type: string
        primary_key: true

      - name: customer_id
        sql: customer_id
        type: string

      - name: store_id
        sql: store_id
        type: string

      - name: started_at
        sql: started_at
        type: time

      - name: orders_within_7d
        sql: "{orders.orders}"
        type: number
        sub_query: true

      - name: same_store_orders_within_7d
        sql: "{same_store_orders.orders}"
        type: number
        sub_query: true

    measures:
      - name: session_starts
        type: count

      - name: converted_sessions_7d
        type: count
        filters:
          - sql: "{orders_within_7d} > 0"

      - name: same_store_converted_sessions_7d
        type: count
        filters:
          - sql: "{same_store_orders_within_7d} > 0"

      - name: session_to_order_conversion_rate_7d
        sql: "1.0 * {converted_sessions_7d} / NULLIF({session_starts}, 0)"
        type: number

      - name: same_store_conversion_rate_7d
        sql: "1.0 * {same_store_converted_sessions_7d} / NULLIF({session_starts}, 0)"
        type: number
