cubes:
  - name: order_lifecycle
    sql_table: comparison_order_lifecycle

    joins:
      - name: stores
        relationship: many_to_one
        sql: "{CUBE}.store_id = {stores.store_id}"

      # The customer-history row valid when the order was delivered (q16).
      - name: customer_history
        relationship: many_to_one
        sql: >
          {CUBE}.customer_id = {customer_history.customer_id}
          AND {CUBE.delivered_at} >= {customer_history.valid_from}
          AND ({CUBE.delivered_at} < {customer_history.valid_to} OR {customer_history.valid_to} IS NULL)

    dimensions:
      - name: order_id
        sql: order_id
        type: string
        primary_key: true

      - name: customer_id
        sql: customer_id
        type: string

      - name: store_id
        sql: store_id
        type: string

      - name: delivered_at
        sql: delivered_at
        type: time

      - name: prepared_at
        sql: prepared_at
        type: time

    measures:
      - name: delivered_revenue
        sql: "order_total_cents / 100.0"
        type: sum
