model:
  id: customer_history
  relation: jaffle_customer_history
  entities:
    customer_history: {}
    customer: {}
    store:
      expr: preferred_store_id
  times:
    valid_from:
      label: Customer history valid from
      column: valid_from
      kind: timestamp
      class: state_time
    valid_to:
      label: Customer history valid to
      column: valid_to
      kind: timestamp
      class: state_time
  dimensions:
    customer_segment:
      as: dimension.jaffle_customer_history_segment
      label: Customer segment
      kind: categorical
      domain:
        - new
        - repeat
        - high_value
