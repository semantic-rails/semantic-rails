examples:
  top_stores_by_revenue:
    question: Top stores by revenue
    query:
      select:
        - measure.jaffle.revenue_usd
      group_by: [dimension.jaffle_store_name]
      order_by:
        - field: revenue_usd
          direction: desc
      limit: 5
    expected_shape:
      columns: [dimension.jaffle_store_name, revenue_usd]
      min_rows: 2
      max_rows: 2

  monthly_revenue:
    question: Monthly revenue
    query:
      select:
        - measure.jaffle.revenue_usd
      time:
        temporal_role: temporal_role.jaffle_order_time
        grain: month
      order_by:
        - field: period
          direction: asc
      limit: 5
    expected_shape:
      columns: [period, revenue_usd]
      min_rows: 5

  aov_by_customer_type:
    question: Average order value by customer type
    query:
      select:
        - metric.sales.aov_usd
      group_by: [dimension.jaffle_customer_type]
      order_by:
        - field: dimension.jaffle_customer_type
          direction: asc
      limit: 10
    expected_shape:
      columns: [dimension.jaffle_customer_type, aov_usd]
      min_rows: 2
      max_rows: 2
