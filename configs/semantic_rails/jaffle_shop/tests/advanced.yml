tests:
  # Scoped aggregate with a metric_predicate filter — what share of
  # revenue came from customers who had at least one session that month?
  revenue_share_from_session_customers_executes:
    kind: query_row_count_bounds
    query:
      select:
        - as: pct_revenue_from_session_customers
          expression:
            kind: ratio
            numerator:
              kind: scoped_aggregate
              measure: measure.jaffle.revenue_usd
              aggregation: sum
              predicates:
                - input: measure.jaffle.session_starts
                  entity: entity.jaffle_customer
                  op: gt
                  value: 0
                  over: period
            denominator:
              kind: scoped_aggregate
              measure: measure.jaffle.revenue_usd
              aggregation: sum
      time:
        temporal_role: temporal_role.jaffle_order_time
        grain: month
        start: "2016-09-01"
        end: "2016-10-01"
    min_rows: 1
    max_rows: 1

  # Distribution shape — p80 monthly revenue per customer, evaluated
  # over only customers with positive monthly revenue.
  p80_customer_revenue_returns_monthly_rows:
    kind: query_row_count_bounds
    query:
      select:
        - as: p80_customer_revenue
          expression:
            kind: distribution
            function: percentile
            p: 0.8
            over:
              kind: entity_value
              entity: entity.jaffle_customer
              input:
                kind: measure
                measure: measure.jaffle.revenue_usd
                aggregation: sum
              where:
                - kind: value_filter
                  op: gt
                  value: 0
      time:
        temporal_role: temporal_role.jaffle_order_time
        grain: month
        start: "2016-09-01"
        end: "2017-01-01"
      order_by:
        - field: period
          direction: asc
    min_rows: 4
    max_rows: 4

  # Arithmetic over two measures — food + drink order counts.
  menu_orders_by_store_snapshot:
    kind: query_matches_snapshot
    query:
      select:
        - as: menu_orders
          expression:
            kind: arithmetic
            op: add
            left: measure.jaffle.food_order_count
            right: measure.jaffle.drink_order_count
      group_by: [dimension.jaffle_store_name]
      order_by:
        - field: dimension.jaffle_store_name
          direction: asc
    expected_rows:
      - dimension.jaffle_store_name: Brooklyn
        menu_orders: 26161
      - dimension.jaffle_store_name: Philadelphia
        menu_orders: 48074

  order_share_from_session_customers_by_store_executes:
    kind: query_row_count_bounds
    query:
      select:
        - as: pct_orders_from_session_customers
          expression:
            kind: ratio
            numerator:
              kind: scoped_aggregate
              measure: measure.jaffle.order_count
              aggregation: count_distinct
              predicates:
                - input: measure.jaffle.session_starts
                  entity: entity.jaffle_customer
                  op: gt
                  value: 0
                  over: period
            denominator:
              kind: scoped_aggregate
              measure: measure.jaffle.order_count
              aggregation: count_distinct
      group_by: [dimension.jaffle_store_name]
      time:
        temporal_role: temporal_role.jaffle_order_time
        grain: month
        start: "2016-09-01"
        end: "2016-10-01"
      order_by:
        - field: dimension.jaffle_store_name
          direction: asc
    min_rows: 1
    max_rows: 1

  # Snapshot-aware scoped aggregate — sum(active_menu_count_eop) only for
  # stores that exceed activity thresholds in each month. Demonstrates
  # composition of a semi_additive measure under multiple metric
  # predicates with `scope_mode: contextual`.
  active_menu_snapshot_for_high_activity_stores_executes:
    kind: query_row_count_bounds
    query:
      select:
        - as: active_menu_count_from_high_activity_stores
          expression:
            kind: scoped_aggregate
            measure: measure.jaffle.active_menu_count_eop
            aggregation: sum
            predicates:
              - input: measure.jaffle.order_count
                entity: entity.jaffle_store
                over: period
                op: gt
                value: 1
              - input: measure.jaffle.session_starts
                entity: entity.jaffle_store
                over: period
                op: gt
                value: 1
      group_by: [dimension.jaffle_store_name]
      time:
        temporal_role: temporal_role.jaffle_inventory_day
        grain: month
      order_by:
        - field: period
          direction: asc
        - field: dimension.jaffle_store_name
          direction: asc
    min_rows: 1
    max_rows: 1

  # End-to-end: a conversion metric (28d adoption funnel) filtered by
  # a per-store predicate built from another conversion metric. Tests
  # that the planner handles metric predicates whose input is itself a
  # conversion metric, not just a measure.
  signup_to_send_28d_for_high_order_rate_stores_executes:
    kind: query_row_count_bounds
    query:
      select:
        - as: signup_to_send_28d
          expression: metric.adoption.signup_to_send_conversion_rate_28d
      group_by: [dimension.jaffle_store_name]
      where:
        - entity: entity.jaffle_store
          having: [{field: metric.sales.session_to_order_conversion_rate_7d_same_store, op: gt, value: 0.9}]
          over: period
      time:
        temporal_role: temporal_role.jaffle_session_started_at
        grain: month
      order_by:
        - field: period
          direction: asc
        - field: dimension.jaffle_store_name
          direction: asc
    min_rows: 1
    max_rows: 1

  entity_hop_ordering_customers_by_store_executes:
    kind: query_row_count_bounds
    query:
      select:
        - as: customers
          expression:
            kind: measure
            measure: measure.jaffle.customer_count
            aggregation: count_distinct
      group_by: [dimension.jaffle_store_name]
      order_by:
        - field: dimension.jaffle_store_name
          direction: asc
    min_rows: 2
    max_rows: 2

  entity_hop_orders_by_product_type_executes:
    kind: query_row_count_bounds
    query:
      select:
        - as: orders
          expression:
            kind: measure
            measure: measure.jaffle.order_count
            aggregation: count_distinct
      group_by: [dimension.jaffle_product_type]
      order_by:
        - field: dimension.jaffle_product_type
          direction: asc
    min_rows: 1

  entity_hop_orders_by_product_type_with_time_executes:
    kind: query_row_count_bounds
    query:
      select:
        - as: orders
          expression:
            kind: measure
            measure: measure.jaffle.order_count
            aggregation: count_distinct
      group_by: [dimension.jaffle_product_type]
      time:
        temporal_role: temporal_role.jaffle_order_time
        grain: month
      order_by:
        - field: period
          direction: asc
        - field: dimension.jaffle_product_type
          direction: asc
      limit: 10
    min_rows: 1
    max_rows: 10

  entity_hop_orders_by_product_type_with_root_filter_executes:
    kind: query_row_count_bounds
    query:
      select:
        - as: orders
          expression:
            kind: measure
            measure: measure.jaffle.order_count
            aggregation: count_distinct
      group_by: [dimension.jaffle_product_type]
      where:
        - field: dimension.jaffle_store_name
          op: is
          value: Brooklyn
      order_by:
        - field: dimension.jaffle_product_type
          direction: asc
    min_rows: 1

  entity_hop_customers_by_product_type_executes:
    kind: query_row_count_bounds
    query:
      select:
        - as: customers
          expression:
            kind: measure
            measure: measure.jaffle.customer_count
            aggregation: count_distinct
      group_by: [dimension.jaffle_product_type]
      order_by:
        - field: dimension.jaffle_product_type
          direction: asc
    min_rows: 1

  entity_hop_customers_by_product_type_with_customer_filter_executes:
    kind: query_row_count_bounds
    query:
      select:
        - as: customers
          expression:
            kind: measure
            measure: measure.jaffle.customer_count
            aggregation: count_distinct
      group_by: [dimension.jaffle_product_type]
      where:
        - field: dimension.jaffle_customer_type
          op: is
          value: repeat
      order_by:
        - field: dimension.jaffle_product_type
          direction: asc
    min_rows: 1

  conversion_by_converted_product_type_executes:
    kind: query_row_count_bounds
    query:
      select:
        - as: signup_to_send_28d
          expression: metric.adoption.signup_to_send_conversion_rate_28d
      group_by: [dimension.jaffle_product_type]
      time:
        temporal_role: temporal_role.jaffle_session_started_at
        grain: month
      order_by:
        - field: period
          direction: asc
        - field: dimension.jaffle_product_type
          direction: asc
      limit: 10
    min_rows: 1
    max_rows: 10

  active_menu_snapshot_for_session_stores_executes:
    kind: query_row_count_bounds
    query:
      select:
        - as: active_menu_count_from_session_stores
          expression:
            kind: scoped_aggregate
            measure: measure.jaffle.active_menu_count_eop
            aggregation: sum
            predicates:
              - input: measure.jaffle.session_starts
                entity: entity.jaffle_store
                over: period
                op: gt
                value: 0
      group_by: [dimension.jaffle_store_name]
      time:
        temporal_role: temporal_role.jaffle_inventory_day
        grain: month
      order_by:
        - field: period
          direction: asc
        - field: dimension.jaffle_store_name
          direction: asc
      limit: 10
    min_rows: 1
    max_rows: 10

  orders_with_a_beverage_by_store_snapshot:
    # An order-grain measure filtered by an item dimension is a semi-join: each
    # order counts once, however many beverages it holds.
    kind: query_matches_snapshot
    query:
      select:
        - expression: measure.jaffle.order_count
          as: orders
      where:
        - {field: dimension.jaffle_item_product_type, op: is, value: beverage}
      group_by: [dimension.jaffle_store_name]
    expected_rows:
      - dimension.jaffle_store_name: Brooklyn
        orders: 20117
      - dimension.jaffle_store_name: Philadelphia
        orders: 35857

  revenue_of_orders_with_a_beverage_by_store_snapshot:
    # Rounded to cents: the sum of the per-order doubles varies in its last digits.
    kind: query_matches_snapshot
    query:
      select:
        - as: revenue_usd
          expression:
            kind: call
            name: ROUND
            args:
              - measure.jaffle.revenue_usd
              - {kind: literal, value: 2}
      where:
        - {field: dimension.jaffle_item_product_type, op: is, value: beverage}
      group_by: [dimension.jaffle_store_name]
    expected_rows:
      - dimension.jaffle_store_name: Brooklyn
        revenue_usd: 238963.11
      - dimension.jaffle_store_name: Philadelphia
        revenue_usd: 452138.42

  order_revenue_by_product_type_snapshot:
    # Grouped by a product dimension, each order counts once, with its whole
    # total, under every product type it holds, so the groups overlap: their
    # sum is above all revenue (745893.03). Item revenue splits the totals
    # instead. Rounded to cents as above. From data/jaffle_shop.duckdb:
    #   SELECT t.product_type, ROUND(SUM(o.order_total_cents / 100.0), 2)
    #   FROM jaffle_order o JOIN (SELECT DISTINCT i.order_id, p.product_type
    #     FROM jaffle_item i JOIN jaffle_product p ON p.sku = i.sku) t
    #     ON t.order_id = o.order_id GROUP BY 1
    kind: query_matches_snapshot
    query:
      select:
        - as: revenue
          expression:
            kind: call
            name: ROUND
            args:
              - measure.jaffle.revenue_usd
              - {kind: literal, value: 2}
      group_by: [dimension.jaffle_product_type]
    expected_rows:
      - dimension.jaffle_product_type: beverage
        revenue: 691101.53
      - dimension.jaffle_product_type: jaffle
        revenue: 485267.73

  order_revenue_by_product_name_snapshot:
    # The same through each item's product, by its name: the SQL above with
    # p.product_name for p.product_type.
    kind: query_matches_snapshot
    query:
      select:
        - as: revenue
          expression:
            kind: call
            name: ROUND
            args:
              - measure.jaffle.revenue_usd
              - {kind: literal, value: 2}
      group_by: [dimension.jaffle_product_name]
    expected_rows:
      - {dimension.jaffle_product_name: adele-ade, revenue: 180513.26}
      - {dimension.jaffle_product_name: chai and mighty, revenue: 190525.27}
      - {dimension.jaffle_product_name: doctor stew, revenue: 152757.33}
      - {dimension.jaffle_product_name: flame impala, revenue: 165933.26}
      - {dimension.jaffle_product_name: "for richer or pourover ", revenue: 219100.91}
      - {dimension.jaffle_product_name: mel-bun, revenue: 161245.95}
      - {dimension.jaffle_product_name: "nutellaphone who dis?", revenue: 154085.12}
      - {dimension.jaffle_product_name: tangaroo, revenue: 203644.15}
      - {dimension.jaffle_product_name: the krautback, revenue: 156641.3}
      - {dimension.jaffle_product_name: vanilla ice, revenue: 204183.27}

  ordering_customers_by_item_product_type_snapshot:
    # Grouped by an item dimension, a distinct count counts each order (here,
    # each customer) once in every product type it bought.
    kind: query_matches_snapshot
    query:
      select:
        - expression: measure.jaffle.ordering_customer_count
          as: customers
      group_by: [dimension.jaffle_item_product_type]
    expected_rows:
      - dimension.jaffle_item_product_type: beverage
        customers: 939
      - dimension.jaffle_item_product_type: jaffle
        customers: 678
