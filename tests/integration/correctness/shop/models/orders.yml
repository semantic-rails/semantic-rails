model:
  id: orders
  label: Orders
  relation: orders
  default_variant: tx
  entities: {order: {}, customer: {}}
  times:
    ordered_at: {label: Order time, column: ordered_at, kind: timestamp, class: event_time,
      supported_grains: [day, week, month, quarter, year], default: true}
  dimensions:
    store_id: {label: Store, kind: categorical}
  measures:
    revenue: {label: Revenue, kind: aggregate, expr: amount, accumulation: {kind: flow},
      value_type: currency, rollup: additive}
    order_count: {label: Orders, kind: entity_count, entity_key: order_id,
      accumulation: {kind: flow}, rollup: additive}
    average_order: {label: Average order, kind: aggregate, expr: amount, default_agg: avg,
      value_type: currency}
    average_days_to_close:
      label: Average days to close
      kind: aggregate
      default_agg: avg
      expr: {kind: call, name: DATE_DIFF, args: [{kind: literal, value: day},
        {kind: column, column: ordered_at}, {kind: column, column: closed_at}]}
    smallest_order: {label: Smallest order, kind: aggregate, expr: amount, default_agg: min,
      value_type: currency}
    largest_order: {label: Largest order, kind: aggregate, expr: amount, default_agg: max,
      value_type: currency}
    # Conditional counts, like COUNT(CASE WHEN ... THEN order_id END): 0 for a customer whose
    # orders all fall short, never NULL. Two orders reach 10 and none reaches 1000.
    large_order_count: {label: Large orders, kind: entity_count, accumulation: {kind: flow},
      expr: {kind: case, whens: [{when: {kind: comparison, op: '>=',
        left: {kind: column, column: amount}, right: {kind: literal, value: 10}},
        then: {kind: column, column: order_id}}], else: {kind: literal, value: null}}}
    huge_order_count: {label: Huge orders, kind: entity_count, accumulation: {kind: flow},
      expr: {kind: case, whens: [{when: {kind: comparison, op: '>=',
        left: {kind: column, column: amount}, right: {kind: literal, value: 1000}},
        then: {kind: column, column: order_id}}], else: {kind: literal, value: null}}}
  variants:
    tx: {relation: orders, grain: {time: transaction, entities: [order]}, covers: inherit_all}
    monthly:
      relation: orders_monthly
      grain: {time: month, entities: [order]}
      time: {role: ordered_at, column: month_start}
      excludes: {entities: [order, customer]}
      columns: {store_id: store_id, revenue: revenue, order_count: order_count}
      eligible_time_grains: [month, quarter, year]
      equivalence: {kind: exact}
