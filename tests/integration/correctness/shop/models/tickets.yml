model:
  id: tickets
  relation: tickets
  entities: {ticket: {}}
  zero_through: {loaded: ticket_loads.through_day}
  times:
    opened_at: {column: opened_at, kind: timestamp, class: event_time, default: true}
  dimensions:
    minutes: {label: Minutes, kind: integer}
  measures:
    tickets_opened: {kind: entity_count, entity_key: ticket_id, accumulation: {kind: flow}}
    ticket_minutes: {kind: aggregate, expr: minutes}
