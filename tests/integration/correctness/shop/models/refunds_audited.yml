# The same refunds loaded through ticket_audits, a log no run has written to yet.
model:
  id: refunds_audited
  relation: refunds
  entities: {refund_audited: {}, order: {}}
  zero_through: {loaded: ticket_audits.through_day}
  measures:
    audited_refunds: {kind: entity_count, entity_key: refund_id, accumulation: {kind: flow},
      times: [temporal_role.shop_order_ordered_at]}
