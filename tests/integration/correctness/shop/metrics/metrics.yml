metrics:
  closed_orders:
    as: metric.shop.closed_orders
    label: Orders on close time
    kind: derived
    value_type: count
    compatible_temporal_roles: [temporal_role.shop_order_ordered_at, temporal_role.shop_order_closed_at]
    expression: {measure: measure.shop.window_order_count, temporal_role: temporal_role.shop_order_closed_at}
  shop.order_revenue_median:
    as: metric.shop.order_revenue_median
    label: Median order revenue
    value_type: currency
    kind: derived
    expression:
      kind: distribution
      function: median
      over: {kind: entity_value, entity: entity.shop_order, input: {measure: measure.shop.revenue}}
  shop.average_order_value:
    as: metric.shop.average_order_value
    label: Average order value
    kind: ratio
    numerator: revenue
    denominator: order_count
    value_type: currency
    temporal_role: temporal_role.shop_order_ordered_at
  shop.signup_to_order_7d:
    as: metric.shop.signup_to_order_7d
    label: Signup to order within 7 days
    kind: conversion
    temporal_role: temporal_role.shop_customer_signed_up_at
    value_type: percent
    expression:
      kind: conversion
      entity: entity.shop_customer
      window: {unit: day, value: 7}
      matching_mode: first_converted_after_base
      base: {kind: aggregate, measure: signup_count}
      converted: {kind: aggregate, measure: order_count}
  # Tickets that took over a working day (480 minutes): none has yet, so the filter has never
  # matched a row. The tickets model names its load log, which says which weeks are loaded.
  long_tickets:
    as: metric.shop.long_tickets
    label: Long tickets
    kind: derived
    value_type: count
    temporal_role: temporal_role.shop_ticket_opened_at
    expression:
      kind: aggregate
      measure: measure.shop.tickets_opened
      aggregation: count_distinct
      filter: {all: [{field: dimension.shop_ticket_minutes, op: gt, value: 480}]}
  long_ticket_share:
    as: metric.shop.long_ticket_share
    label: Share of tickets that ran long
    kind: ratio
    numerator: long_tickets
    denominator: tickets_opened
    value_type: number
    temporal_role: temporal_role.shop_ticket_opened_at
