    expect: answer
    why: Scan weight of orders that had a refund. EXISTS on the refunds never repeats a scan for order 2's two refunds.
    cites: [tests/integration/correctness/shop/models/shipment_scans.yml#model.measures.scan_weight, tests/integration/correctness/shop/models/refunds.yml#model.dimensions.refund_type, docs/QUERY_CALL.md#entity-filters]
