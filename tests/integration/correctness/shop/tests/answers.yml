  shop/conversion_by_month:
    kind: query_matches_snapshot
    expect: answer
    why: Freeze the declared inputs and independent reference for conversion by month.
    cites:
      - tests/integration/correctness/shop/models/signups.yml#model.times.signed_up_at
      - tests/integration/correctness/shop/metrics/metrics.yml#metrics
      - tests/integration/correctness/shop/models/orders.yml#model.measures.revenue
      - tests/integration/correctness/shop/models/orders.yml#model.measures.order_count
      - tests/integration/correctness/shop/models/signups.yml#model.measures.signup_count
      - tests/integration/correctness/conftest.py#CLOCKS
      - docs/QUERY_IR_SCHEMA.md#empty-groups-null-or-0
      - docs/QUERY_IR_SCHEMA.md#selectexpression-discriminated-union
      - docs/QUERY_IR_SCHEMA.md#timeblock
    tags: [time-window]
    variant: utc_authored
    query:
      select:
      - expression:
          metric: metric.shop.signup_to_order_7d
        as: rate
      time:
        temporal_role: temporal_role.shop_customer_signed_up_at
        grain: month
    reference_sql: |-
      WITH c AS (
            SELECT s.signed_up_at, (
              SELECT MIN(o.ordered_at) FROM orders AS o
              WHERE o.customer_id = s.customer_id AND o.ordered_at >= s.signed_up_at
            ) AS converted_at
            FROM signups AS s
          )
          SELECT date_trunc('month', signed_up_at) AS b,
            1.0 * SUM(CASE WHEN converted_at < signed_up_at + INTERVAL '7 day' THEN 1 ELSE 0 END)
              / CAST(COUNT(*) AS DOUBLE PRECISION) AS rate
          FROM c GROUP BY 1
    expected_rows:
      - {temporal_role.shop_customer_signed_up_at__month: '2023-10-01T00:00:00', rate: 1}
      - {temporal_role.shop_customer_signed_up_at__month: '2023-11-01T00:00:00', rate: 0}
