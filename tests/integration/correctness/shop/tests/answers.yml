  shop/row-grain-bridge-distinct-parents:
    kind: query_matches_snapshot
    expect: answer
    why: Orders by tag through a link table with no key. Order 1's duplicate gift link is absorbed by the distinct order count.
    cites: [tests/integration/correctness/shop/models/orders.yml#model.measures.order_count, tests/integration/correctness/shop/models/tags.yml#model.dimensions.tag_name]
    tags: [row-grain]
    query:
