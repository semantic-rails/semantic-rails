  shop/prior_week:
    kind: query_matches_snapshot
    expect: answer
    why: Freeze the declared inputs and independent reference for prior week.
    cites:
      - tests/integration/correctness/shop/models/orders.yml#model.measures.revenue
      - tests/integration/correctness/shop/models/orders.yml#model.times.ordered_at
      - tests/integration/correctness/conftest.py#CLOCKS
      - docs/QUERY_IR_SCHEMA.md#empty-groups-null-or-0
      - docs/QUERY_IR_SCHEMA.md#selectexpression-discriminated-union
      - docs/QUERY_IR_SCHEMA.md#timeblock
    tags: [time-window]
    variant: utc_authored
    query:
      select:
      - expression:
          kind: prior_period
          input:
            measure: measure.shop.revenue
          offset:
            unit: week
            value: 1
        as: prior
      time:
        temporal_role: temporal_role.shop_order_ordered_at
        grain: week
    reference_sql: |-
      WITH m AS (
                SELECT date_trunc('week', o.ordered_at) AS b, SUM(o.amount) AS v
                FROM orders AS o GROUP BY 1
              ),
              s AS (SELECT g.b FROM generate_series((SELECT MIN(b) FROM m), (SELECT MAX(b) FROM m), INTERVAL '7 day') AS g(b))
              SELECT s.b, CASE WHEN s.b - INTERVAL '7 day' < (SELECT MIN(b) FROM s) THEN NULL ELSE (SELECT CASE WHEN COUNT(*) = 0 THEN 0 ELSE MAX(m.v) END FROM m WHERE m.b = s.b - INTERVAL '7 day') END FROM s
