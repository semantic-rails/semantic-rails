  shop/unknown_day:
    kind: query_matches_snapshot
    expect: answer
    why: Order 7, alone on 2024-05-06, has an unknown amount, so that day's revenue is NULL while its order counts; the named window also answers 2024-05-07, inside the loaded data with no order, as 0.
    cites:
      - tests/integration/correctness/shop/models/orders.yml#model.measures.order_count
      - tests/integration/correctness/shop/models/orders.yml#model.measures.revenue
      - tests/integration/correctness/shop/models/orders.yml#model.times.ordered_at
