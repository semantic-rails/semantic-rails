fixture:
  tables: [orders, refunds, signups, dim_fiscal, customer_history, account_days, tickets, ticket_loads, ticket_audits, ticket_exports, shipment_scans, order_tags, tags, room_rows, people, room_bookings, stores]
  data_sha256: 9198ccea1473642464181d3d0b8de4e880a4ccc20144f01dcff752bf2cf6aefb
tests:
  shop/sibling-input-clock-filter-keeps-independent-history:
    kind: query_matches_snapshot
    expect: answer
    why: The recent aggregate cuts its own population while the cumulative input retains November history.
    cites: [docs/QUERY_CALL.md#select, tests/integration/correctness/shop/models/orders.yml#model.measures.revenue]
    tags: [time-window]
    query:
      select:
        - as: history
          expression: {kind: cumulative, input: measure.shop.revenue}
        - as: recent
          expression:
            kind: aggregate
            measure: measure.shop.revenue
            filter:
              all: [{field: dimension.shop_order_ordered_at, op: gte, value: '2023-12-01'}]
      having:
        - {field: history, op: gte, value: 22}
      time: {temporal_role: temporal_role.shop_order_ordered_at, grain: month, end: '2024-01-01'}
    expected_rows:
      - {period: '2023-12-01', history: 22, recent: 7}
    reference_sql: |
      WITH monthly AS (
        SELECT date_trunc('month', ordered_at) AS period, SUM(amount) AS revenue,
          SUM(CASE WHEN ordered_at >= TIMESTAMP '2023-12-01' THEN amount ELSE 0 END) AS recent
        FROM orders WHERE ordered_at < TIMESTAMP '2024-01-01' GROUP BY 1
      ), history AS (
        SELECT period, SUM(revenue) OVER (ORDER BY period ROWS UNBOUNDED PRECEDING) AS total, recent
        FROM monthly
      )
      SELECT period, total, recent FROM history WHERE total >= 22
  shop/metric-input-clock-filter-keeps-independent-history:
    kind: query_matches_snapshot
    expect: answer
    why: Filtering the recent metric output does not remove November from the cumulative input.
    cites: [docs/QUERY_CALL.md#select, tests/integration/correctness/shop/models/orders.yml#model.measures.revenue]
    tags: [time-window]
    query:
      select:
        - {as: history, expression: {kind: cumulative, input: measure.shop.revenue}}
        - as: recent
          expression:
            kind: aggregate
            measure: measure.shop.revenue
            filter:
              all: [{field: dimension.shop_order_ordered_at, op: gte, value: '2023-12-01'}]
      having:
        - {field: recent, op: gt, value: 0}
      time: {temporal_role: temporal_role.shop_order_ordered_at, grain: month, end: '2024-01-01'}
    expected_rows:
      - {period: '2023-12-01', history: 22, recent: 7}
    reference_sql: |
      WITH monthly AS (
        SELECT date_trunc('month', ordered_at) AS period, SUM(amount) AS revenue,
          SUM(CASE WHEN ordered_at >= TIMESTAMP '2023-12-01' THEN amount ELSE 0 END) AS recent
        FROM orders WHERE ordered_at < TIMESTAMP '2024-01-01' GROUP BY 1
      ), history AS (
        SELECT period, SUM(revenue) OVER (ORDER BY period ROWS UNBOUNDED PRECEDING) AS total, recent
        FROM monthly
      )
      SELECT period, total, recent FROM history WHERE recent > 0
  shop/cumulative-input-clock-filter-refuses-truncated-history:
    kind: validate_fails_with_code
    expect: refuse
    code: CUMULATIVE_TIME_FILTER_UNSUPPORTED
    why: A lower bound on the input clock removes history needed by the cumulative sum.
    cites: [docs/QUERY_CALL.md#select, tests/integration/correctness/shop/models/orders.yml#model.times.ordered_at]
    tags: [time-window]
    query:
      select:
        - as: total
          expression:
            kind: cumulative
            input:
              kind: aggregate
              measure: measure.shop.revenue
              filter:
                all: [{field: dimension.shop_order_ordered_at, op: gte, value: '2023-12-01'}]
      time: {temporal_role: temporal_role.shop_order_ordered_at, grain: month}
  shop/rolling-input-clock-filter-refuses-truncated-history:
    kind: validate_fails_with_code
    expect: refuse
    code: WINDOWED_TIME_FILTER_UNSUPPORTED
    why: A lower bound on the input clock removes earlier buckets needed by the rolling sum.
    cites: [docs/QUERY_CALL.md#select, tests/integration/correctness/shop/models/orders.yml#model.times.ordered_at]
    tags: [time-window]
    query:
      select:
        - as: total
          expression:
            kind: rolling
            window: {unit: month, value: 2}
            input:
              kind: aggregate
              measure: measure.shop.revenue
              filter:
                all: [{field: dimension.shop_order_ordered_at, op: gte, value: '2023-12-01'}]
      time: {temporal_role: temporal_role.shop_order_ordered_at, grain: month}
  shop/distribution-value-filter-refuses-a-dimension:
    kind: validate_fails_with_code
    expect: refuse
    code: INVALID_QUERY
    why: A field condition must not be applied to the computed per-order value.
    cites:
      - tests/integration/correctness/shop/models/orders.yml#model.measures.revenue
      - docs/QUERY_CALL.md#per-entity-value-filters
    tags: [refusal]
    query:
      select:
        - as: average
          expression:
            kind: distribution
            function: avg
            over:
              kind: entity_value
              entity: entity.shop_order
              input: measure.shop.revenue
              where: [{field: dimension.shop_order_store_id, op: '=', value: a}]
  shop/net-growth-from-a-never-matched-count:
    kind: query_matches_snapshot
    expect: answer
    why: Three store a orders minus a conditional count with no match anywhere is three.
    cites: [tests/integration/correctness/shop/models/orders.yml#model.measures.store_a_orders, docs/QUERY_CALL.md#empty-groups-null-or-0]
    tags: [null-vs-zero, time-window]
    query:
      select:
        - {as: a, expression: measure.shop.store_a_orders}
        - {as: absent, expression: measure.shop.huge_order_count}
        - as: net
          expression: {kind: arithmetic, op: subtract, left: measure.shop.store_a_orders, right: measure.shop.huge_order_count}
      time: {temporal_role: temporal_role.shop_order_ordered_at, start: '2023-11-01', end: '2024-02-01'}
    expected_rows: [{a: 3, absent: 0, net: 3}]
    reference_sql: |
      SELECT a, absent, a - absent FROM (
        SELECT COUNT(CASE WHEN store_id = 'a' THEN order_id END) AS a,
          COUNT(CASE WHEN amount >= 1000 THEN order_id END) AS absent
        FROM orders WHERE ordered_at >= TIMESTAMP '2023-11-01' AND ordered_at < TIMESTAMP '2024-02-01'
      ) counts
  shop/distribution-sum-preserves-an-explicit-else-zero:
    kind: query_matches_snapshot
    expect: answer
    why: A nonmatching order contributes a measured zero before the per-customer values are summed.
    cites: [tests/integration/correctness/shop/models/orders.yml#model.measures.store_a_amount, docs/QUERY_CALL.md#empty-groups-null-or-0]
    tags: [null-vs-zero, time-window]
    query:
      select:
        - as: total
          expression:
            kind: distribution
            function: sum
            over: {kind: entity_value, entity: entity.shop_customer, input: measure.shop.store_a_amount}
      time: {temporal_role: temporal_role.shop_order_ordered_at, grain: week, start: '2023-11-20', end: '2023-11-27'}
    expected_rows: [{period: '2023-11-20', total: 0}]
    reference_sql: |
      SELECT week, SUM(value) FROM (
        SELECT date_trunc('week', ordered_at) AS week, customer_id,
          SUM(CASE WHEN store_id = 'a' THEN amount ELSE 0 END) AS value
        FROM orders WHERE ordered_at >= TIMESTAMP '2023-11-20' AND ordered_at < TIMESTAMP '2023-11-27'
        GROUP BY 1, 2
      ) per_customer GROUP BY 1
  shop/rollup-without-a-measure-column-leaves-it-on-the-base-table:
    kind: query_matches_snapshot
    expect: answer
    why: The monthly rollup's columns hold revenue but no store-a amount, so the store-a amount reads the orders table beside the rollup's revenue.
    cites: [tests/integration/correctness/shop/models/orders.yml#model.measures.store_a_amount, tests/integration/correctness/shop/models/orders.yml#model.variants.monthly.columns, docs/PACKAGE_AUTHORING.md#physical-variants-and-aggregate-routing]
    query:
      select:
        - {as: store_a, expression: measure.shop.store_a_amount}
        - {as: revenue, expression: measure.shop.revenue}
      time: {temporal_role: temporal_role.shop_order_ordered_at, grain: month}
    expected_rows:
      - {period: '2023-11-01', store_a: 10, revenue: 15}
      - {period: '2023-12-01', store_a: 7, revenue: 7}
      - {period: '2024-01-01', store_a: 20, revenue: 20}
      - {period: '2024-03-01', store_a: 4, revenue: 12}
      - {period: '2024-05-01', store_a: 0, revenue: 6}
      - {period: '2024-06-01', store_a: 0, revenue: 3}
      - {period: '2024-07-01', store_a: 0, revenue: 9}
      - {period: '2024-08-01', store_a: 2, revenue: 2}
    reference_sql: |
      SELECT date_trunc('month', ordered_at), SUM(CASE WHEN store_id = 'a' THEN amount ELSE 0 END),
        SUM(amount)
      FROM orders GROUP BY 1
  shop/window-total-observes-a-conditional-count-outside-the-window:
    kind: query_matches_snapshot
    expect: answer
    why: Store b has orders elsewhere in the loaded range, so its absent orders in this window read zero and the difference is one.
    cites: &conditional_window_cites [tests/integration/correctness/shop/models/orders.yml#model.measures.store_a_orders, tests/integration/correctness/shop/models/orders.yml#model.measures.store_b_orders, docs/QUERY_CALL.md#empty-groups-null-or-0]
    tags: [null-vs-zero, time-window]
    query: &conditional_window
      select:
        - {as: a, expression: measure.shop.store_a_orders}
        - {as: b, expression: measure.shop.store_b_orders}
        - as: net
          expression: {kind: arithmetic, op: subtract, left: measure.shop.store_a_orders, right: measure.shop.store_b_orders}
      time: {temporal_role: temporal_role.shop_order_ordered_at, start: '2023-11-27', end: '2023-12-04'}
    expected_rows: &conditional_window_rows [{a: 1, b: 0, net: 1}]
    reference_sql: &conditional_window_sql |
      SELECT a, b, a - b FROM (
        SELECT COUNT(CASE WHEN store_id = 'a' THEN order_id END) AS a,
          COUNT(CASE WHEN store_id = 'b' THEN order_id END) AS b
        FROM orders WHERE ordered_at >= TIMESTAMP '2023-11-27' AND ordered_at < TIMESTAMP '2023-12-04'
      ) counts
  shop/relative-window-total-observes-a-conditional-count-outside-the-window:
    kind: query_matches_snapshot
    expect: answer
    why: The last complete week uses the same observation and coverage rule as explicit bounds.
    cites: *conditional_window_cites
    tags: [null-vs-zero, time-window]
    query:
      <<: *conditional_window
      time: {temporal_role: temporal_role.shop_order_ordered_at, last: {unit: week, value: 1}}
    now: '2023-12-04T00:00:00+00:00'
    expected_rows: *conditional_window_rows
    reference_sql: *conditional_window_sql
  shop/top-stores-with-cutoff-ties:
    kind: query_matches_snapshot
    expect: answer
    why: Stores with equal order counts rank by the remaining group_by columns, keeping a stable subset.
    cites: [tests/integration/correctness/shop/models/orders.yml#model.measures.order_count, docs/QUERY_CALL.md#order_by]
    tags: [time-window]
    query:
      select: [{expression: measure.shop.order_count, as: orders}]
      group_by: [dimension.shop_order_store_id]
      time: {temporal_role: temporal_role.shop_order_ordered_at, start: '2023-11-01', end: '2023-12-01'}
      order_by: [{field: orders, direction: desc}]
      limit: 1
    expected_rows: [{dimension.shop_order_store_id: a, orders: 1}]
    reference_sql: |
      SELECT store_id, COUNT(order_id) AS orders
      FROM orders
      WHERE ordered_at >= TIMESTAMP '2023-11-01' AND ordered_at < TIMESTAMP '2023-12-01'
      GROUP BY store_id
      ORDER BY orders DESC, store_id ASC NULLS LAST LIMIT 1
  shop/top-store-months-break-ties-by-store-then-period:
    kind: query_matches_snapshot
    expect: answer
    why: Every store month has one order, so the cut-off keeps store a's first three months, ordered by store and then period, ascending.
    cites: [tests/integration/correctness/shop/models/orders.yml#model.measures.order_count, docs/QUERY_CALL.md#order_by]
    tags: [time-window]
    query:
      select: [{expression: measure.shop.order_count, as: orders}]
      group_by: [dimension.shop_order_store_id]
      time: {temporal_role: temporal_role.shop_order_ordered_at, grain: month}
      order_by: [{field: orders, direction: desc}]
      limit: 3
    expected_rows:
      - {dimension.shop_order_store_id: a, period: '2023-11-01', orders: 1}
      - {dimension.shop_order_store_id: a, period: '2023-12-01', orders: 1}
      - {dimension.shop_order_store_id: a, period: '2024-01-01', orders: 1}
    reference_sql: |
      SELECT store_id, date_trunc('month', ordered_at) AS period, COUNT(order_id) AS orders
      FROM orders
      GROUP BY 1, 2
      ORDER BY orders DESC, store_id ASC NULLS LAST, period ASC LIMIT 3
  shop/largest-order-by-store-overrides-the-revenue-statistic:
    kind: query_matches_snapshot
    expect: answer
    why: Revenue allows max, so the override reads each store's largest order amount, and the answer states the statistic and the rows it read.
    cites: [tests/integration/correctness/shop/models/orders.yml#model.measures.revenue, docs/QUERY_CALL.md#inline-expression-kinds]
    query:
      select: [{expression: {kind: measure, measure: measure.shop.revenue, aggregation: max}, as: largest}]
      group_by: [dimension.shop_order_store_id]
    expected_rows:
      - {dimension.shop_order_store_id: null, largest: 6}
      - {dimension.shop_order_store_id: a, largest: 20}
      - {dimension.shop_order_store_id: b, largest: 9}
    reference_sql: |
      SELECT store_id, MAX(amount) AS largest
      FROM orders
      GROUP BY store_id
  shop/store-share-of-orders-is-a-fraction-of-the-kept-total:
    kind: query_matches_snapshot
    expect: answer
    why: Each store's orders divided by the orders of every store the query keeps, the unknown store included; the shares add up to 1.
    cites: [tests/integration/correctness/shop/models/orders.yml#model.measures.order_count, docs/QUERY_CALL.md#inline-expression-kinds]
    query:
      select:
        - {expression: measure.shop.order_count, as: orders}
        - {expression: {kind: share, input: measure.shop.order_count, over: [dimension.shop_order_store_id]}, as: order_share}
      group_by: [dimension.shop_order_store_id]
    expected_rows:
      - {dimension.shop_order_store_id: null, orders: 1, order_share: 0.09090909090909091}
      - {dimension.shop_order_store_id: a, orders: 6, order_share: 0.5454545454545454}
      - {dimension.shop_order_store_id: b, orders: 4, order_share: 0.36363636363636365}
    reference_sql: |
      SELECT store_id, COUNT(order_id) AS orders,
        COUNT(order_id) / CAST(SUM(COUNT(order_id)) OVER () AS DOUBLE PRECISION) AS order_share
      FROM orders
      GROUP BY store_id
  shop/store-customers-over-every-month-count-each-customer-once:
    kind: query_matches_snapshot
    expect: answer
    why: A total over period is the store's distinct buying customers across all of its months, on each of its monthly rows; adding the months up would count customer 101 twice at store a (6, not 5). The unknown store meets its own total.
    cites: [tests/integration/correctness/shop/models/orders.yml#model.measures.buying_customers, docs/QUERY_CALL.md#inline-expression-kinds]
    query:
      select:
        - {expression: measure.shop.buying_customers, as: customers}
        - {expression: {kind: total, input: measure.shop.buying_customers, over: [period]}, as: store_customers}
      group_by: [dimension.shop_order_store_id]
      time: {temporal_role: temporal_role.shop_order_ordered_at, grain: month}
    expected_rows:
      - {dimension.shop_order_store_id: a, period: '2023-11-01', period_partial: false, customers: 1, store_customers: 5}
      - {dimension.shop_order_store_id: a, period: '2023-12-01', period_partial: false, customers: 1, store_customers: 5}
      - {dimension.shop_order_store_id: a, period: '2024-01-01', period_partial: false, customers: 1, store_customers: 5}
      - {dimension.shop_order_store_id: a, period: '2024-03-01', period_partial: false, customers: 1, store_customers: 5}
      - {dimension.shop_order_store_id: a, period: '2024-05-01', period_partial: false, customers: 1, store_customers: 5}
      - {dimension.shop_order_store_id: a, period: '2024-08-01', period_partial: false, customers: 1, store_customers: 5}
      - {dimension.shop_order_store_id: b, period: '2023-11-01', period_partial: false, customers: 1, store_customers: 4}
      - {dimension.shop_order_store_id: b, period: '2024-03-01', period_partial: false, customers: 1, store_customers: 4}
      - {dimension.shop_order_store_id: b, period: '2024-06-01', period_partial: false, customers: 1, store_customers: 4}
      - {dimension.shop_order_store_id: b, period: '2024-07-01', period_partial: false, customers: 1, store_customers: 4}
      - {dimension.shop_order_store_id: null, period: '2024-05-01', period_partial: false, customers: 1, store_customers: 1}
    reference_sql: |
      SELECT o.store_id, CAST(date_trunc('month', o.ordered_at) AS DATE) AS period,
        COUNT(DISTINCT o.customer_id) AS customers, s.store_customers
      FROM orders AS o
      JOIN (SELECT store_id, COUNT(DISTINCT customer_id) AS store_customers FROM orders GROUP BY store_id) AS s
        ON s.store_id IS NOT DISTINCT FROM o.store_id
      GROUP BY o.store_id, CAST(date_trunc('month', o.ordered_at) AS DATE), s.store_customers
  shop/quarter-revenue-across-stores-beside-each-store:
    kind: query_matches_snapshot
    expect: answer
    why: A total over the store is the quarter's revenue across every store the call keeps, the unknown store included, on each store's row. Store a's second-quarter revenue is unknown (its one order has no amount); the quarter's total sums the amounts it knows.
    cites: [tests/integration/correctness/shop/models/orders.yml#model.measures.revenue, docs/QUERY_CALL.md#inline-expression-kinds]
    query:
      select:
        - {expression: measure.shop.revenue, as: revenue}
        - {expression: {kind: total, input: measure.shop.revenue, over: [dimension.shop_order_store_id]}, as: quarter_revenue}
      group_by: [dimension.shop_order_store_id]
      time: {temporal_role: temporal_role.shop_order_ordered_at, grain: quarter}
    expected_rows:
      - {dimension.shop_order_store_id: a, period: '2023-10-01', period_partial: false, revenue: 17, quarter_revenue: 22}
      - {dimension.shop_order_store_id: a, period: '2024-01-01', period_partial: false, revenue: 24, quarter_revenue: 32}
      - {dimension.shop_order_store_id: a, period: '2024-04-01', period_partial: false, revenue: null, quarter_revenue: 9}
      - {dimension.shop_order_store_id: a, period: '2024-07-01', period_partial: false, revenue: 2, quarter_revenue: 11}
      - {dimension.shop_order_store_id: b, period: '2023-10-01', period_partial: false, revenue: 5, quarter_revenue: 22}
      - {dimension.shop_order_store_id: b, period: '2024-01-01', period_partial: false, revenue: 8, quarter_revenue: 32}
      - {dimension.shop_order_store_id: b, period: '2024-04-01', period_partial: false, revenue: 3, quarter_revenue: 9}
      - {dimension.shop_order_store_id: b, period: '2024-07-01', period_partial: false, revenue: 9, quarter_revenue: 11}
      - {dimension.shop_order_store_id: null, period: '2024-04-01', period_partial: false, revenue: 6, quarter_revenue: 9}
    reference_sql: |
      SELECT o.store_id, CAST(date_trunc('quarter', o.ordered_at) AS DATE) AS period,
        SUM(o.amount) AS revenue, q.quarter_revenue
      FROM orders AS o
      JOIN (SELECT date_trunc('quarter', ordered_at) AS quarter, SUM(amount) AS quarter_revenue
            FROM orders GROUP BY date_trunc('quarter', ordered_at)) AS q
        ON q.quarter = date_trunc('quarter', o.ordered_at)
      GROUP BY o.store_id, CAST(date_trunc('quarter', o.ordered_at) AS DATE), q.quarter_revenue
  shop/store-and-channel-revenue-with-store-subtotals-and-a-grand-total:
    kind: query_matches_snapshot
    expect: answer
    why: Each store's subtotal across signup channels, then the grand total, each the call at its grain and named by total_over; the grand total counts 7 distinct buying customers, not the 10 its store subtotals add up to (customer 102 buys at both stores, 101 at store a and with no store).
    cites: [tests/integration/correctness/shop/models/orders.yml#model.measures.buying_customers, docs/QUERY_CALL.md#totals]
    query:
      select:
        - {expression: measure.shop.revenue, as: revenue}
        - {expression: measure.shop.buying_customers, as: customers}
      group_by: [dimension.shop_order_store_id, dimension.shop_customer_channel]
      totals: [dimension.shop_order_store_id]
    expected_rows:
      - {dimension.shop_order_store_id: a, dimension.shop_customer_channel: store, revenue: 4, customers: 1, total_over: null}
      - {dimension.shop_order_store_id: a, dimension.shop_customer_channel: web, revenue: 37, customers: 2, total_over: null}
      - {dimension.shop_order_store_id: a, dimension.shop_customer_channel: null, revenue: 2, customers: 2, total_over: null}
      - {dimension.shop_order_store_id: b, dimension.shop_customer_channel: store, revenue: 13, customers: 2, total_over: null}
      - {dimension.shop_order_store_id: b, dimension.shop_customer_channel: web, revenue: 12, customers: 2, total_over: null}
      - {dimension.shop_order_store_id: null, dimension.shop_customer_channel: web, revenue: 6, customers: 1, total_over: null}
      - {dimension.shop_order_store_id: a, dimension.shop_customer_channel: null, revenue: 43, customers: 5, total_over: dimension.shop_customer_channel}
      - {dimension.shop_order_store_id: b, dimension.shop_customer_channel: null, revenue: 25, customers: 4, total_over: dimension.shop_customer_channel}
      - {dimension.shop_order_store_id: null, dimension.shop_customer_channel: null, revenue: 6, customers: 1, total_over: dimension.shop_customer_channel}
      - {dimension.shop_order_store_id: null, dimension.shop_customer_channel: null, revenue: 74, customers: 7, total_over: 'dimension.shop_order_store_id, dimension.shop_customer_channel'}
    reference_sql: |
      SELECT o.store_id, s.channel, SUM(o.amount) AS revenue, COUNT(DISTINCT o.customer_id) AS customers,
        CAST(NULL AS VARCHAR(64)) AS total_over
      FROM orders AS o LEFT JOIN signups AS s ON s.customer_id = o.customer_id
      GROUP BY o.store_id, s.channel
      UNION ALL
      SELECT store_id, NULL, SUM(amount), COUNT(DISTINCT customer_id), 'dimension.shop_customer_channel'
      FROM orders GROUP BY store_id
      UNION ALL
      SELECT NULL, NULL, SUM(amount), COUNT(DISTINCT customer_id),
        'dimension.shop_order_store_id, dimension.shop_customer_channel'
      FROM orders
  shop/top-customers-by-name-rank-by-key-so-namesakes-stay-apart:
    kind: query_matches_snapshot
    expect: answer
    why: The customer name is the customer's display, so the ranking groups by the customer key too; customers 101 and 103 are both Ann and stay two rows instead of one Ann with 46.
    cites: [tests/integration/correctness/shop/models/signups.yml#model.dimensions.name, docs/QUERY_CALL.md#order_by]
    query:
      select: [measure.shop.revenue]
      group_by: [dimension.shop_customer_name]
      order_by: [{field: revenue, direction: desc}]
      limit: 2
    expected_rows:
      - {dimension.shop_customer_id: 101, dimension.shop_customer_name: Ann, revenue: 23}
      - {dimension.shop_customer_id: 103, dimension.shop_customer_name: Ann, revenue: 23}
    reference_sql: |
      SELECT o.customer_id, s.name, SUM(o.amount) AS revenue
      FROM orders o LEFT JOIN signups s ON o.customer_id = s.customer_id
      GROUP BY o.customer_id, s.name
      ORDER BY revenue DESC NULLS LAST, o.customer_id ASC NULLS LAST, s.name ASC NULLS LAST
      LIMIT 2
  shop/share-over-a-name-spans-every-namesake:
    kind: query_matches_snapshot
    expect: answer
    why: The name groups by the customer key too, and a share over the name takes its total over every customer of that name, so customers 101 and 103 (both Ann, 23 each) hold half each.
    cites: [tests/integration/correctness/shop/models/signups.yml#model.dimensions.name, docs/QUERY_CALL.md#inline-expression-kinds]
    query:
      select: [{expression: {kind: share, input: measure.shop.revenue, over: [dimension.shop_customer_name]}, as: share}]
      group_by: [dimension.shop_customer_name]
      where: [{field: dimension.shop_customer_name, op: is, value: Ann}]
    expected_rows:
      - {dimension.shop_customer_id: 101, dimension.shop_customer_name: Ann, share: 0.5}
      - {dimension.shop_customer_id: 103, dimension.shop_customer_name: Ann, share: 0.5}
    reference_sql: |
      SELECT customer_id, name, revenue / CAST(SUM(revenue) OVER () AS DOUBLE PRECISION) AS share
      FROM (
        SELECT o.customer_id, s.name, SUM(o.amount) AS revenue
        FROM orders o JOIN signups s ON o.customer_id = s.customer_id
        WHERE s.name = 'Ann'
        GROUP BY o.customer_id, s.name
      ) q
