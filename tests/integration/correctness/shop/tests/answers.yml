    tags: [null-vs-zero]
    variant: utc_authored
    query:
      select:
      - expression:
          kind: aggregate_if
          aggregation: count_distinct
          condition:
            kind: comparison
            op: '='
            left:
              kind: column
              column: store_id
              entity: entity.shop_order
            right:
              kind: literal
              value: a
