  shop/a-balance-after-its-last-snapshot-reads-null:
    kind: query_matches_snapshot
    expect: answer
    why: 'Seats are snapshotted through January 15, 2024: January closes on that day (220), and February and March, after the data, read NULL, never a carried-forward or zero balance.'
    cites: [tests/integration/correctness/shop/models/account_days.yml#model.measures.seats, tests/integration/correctness/shop/models/account_days.yml#model.times.snapshot_day, docs/QUERY_CALL.md#empty-groups-null-or-0]
    tags: [null-vs-zero, time-window]
    query:
      select: [measure.shop.seats]
      time: {start: '2024-01-01', end: '2024-04-01', grain: month}
    now: '2024-03-10T12:00:00Z'
    expected_rows:
      - {period: '2024-01-01', seats: 220}
      - {period: '2024-02-01', seats: null}
      - {period: '2024-03-01', seats: null}
    reference_sql: |
      SELECT m.period, SUM(a.seats) FROM (
        SELECT TIMESTAMP '2024-01-01' AS period UNION ALL SELECT TIMESTAMP '2024-02-01'
        UNION ALL SELECT TIMESTAMP '2024-03-01'
      ) AS m LEFT JOIN account_days AS a
        ON a.snapshot_day = (SELECT MAX(snapshot_day) FROM account_days
          WHERE snapshot_day >= CAST(m.period AS DATE)
            AND snapshot_day < CAST(m.period + INTERVAL '1' MONTH AS DATE))
      GROUP BY m.period
