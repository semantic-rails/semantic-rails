    cites: [tests/integration/correctness/shop/models/order_tags.yml#model.measures.tag_links, tests/integration/correctness/shop/models/orders.yml#model.dimensions.store_id]
    tags: [row-grain]
    query:
      select: [measure.shop.tag_links]
      group_by: [dimension.shop_order_store_id]
    expected_rows:
