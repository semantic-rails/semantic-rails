      WITH s AS (
        SELECT g.b FROM generate_series(
          (SELECT MIN(date_trunc('month', ordered_at)) FROM orders),
          (SELECT MAX(date_trunc('month', ordered_at)) FROM orders), INTERVAL '1 month') AS g(b)
      ),
      k AS (SELECT DISTINCT store_id AS k FROM orders)
      SELECT k.k, s.b,
        CASE WHEN COUNT(o.order_id) = 0 THEN 0
          ELSE SUM(o.amount * CASE WHEN o.store_id = 'a' THEN 1.1 ELSE 1.2 END) END
      FROM k CROSS JOIN s
      LEFT JOIN orders AS o ON o.store_id IS NOT DISTINCT FROM k.k
        AND o.ordered_at >= s.b - INTERVAL '2 month' AND o.ordered_at < s.b + INTERVAL '1 month'
      GROUP BY k.k, s.b
  shop/median-net-order-value-reads-an-order-without-a-refund-as-refunding-nothing:
    kind: query_matches_snapshot
    expect: answer
    why: "Each order's net value is its amount less its goods refunds. An order with no refund row refunded nothing (0), so November's orders 1 (10) and 2 (5 - 6 = -1) read 4.5 and March's orders 5 (8) and 6 (0) read 4. Order 4 (January) has only a shipping refund, whose goods amount is unknown, so its net value is unknown and January reads NULL; order 7's amount is unknown, so May reads order 8 alone."
    cites: &net_order_cites
      - tests/integration/correctness/shop/models/orders.yml#model.measures.revenue
      - tests/integration/correctness/shop/models/refunds.yml#model.measures.goods_refunded
      - tests/integration/correctness/shop/models/orders.yml#model.times.ordered_at
      - docs/QUERY_CALL.md#empty-groups-null-or-0
    tags: [null-vs-zero, time-window]
    variant: utc_authored
    query:
      select:
      - expression:
          kind: distribution
          function: median
          over: &net_per_order
            kind: entity_value
            entity: entity.shop_order
            input: {kind: arithmetic, op: subtract, left: measure.shop.revenue, right: measure.shop.goods_refunded}
        as: median
      time: {temporal_role: temporal_role.shop_order_ordered_at, grain: month}
    expected_rows:
      - {period: '2023-11-01', median: 4.5}
      - {period: '2023-12-01', median: 7}
      - {period: '2024-01-01', median: null}
      - {period: '2024-03-01', median: 4}
      - {period: '2024-05-01', median: 6}
      - {period: '2024-06-01', median: 3}
      - {period: '2024-07-01', median: 9}
      - {period: '2024-08-01', median: 2}
    reference_sql: |
      WITH per_order AS (
        SELECT date_trunc('month', o.ordered_at) AS b,
          o.amount - CASE WHEN COUNT(r.refund_id) = 0 THEN 0 ELSE SUM(r.goods_amount) END AS net
        FROM orders AS o LEFT JOIN refunds AS r ON r.order_id = o.order_id
        GROUP BY o.order_id, date_trunc('month', o.ordered_at), o.amount
      )
      SELECT b, percentile_cont(0.5) WITHIN GROUP (ORDER BY net) FROM per_order GROUP BY b
