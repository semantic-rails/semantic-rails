  shop/row-filter-share-of-total-reads-visible-rows:
    kind: query_matches_snapshot
    expect: answer
    why: A share's denominator is the total of the rows the caller sees, 43 for a West manager, never the company's 74; the visible shares add up to 1.
    cites: [tests/integration/correctness/shop/models/orders.yml#model.measures.revenue, tests/integration/correctness/shop/models/signups.yml#model.dimensions.channel, docs/QUERY_CALL.md#inline-expression-kinds, docs/PACKAGE_AUTHORING.md#policiesyml]
    tags: [row-filter]
    context: *west
    query: &revenue_share_by_channel
      select:
        - {expression: measure.shop.revenue, as: revenue}
        - {expression: {kind: share, input: measure.shop.revenue, over: [dimension.shop_customer_channel]}, as: revenue_share}
      group_by: [dimension.shop_customer_channel]
    expected_rows:
      - {dimension.shop_customer_channel: web, revenue: 37, revenue_share: 0.8604651162790697}
      - {dimension.shop_customer_channel: store, revenue: 4, revenue_share: 0.09302325581395349}
      - {dimension.shop_customer_channel: null, revenue: 2, revenue_share: 0.046511627906976744}
    reference_sql: |
      WITH visible_stores AS (SELECT store_id FROM stores WHERE region = 'West'),
      visible_orders AS (SELECT * FROM orders WHERE store_id IN (SELECT store_id FROM visible_stores))
      SELECT c.channel, SUM(o.amount) AS revenue,
        SUM(o.amount) / CAST(SUM(SUM(o.amount)) OVER () AS DOUBLE PRECISION) AS revenue_share
      FROM visible_orders AS o LEFT JOIN signups AS c ON c.customer_id = o.customer_id
      GROUP BY c.channel
