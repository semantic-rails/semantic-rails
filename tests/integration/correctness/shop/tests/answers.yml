  shop/ratio_over_prior_month:
    kind: query_matches_snapshot
    expect: answer
    why: A ratio over the prior month reads every month, as arithmetic does. February 2024 has no orders, so March divides by February's 0 and reads NULL, never by January (the 0.6 a series of only the months with orders gave).
    cites:
      - tests/integration/correctness/shop/models/orders.yml#model.measures.revenue
      - tests/integration/correctness/shop/models/orders.yml#model.times.ordered_at
      - tests/integration/correctness/conftest.py#CLOCKS
      - docs/QUERY_CALL.md#empty-groups-null-or-0
      - docs/QUERY_CALL.md#inline-expression-kinds
      - docs/QUERY_CALL.md#select
      - docs/QUERY_CALL.md#time
    tags: [time-window, null-vs-zero]
    variant: utc_authored
    query:
      select:
      - measure.shop.revenue
      - expression:
          kind: ratio
          numerator: measure.shop.revenue
          denominator:
            kind: prior_period
            input: measure.shop.revenue
            offset:
              unit: month
              value: 1
        as: vs_prior
      time:
        temporal_role: temporal_role.shop_order_ordered_at
        grain: month
    reference_sql: |-
      WITH m AS (
                SELECT date_trunc('month', o.ordered_at) AS b, SUM(o.amount) AS v
                FROM orders AS o GROUP BY 1
              ),
              s AS (SELECT g.b FROM generate_series((SELECT MIN(b) FROM m), (SELECT MAX(b) FROM m), INTERVAL '1 month') AS g(b))
              SELECT s.b, (SELECT CASE WHEN COUNT(*) = 0 THEN 0 ELSE MAX(m.v) END FROM m WHERE m.b = s.b), (SELECT CASE WHEN COUNT(*) = 0 THEN 0 ELSE MAX(m.v) END FROM m WHERE m.b = s.b) / CAST(NULLIF(CASE WHEN s.b - INTERVAL '1 month' < (SELECT MIN(b) FROM s) THEN NULL ELSE (SELECT CASE WHEN COUNT(*) = 0 THEN 0 ELSE MAX(m.v) END FROM m WHERE m.b = s.b - INTERVAL '1 month') END, 0) AS DOUBLE PRECISION) FROM s
    expected_rows:
      - {period: '2023-11-01', revenue: 15, vs_prior: null}
      - {period: '2023-12-01', revenue: 7, vs_prior: 0.4666666666666667}
      - {period: '2024-01-01', revenue: 20, vs_prior: 2.857142857142857}
