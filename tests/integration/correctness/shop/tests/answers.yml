    cites: [tests/integration/correctness/shop/graph.yml#graph.relationships.order_customer_history, tests/integration/correctness/shop/models/orders.yml#model.measures.revenue, tests/integration/correctness/shop/models/orders.yml#model.times.ordered_at, docs/ARCHITECTURE.md#compiler-pipeline]
