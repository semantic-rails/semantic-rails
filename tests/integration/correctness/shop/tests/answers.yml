          CASE WHEN g.b + INTERVAL '7' DAY <= (SELECT CAST(MAX(through_day) AS TIMESTAMP) + INTERVAL '1' DAY FROM ticket_loads)
            THEN COUNT(DISTINCT CASE WHEN t.minutes > 480 THEN t.ticket_id END) END AS long_tickets,
