    why: 'Four weeks to October 7, 2024 of the share of tickets that ran long: each operand settles first, then the ratio. Long tickets read 0 in the three loaded weeks; the week of September 9 opened ticket 3, so its share is 0 / 1 = 0; the weeks of September 16 and 23 opened none, so 0 / 0 is NULL (no tickets, never 0.0); the week of September 30 is after the load log, so both operands are NULL and so is the share.'
