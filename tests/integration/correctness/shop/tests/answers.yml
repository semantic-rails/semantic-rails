    kind: query_matches_snapshot
    expect: answer
    why: Freeze the declared inputs and independent reference for child filter conditional counts and sum by channel.
    cites:
      - tests/integration/correctness/shop/models/refunds.yml#model.dimensions.refund_type
      - tests/integration/correctness/shop/models/signups.yml#model.dimensions.channel
      - tests/integration/correctness/shop/models/orders.yml#model.measures.revenue
      - docs/QUERY_IR_SCHEMA.md#empty-groups-null-or-0
      - docs/QUERY_IR_SCHEMA.md#selectexpression-discriminated-union
      - docs/QUERY_IR_SCHEMA.md#wherefilter
    tags: [null-vs-zero]
    variant: utc_authored
    query:
      select:
      - expression:
          kind: aggregate_if
          aggregation: count_distinct
          condition:
            kind: comparison
            op: '='
            left:
              kind: column
              column: store_id
              entity: entity.shop_order
            right:
              kind: literal
              value: a
          value:
            kind: column
            column: order_id
            entity: entity.shop_order
        as: store_a_orders
      - expression:
          kind: aggregate_if
          aggregation: count
          condition:
            kind: comparison
            op: '>='
            left:
              kind: column
              column: amount
              entity: entity.shop_order
            right:
              kind: literal
              value: 5
        as: orders_of_5
      - expression:
          kind: aggregate_if
          aggregation: sum
          condition:
            kind: comparison
            op: '='
            left:
              kind: column
              column: store_id
              entity: entity.shop_order
            right:
              kind: literal
              value: b
          value:
            kind: column
            column: amount
            entity: entity.shop_order
        as: store_b_revenue
      where:
      - field: dimension.shop_refund_refund_type
        op: '='
        value: goods
      group_by:
      - dimension.shop_customer_channel
    reference_sql: |-
      SELECT (SELECT s.channel FROM signups AS s WHERE s.customer_id = o.customer_id), COUNT(DISTINCT CASE WHEN o.store_id = 'a' THEN o.order_id END),
                COUNT(CASE WHEN o.amount >= 5 THEN 1 END), CASE WHEN COUNT(CASE WHEN o.store_id = 'b' THEN 1 END) = 0 THEN 0 ELSE SUM(CASE WHEN o.store_id = 'b' THEN o.amount END) END
              FROM orders AS o WHERE EXISTS (SELECT 1 FROM refunds AS r WHERE r.order_id = o.order_id AND r.refund_type = 'goods') GROUP BY 1
    expected_rows:
      - {dimension.shop_customer_channel: store, store_a_orders: 1, orders_of_5: 1, store_b_revenue: 5}
      - {dimension.shop_customer_channel: null, store_a_orders: 1, orders_of_5: 0, store_b_revenue: 0}
