      WHERE EXISTS (SELECT 1 FROM shipment_scans AS s JOIN orders AS o ON o.order_id = s.order_id
        WHERE o.customer_id = c.customer_id AND s.scan_type = 'pickup')
  shop/row-grain-parents-ranked-by-child-rows:
    kind: query_matches_snapshot
    expect: answer
    why: The top customers by scans, ranked on their key; scans with no customer share the NULL row.
    cites: [tests/integration/correctness/shop/models/shipment_scans.yml#model.measures.scan_count, docs/QUERY_CALL.md#order_by]
    tags: [row-grain]
    query:
      select: [measure.shop.scan_count]
      group_by: [dimension.shop_customer_id]
      order_by: [{field: scan_count, direction: desc}, {field: dimension.shop_customer_id, direction: asc}]
      limit: 5
    expected_rows:
      - {dimension.shop_customer_id: 101, scan_count: 4}
      - {dimension.shop_customer_id: 102, scan_count: 2}
      - {dimension.shop_customer_id: 103, scan_count: 2}
      - {dimension.shop_customer_id: null, scan_count: 2}
    reference_sql: |
      SELECT c.customer_id, COUNT(*) AS scans FROM shipment_scans AS s
      LEFT JOIN orders AS o ON o.order_id = s.order_id
      LEFT JOIN signups AS c ON c.customer_id = o.customer_id
      GROUP BY c.customer_id ORDER BY scans DESC, c.customer_id ASC NULLS LAST LIMIT 5
  shop/row-grain-filtered-by-sibling-child:
