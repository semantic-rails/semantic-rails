fixture:
  tables: [orders, refunds, signups, dim_fiscal, customer_history, account_days]
  data_sha256: 9c846589d4cc8d72b7e3f7bd19ea9d9a21ef246a87d6de79fe4727ea578223e5
tests:
  shop/sibling-input-clock-filter-keeps-independent-history:
    kind: query_matches_snapshot
    expect: answer
    why: The recent aggregate cuts its own population while the cumulative input retains November history.
    cites: [docs/QUERY_IR_SCHEMA.md#selectexpression-discriminated-union, tests/integration/correctness/shop/models/orders.yml#model.measures.revenue]
    tags: [time-window]
    query:
      select:
        - as: history
          expression: {kind: cumulative, input: {measure: measure.shop.revenue}}
        - as: recent
          expression:
            kind: aggregate
            measure: measure.shop.revenue
            filter:
              all: [{field: dimension.shop_order_ordered_at, op: '>=', value: '2023-12-01'}]
      metric_filters:
        - {expression: {kind: cumulative, input: {measure: measure.shop.revenue}}, op: '>=', value: 22}
      time: {temporal_role: temporal_role.shop_order_ordered_at, grain: month, end: '2024-01-01'}
    expected_rows:
      - {temporal_role.shop_order_ordered_at__month: '2023-12-01T00:00:00', history: 22, recent: 7}
    reference_sql: |
      WITH monthly AS (
        SELECT date_trunc('month', ordered_at) AS period, SUM(amount) AS revenue,
          SUM(CASE WHEN ordered_at >= TIMESTAMP '2023-12-01' THEN amount ELSE 0 END) AS recent
        FROM orders WHERE ordered_at < TIMESTAMP '2024-01-01' GROUP BY 1
      ), history AS (
        SELECT period, SUM(revenue) OVER (ORDER BY period ROWS UNBOUNDED PRECEDING) AS total, recent
        FROM monthly
      )
      SELECT period, total, recent FROM history WHERE total >= 22
  shop/metric-input-clock-filter-keeps-independent-history:
    kind: query_matches_snapshot
    expect: answer
    why: Filtering the recent metric output does not remove November from the cumulative input.
    cites: [docs/QUERY_IR_SCHEMA.md#selectexpression-discriminated-union, tests/integration/correctness/shop/models/orders.yml#model.measures.revenue]
    tags: [time-window]
    query:
      select:
        - {as: history, expression: {kind: cumulative, input: {measure: measure.shop.revenue}}}
      metric_filters:
        - expression:
            kind: aggregate
            measure: measure.shop.revenue
            filter:
              all: [{field: dimension.shop_order_ordered_at, op: '>=', value: '2023-12-01'}]
          op: '>'
          value: 0
      time: {temporal_role: temporal_role.shop_order_ordered_at, grain: month, end: '2024-01-01'}
    expected_rows:
      - {temporal_role.shop_order_ordered_at__month: '2023-12-01T00:00:00', history: 22}
    reference_sql: |
      WITH monthly AS (
        SELECT date_trunc('month', ordered_at) AS period, SUM(amount) AS revenue,
          SUM(CASE WHEN ordered_at >= TIMESTAMP '2023-12-01' THEN amount ELSE 0 END) AS recent
        FROM orders WHERE ordered_at < TIMESTAMP '2024-01-01' GROUP BY 1
      ), history AS (
        SELECT period, SUM(revenue) OVER (ORDER BY period ROWS UNBOUNDED PRECEDING) AS total, recent
        FROM monthly
      )
      SELECT period, total FROM history WHERE recent > 0
  shop/cumulative-input-clock-filter-refuses-truncated-history:
    kind: validate_fails_with_code
    expect: refuse
    code: CUMULATIVE_TIME_FILTER_UNSUPPORTED
    why: A lower bound on the input clock removes history needed by the cumulative sum.
    cites: [docs/QUERY_IR_SCHEMA.md#selectexpression-discriminated-union, tests/integration/correctness/shop/models/orders.yml#model.times.ordered_at]
    tags: [time-window]
    query:
      select:
        - as: total
          expression:
            kind: cumulative
            input:
              kind: aggregate
              measure: measure.shop.revenue
              filter:
                all: [{field: dimension.shop_order_ordered_at, op: '>=', value: '2023-12-01'}]
      time: {temporal_role: temporal_role.shop_order_ordered_at, grain: month}
  shop/rolling-input-clock-filter-refuses-truncated-history:
    kind: validate_fails_with_code
    expect: refuse
    code: WINDOWED_TIME_FILTER_UNSUPPORTED
    why: A lower bound on the input clock removes earlier buckets needed by the rolling sum.
    cites: [docs/QUERY_IR_SCHEMA.md#selectexpression-discriminated-union, tests/integration/correctness/shop/models/orders.yml#model.times.ordered_at]
    tags: [time-window]
    query:
      select:
        - as: total
          expression:
            kind: rolling
            window: {unit: month, value: 2}
            input:
              kind: aggregate
              measure: measure.shop.revenue
              filter:
                all: [{field: dimension.shop_order_ordered_at, op: '>=', value: '2023-12-01'}]
      time: {temporal_role: temporal_role.shop_order_ordered_at, grain: month}
  shop/distribution-value-filter-refuses-a-dimension:
    kind: validate_fails_with_code
    expect: refuse
    code: INVALID_QUERY
    why: A field condition must not be applied to the computed per-order value.
    cites:
      - tests/integration/correctness/shop/models/orders.yml#model.measures.revenue
      - docs/QUERY_IR_SCHEMA.md#per-entity-value-filters
    tags: [refusal]
    query:
      select:
        - as: average
          expression:
            kind: distribution
            function: avg
            over:
              kind: entity_value
              entity: entity.shop_order
              input: {measure: measure.shop.revenue}
              where: [{field: dimension.shop_order_store_id, op: '=', value: a}]
  shop/net-growth-from-a-never-matched-count:
    kind: query_matches_snapshot
    expect: answer
    why: Three store a orders minus a conditional count with no match anywhere is three.
    cites: [tests/integration/correctness/shop/models/orders.yml#model.measures.store_a_orders, docs/QUERY_IR_SCHEMA.md#empty-groups-null-or-0]
    tags: [null-vs-zero, time-window]
    query:
      select:
        - {as: a, expression: {measure: measure.shop.store_a_orders}}
        - {as: absent, expression: {measure: measure.shop.huge_order_count}}
        - as: net
          expression: {kind: arithmetic, op: subtract, left: {measure: measure.shop.store_a_orders}, right: {measure: measure.shop.huge_order_count}}
      time: {temporal_role: temporal_role.shop_order_ordered_at, start: '2023-11-01', end: '2024-02-01'}
    expected_rows: [{a: 3, absent: 0, net: 3}]
    reference_sql: |
      SELECT a, absent, a - absent FROM (
        SELECT COUNT(CASE WHEN store_id = 'a' THEN order_id END) AS a,
          COUNT(CASE WHEN amount >= 1000 THEN order_id END) AS absent
        FROM orders WHERE ordered_at >= TIMESTAMP '2023-11-01' AND ordered_at < TIMESTAMP '2024-02-01'
      ) counts
  shop/distribution-sum-preserves-an-explicit-else-zero:
    kind: query_matches_snapshot
    expect: answer
    why: A nonmatching order contributes a measured zero before the per-customer values are summed.
    cites: [tests/integration/correctness/shop/models/orders.yml#model.measures.store_a_amount, docs/QUERY_IR_SCHEMA.md#empty-groups-null-or-0]
    tags: [null-vs-zero, time-window]
    query:
      select:
        - as: total
          expression:
            kind: distribution
            function: sum
            over: {kind: entity_value, entity: entity.shop_customer, input: {measure: measure.shop.store_a_amount}}
      time: {temporal_role: temporal_role.shop_order_ordered_at, grain: week, start: '2023-11-20', end: '2023-11-27'}
    expected_rows: [{temporal_role.shop_order_ordered_at__week: '2023-11-20T00:00:00', total: 0}]
    reference_sql: |
      SELECT week, SUM(value) FROM (
        SELECT date_trunc('week', ordered_at) AS week, customer_id,
          SUM(CASE WHEN store_id = 'a' THEN amount ELSE 0 END) AS value
        FROM orders WHERE ordered_at >= TIMESTAMP '2023-11-20' AND ordered_at < TIMESTAMP '2023-11-27'
        GROUP BY 1, 2
      ) per_customer GROUP BY 1
  shop/window-total-observes-a-conditional-count-outside-the-window:
    kind: query_matches_snapshot
    expect: answer
    why: Store b has orders elsewhere in the loaded range, so its absent orders in this window read zero and the difference is one.
    cites: &conditional_window_cites [tests/integration/correctness/shop/models/orders.yml#model.measures.store_a_orders, tests/integration/correctness/shop/models/orders.yml#model.measures.store_b_orders, docs/QUERY_IR_SCHEMA.md#empty-groups-null-or-0]
    tags: [null-vs-zero, time-window]
    query: &conditional_window
      select:
        - {as: a, expression: {measure: measure.shop.store_a_orders}}
        - {as: b, expression: {measure: measure.shop.store_b_orders}}
        - as: net
          expression: {kind: arithmetic, op: subtract, left: {measure: measure.shop.store_a_orders}, right: {measure: measure.shop.store_b_orders}}
      time: {temporal_role: temporal_role.shop_order_ordered_at, start: '2023-11-27', end: '2023-12-04'}
    expected_rows: &conditional_window_rows [{a: 1, b: 0, net: 1}]
    reference_sql: &conditional_window_sql |
      SELECT a, b, a - b FROM (
        SELECT COUNT(CASE WHEN store_id = 'a' THEN order_id END) AS a,
          COUNT(CASE WHEN store_id = 'b' THEN order_id END) AS b
        FROM orders WHERE ordered_at >= TIMESTAMP '2023-11-27' AND ordered_at < TIMESTAMP '2023-12-04'
      ) counts
  shop/relative-window-total-observes-a-conditional-count-outside-the-window:
    kind: query_matches_snapshot
    expect: answer
    why: The last complete week uses the same observation and coverage rule as explicit bounds.
    cites: *conditional_window_cites
    tags: [null-vs-zero, time-window]
    query:
      <<: *conditional_window
      time: {temporal_role: temporal_role.shop_order_ordered_at, range: {last: {unit: week, value: 1}}}
      policy_context: {now: '2023-12-04T00:00:00+00:00'}
    expected_rows: *conditional_window_rows
    reference_sql: *conditional_window_sql
  shop/top-stores-with-cutoff-ties:
    kind: query_matches_snapshot
    expect: answer
    why: Stores with equal order counts rank by the remaining output columns, keeping a stable subset.
    cites: [tests/integration/correctness/shop/models/orders.yml#model.measures.order_count, docs/QUERY_IR_SCHEMA.md#orderby]
    tags: [time-window]
    query:
      select: [{expression: {measure: measure.shop.order_count}, as: orders}]
      group_by: [dimension.shop_order_store_id]
      time: {temporal_role: temporal_role.shop_order_ordered_at, start: '2023-11-01', end: '2023-12-01'}
      order_by: [{field: orders, direction: DESC}]
      limit: 1
    expected_rows: [{dimension.shop_order_store_id: a, orders: 1}]
    reference_sql: |
      SELECT store_id, COUNT(order_id) AS orders
      FROM orders
      WHERE ordered_at >= TIMESTAMP '2023-11-01' AND ordered_at < TIMESTAMP '2023-12-01'
      GROUP BY store_id
      ORDER BY orders DESC, store_id ASC NULLS LAST LIMIT 1
  shop/pinned-output-refuses-another-advertised-clock:
    kind: validate_fails_with_code
    expect: refuse
    code: INVALID_TEMPORAL_BINDING
    why: A metric pinned to close time must never filter its orders on order time.
    cites: [tests/integration/correctness/shop/metrics/metrics.yml#metrics.closed_orders, tests/integration/correctness/shop/models/orders.yml#model.measures.window_order_count, docs/QUERY_IR_SCHEMA.md#metricfilter-expressions]
    tags: [time-window, clock, refusal]
    query:
      select: [{expression: {metric: metric.shop.closed_orders}, as: orders}]
      time: {temporal_role: temporal_role.shop_order_ordered_at, start: '2023-11-01', end: '2023-12-01'}
  shop/aggregate-filter-predicate-refuses-a-dropped-clock-override:
    kind: validate_fails_with_code
    expect: refuse
    code: INVALID_TEMPORAL_BINDING
    why: A nested conversion predicate in an aggregate filter cannot silently drop the order-clock override.
    cites: [tests/integration/correctness/shop/models/orders.yml#model.measures.window_order_count, tests/integration/correctness/shop/models/signups.yml#model.measures.signup_count, docs/QUERY_IR_SCHEMA.md#metricfilter-expressions]
    tags: [time-window, clock, refusal]
    query:
      select: [{expression: {measure: measure.shop.signup_count}, as: signups}]
      time: {temporal_role: temporal_role.shop_customer_signed_up_at, start: '2023-11-01', end: '2023-12-01'}
      temporal_role_overrides: {measure.shop.window_order_count: temporal_role.shop_order_ordered_at}
      metric_filters:
        - expression:
            kind: metric_predicate
            entity: entity.shop_customer
            scope_mode: entity_only
            time_alignment: query_window
            input:
              kind: aggregate
              measure: measure.shop.signup_count
              aggregation: count_distinct
              filter:
                all:
                  - expression:
                      kind: metric_predicate
                      entity: entity.shop_customer
                      scope_mode: entity_only
                      input:
                        kind: conversion
                        entity: entity.shop_customer
                        window: {unit: day, value: 7}
                        matching_mode: first_converted_after_base
                        base: {kind: aggregate, measure: measure.shop.signup_count}
                        converted: {kind: aggregate, measure: measure.shop.window_order_count, temporal_role: temporal_role.shop_order_closed_at}
                      op: '>'
                      value: 0.5
            op: '>='
            value: 1
          op: '='
          value: true
  shop/pinned-output-on-its-bound-clock:
    kind: query_matches_snapshot
    expect: answer
    why: Orders pinned to close time count only orders closed within the requested period.
    cites: [tests/integration/correctness/shop/metrics/metrics.yml#metrics.closed_orders, tests/integration/correctness/shop/models/orders.yml#model.times.closed_at, docs/QUERY_IR_SCHEMA.md#metricfilter-expressions]
    tags: [time-window, clock]
    query:
      select: [{expression: {metric: metric.shop.closed_orders}, as: orders}]
      time: {temporal_role: temporal_role.shop_order_closed_at, start: '2023-11-21', end: '2023-12-01'}
    expected_rows: [{orders: 1}]
    reference_sql: |
      SELECT COUNT(*) FROM orders
      WHERE closed_at >= TIMESTAMP '2023-11-21' AND closed_at < TIMESTAMP '2023-12-01'
  shop/window-predicate-needs-an-input-clock:
    kind: validate_fails_with_code
    expect: refuse
    code: INVALID_TEMPORAL_BINDING
    why: Signup time cannot choose whether the order threshold uses order time or close time.
    cites: [tests/integration/correctness/shop/models/orders.yml#model.measures.window_order_count, docs/QUERY_IR_SCHEMA.md#metricfilter-expressions]
    tags: [time-window, clock, refusal]
    query: &window_predicate
      select: [{expression: {measure: measure.shop.signup_count}, as: signups}]
      time: {temporal_role: temporal_role.shop_customer_signed_up_at, grain: month, start: '2023-11-01', end: '2023-12-01'}
      metric_filters:
        - expression:
            kind: metric_predicate
            entity: entity.shop_customer
            scope_mode: entity_only
            time_alignment: query_window
            input: {measure: measure.shop.window_order_count}
            op: '>='
            value: 1
          op: '='
          value: true
  shop/window-predicate-follows-a-pinned-close-clock:
    kind: query_matches_snapshot
    expect: answer
    why: Customer 102 signed up and ordered within the window but closed the order after it; the pinned close clock keeps no signups.
    cites: [tests/integration/correctness/shop/models/orders.yml#model.measures.window_order_count, tests/integration/correctness/shop/models/orders.yml#model.times.closed_at, tests/integration/correctness/shop/models/signups.yml#model.measures.signup_count, docs/QUERY_IR_SCHEMA.md#metricfilter-expressions]
    tags: [time-window, clock]
    query:
      <<: *window_predicate
      time: {temporal_role: temporal_role.shop_customer_signed_up_at, grain: day, start: '2023-11-13', end: '2023-11-21'}
      temporal_role_overrides: {measure.shop.window_order_count: temporal_role.shop_order_closed_at}
    expected_rows: []
    reference_sql: |
      SELECT date_trunc('day', s.signed_up_at), COUNT(*) FROM signups s
      WHERE s.signed_up_at >= TIMESTAMP '2023-11-13' AND s.signed_up_at < TIMESTAMP '2023-11-21'
        AND EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = s.customer_id
          AND o.closed_at >= TIMESTAMP '2023-11-13' AND o.closed_at < TIMESTAMP '2023-11-21')
      GROUP BY 1
  shop/history-key-groups-use-the-version-valid-at-order-time:
    kind: query_matches_snapshot
    expect: answer
    why: A source customer key does not establish a history version. Missing versions group under NULL, and validity ends are exclusive.
    cites: [tests/integration/correctness/shop/graph.yml#graph.relationships.order_customer_history, tests/integration/correctness/shop/models/orders.yml#model.measures.revenue, tests/integration/correctness/shop/models/orders.yml#model.times.ordered_at, docs/ARCHITECTURE.md#compiler-pipeline]
    tags: [time-window, null-vs-zero]
    query:
      select: [{expression: {measure: measure.shop.revenue}, as: revenue}]
      group_by: [dimension.shop_customer_history_customer_id]
      time: {temporal_role: temporal_role.shop_order_ordered_at, grain: month}
    expected_rows:
      - {dimension.shop_customer_history_customer_id: null, temporal_role.shop_order_ordered_at__month: '2023-11-01T00:00:00', revenue: 10}
      - {dimension.shop_customer_history_customer_id: 102, temporal_role.shop_order_ordered_at__month: '2023-11-01T00:00:00', revenue: 5}
      - {dimension.shop_customer_history_customer_id: 101, temporal_role.shop_order_ordered_at__month: '2023-12-01T00:00:00', revenue: 7}
      - {dimension.shop_customer_history_customer_id: null, temporal_role.shop_order_ordered_at__month: '2024-01-01T00:00:00', revenue: 20}
      - {dimension.shop_customer_history_customer_id: null, temporal_role.shop_order_ordered_at__month: '2024-03-01T00:00:00', revenue: 8}
      - {dimension.shop_customer_history_customer_id: 102, temporal_role.shop_order_ordered_at__month: '2024-03-01T00:00:00', revenue: 4}
      - {dimension.shop_customer_history_customer_id: null, temporal_role.shop_order_ordered_at__month: '2024-05-01T00:00:00', revenue: 6}
      - {dimension.shop_customer_history_customer_id: null, temporal_role.shop_order_ordered_at__month: '2024-06-01T00:00:00', revenue: 3}
      - {dimension.shop_customer_history_customer_id: null, temporal_role.shop_order_ordered_at__month: '2024-07-01T00:00:00', revenue: 9}
      - {dimension.shop_customer_history_customer_id: null, temporal_role.shop_order_ordered_at__month: '2024-08-01T00:00:00', revenue: 2}
    reference_sql: |
      SELECT h.customer_id, date_trunc('month', o.ordered_at), SUM(o.amount)
      FROM orders o LEFT JOIN customer_history h
        ON o.customer_id = h.customer_id AND o.ordered_at >= h.valid_from
        AND (o.ordered_at < h.valid_to OR h.valid_to IS NULL)
      GROUP BY 1, 2
  shop/two-stores-at-once-is-empty:
    kind: query_matches_snapshot
    expect: answer
    why: Conjoined equalities cannot hold on one store, even though orders 1 and 2 belong to a and b.
    cites: &store_cites [tests/integration/correctness/shop/models/orders.yml#model.measures.revenue, tests/integration/correctness/shop/models/orders.yml#model.dimensions.store_id, docs/QUERY_IR_SCHEMA.md#wherefilter]
    tags: [list-vs-conjunction, empty-result]
    query:
      select: &revenue [{expression: {measure: measure.shop.revenue}, as: revenue}]
      group_by: &store [dimension.shop_order_store_id]
      where:
        - {field: dimension.shop_order_store_id, op: '=', value: a}
        - {field: dimension.shop_order_store_id, op: '=', value: b}
    expected_rows: []
    reference_sql: SELECT store_id, SUM(amount) FROM orders WHERE store_id = 'a' AND store_id = 'b' GROUP BY 1
  shop/either-store-is-a-union:
    kind: query_matches_snapshot
    expect: answer
    why: IN includes either store once, giving 43 from a's orders and 25 from b's orders.
    cites: *store_cites
    tags: [list-vs-conjunction]
    query: {select: *revenue, group_by: *store, where: [{field: dimension.shop_order_store_id, op: IN, value: [a, b]}]}
    expected_rows: [{dimension.shop_order_store_id: a, revenue: 43}, {dimension.shop_order_store_id: b, revenue: 25}]
    reference_sql: SELECT store_id, SUM(amount) FROM orders WHERE store_id IN ('a', 'b') GROUP BY 1
  shop/refund-count-beside-revenue-reads-zero-where-there-are-none:
    kind: query_matches_snapshot
    expect: answer
    why: Refunds have data in scope, so order 8's null store reads zero while orders 2, 4, 6 and 7 contribute six refunds.
    cites: [tests/integration/correctness/shop/models/orders.yml#model.measures.revenue, tests/integration/correctness/shop/models/refunds.yml#model.measures.refund_count, docs/QUERY_IR_SCHEMA.md#empty-groups-null-or-0]
    tags: [null-vs-zero, second-fact]
    query:
      select:
        - {expression: {measure: measure.shop.revenue}, as: revenue}
        - {expression: {measure: measure.shop.refund_count}, as: refund_count}
      group_by: *store
    expected_rows: [{dimension.shop_order_store_id: a, revenue: 43, refund_count: 4}, {dimension.shop_order_store_id: b, revenue: 25, refund_count: 2}, {dimension.shop_order_store_id: null, revenue: 6, refund_count: 0}]
    reference_sql: |
      SELECT o.store_id, o.revenue, COALESCE(r.n, 0)
      FROM (SELECT store_id, SUM(amount) AS revenue FROM orders GROUP BY 1) o
      LEFT JOIN (SELECT store_id, COUNT(refund_id) AS n FROM refunds
        JOIN orders USING (order_id) GROUP BY 1) r ON o.store_id IS NOT DISTINCT FROM r.store_id
  shop/a-count-whose-condition-never-matches-reads-null:
    kind: query_matches_snapshot
    expect: answer
    why: No order reaches 1000 anywhere in scope, so every store's conditional count has no data and reads null.
    cites: [tests/integration/correctness/shop/models/orders.yml#model.measures.huge_order_count, docs/QUERY_IR_SCHEMA.md#empty-groups-null-or-0]
    tags: [null-vs-zero]
    query: {select: [{expression: {measure: measure.shop.huge_order_count}, as: huge_order_count}], group_by: *store}
    expected_rows: [{dimension.shop_order_store_id: a, huge_order_count: null}, {dimension.shop_order_store_id: b, huge_order_count: null}, {dimension.shop_order_store_id: null, huge_order_count: null}]
    reference_sql: |
      SELECT store_id, CASE WHEN EXISTS (SELECT 1 FROM orders WHERE amount >= 1000)
        THEN COUNT(CASE WHEN amount >= 1000 THEN order_id END) END FROM orders GROUP BY 1
  shop/an-amount-never-recorded-reads-null:
    kind: query_matches_snapshot
    expect: answer
    why: All six refunds leave tax_amount unrecorded, so both goods and shipping groups read null.
    cites: [tests/integration/correctness/shop/models/refunds.yml#model.measures.tax_refunded, tests/integration/correctness/shop/models/refunds.yml#model.dimensions.refund_type, docs/QUERY_IR_SCHEMA.md#empty-groups-null-or-0]
    tags: [null-vs-zero]
    query: {select: [{expression: {measure: measure.shop.tax_refunded}, as: tax_refunded}], group_by: [dimension.shop_refund_refund_type]}
    expected_rows: [{dimension.shop_refund_refund_type: goods, tax_refunded: null}, {dimension.shop_refund_refund_type: shipping, tax_refunded: null}]
    reference_sql: |
      SELECT refund_type, CASE WHEN EXISTS (SELECT 1 FROM refunds WHERE tax_amount IS NOT NULL)
        THEN COALESCE(SUM(tax_amount), 0) END FROM refunds GROUP BY 1
  shop/months-on-the-utc-clock:
    kind: query_matches_snapshot
    expect: answer
    why: The half-open UTC window includes orders 1, 2 and 3 in November and December, totaling 15 and 7.
    cites: &clock_cites [tests/integration/correctness/shop/models/orders.yml#model.measures.revenue, tests/integration/correctness/shop/models/orders.yml#model.times.ordered_at, docs/QUERY_IR_SCHEMA.md#timeblock, tests/integration/correctness/conftest.py#CLOCKS]
    tags: [time-window, clock]
    query: &months
      select: *revenue
      time: {temporal_role: temporal_role.shop_order_ordered_at, grain: month, start: '2023-11-01', end: '2024-01-01'}
      order_by: [{field: time, direction: ASC}]
    expected_rows: [{temporal_role.shop_order_ordered_at__month: '2023-11-01T00:00:00', revenue: 15}, {temporal_role.shop_order_ordered_at__month: '2023-12-01T00:00:00', revenue: 7}]
    reference_sql: |
      SELECT CAST(date_trunc('month', ordered_at) AS DATE), SUM(amount) FROM orders
      WHERE ordered_at >= TIMESTAMP '2023-11-01' AND ordered_at < TIMESTAMP '2024-01-01'
      GROUP BY 1 ORDER BY 1
  shop/months-on-the-new-york-clock:
    kind: query_matches_snapshot
    expect: answer
    why: Order 3 is still in November in New York, so the half-open local window has one month totaling 22.
    cites: *clock_cites
    tags: [time-window, clock]
    variant: ny_authored
    query: *months
    expected_rows: [{temporal_role.shop_order_ordered_at__month: '2023-11-01T00:00:00', revenue: 22}]
    reference_sql: |
      SELECT CAST(date_trunc('month', (ordered_at AT TIME ZONE 'UTC') AT TIME ZONE 'America/New_York') AS DATE), SUM(amount)
      FROM orders WHERE (ordered_at AT TIME ZONE 'UTC') AT TIME ZONE 'America/New_York' >= TIMESTAMP '2023-11-01'
        AND (ordered_at AT TIME ZONE 'UTC') AT TIME ZONE 'America/New_York' < TIMESTAMP '2024-01-01'
      GROUP BY 1 ORDER BY 1
  shop/quarters-on-the-new-york-clock:
    kind: query_matches_snapshot
    expect: answer
    why: Order 10 falls in June in New York, putting its 9 in the second quarter rather than the third.
    cites: *clock_cites
    tags: [clock]
    variant: ny_authored
    query: {select: *revenue, time: {temporal_role: temporal_role.shop_order_ordered_at, grain: quarter}, order_by: [{field: time, direction: ASC}]}
    expected_rows: [{temporal_role.shop_order_ordered_at__quarter: '2023-10-01T00:00:00', revenue: 22}, {temporal_role.shop_order_ordered_at__quarter: '2024-01-01T00:00:00', revenue: 32}, {temporal_role.shop_order_ordered_at__quarter: '2024-04-01T00:00:00', revenue: 18}, {temporal_role.shop_order_ordered_at__quarter: '2024-07-01T00:00:00', revenue: 2}]
    reference_sql: |
      SELECT CAST(date_trunc('quarter', (ordered_at AT TIME ZONE 'UTC') AT TIME ZONE 'America/New_York') AS DATE), SUM(amount)
      FROM orders GROUP BY 1 ORDER BY 1
  shop/goods-and-shipping-refunds-must-say-same-refund-or-separate:
    kind: validate_fails_with_code
    expect: clarify
    why: Order 7 has goods and shipping on different refunds, so plain child conditions must ask which reading is intended.
    cites: &child_cites [tests/integration/correctness/shop/models/orders.yml#model.measures.order_count, tests/integration/correctness/shop/models/refunds.yml#model.dimensions.refund_type, docs/QUERY_IR_SCHEMA.md#child-groups]
    tags: [child-scope]
    query:
      select: &orders [{expression: {measure: measure.shop.order_count}, as: order_count}]
      where:
        - {field: dimension.shop_refund_refund_type, op: '=', value: goods}
        - {field: dimension.shop_refund_refund_type, op: '=', value: shipping}
    code: AMBIGUOUS_CHILD_SCOPE
    clarify: {options: [same_row, separate_rows]}
  shop/orders-with-goods-and-shipping-on-separate-refunds:
    kind: query_matches_snapshot
    expect: answer
    why: Separate child groups require two EXISTS checks, and only order 7 has both kinds of refund.
    cites: *child_cites
    tags: [child-scope]
    query:
      select: *orders
      where:
        - {child: entity.shop_refund, match: any, where: [{field: dimension.shop_refund_refund_type, op: '=', value: goods}]}
        - {child: entity.shop_refund, match: any, where: [{field: dimension.shop_refund_refund_type, op: '=', value: shipping}]}
    expected_rows: [{order_count: 1}]
    reference_sql: |
      SELECT COUNT(order_id) FROM orders o
      WHERE EXISTS (SELECT 1 FROM refunds r WHERE r.order_id = o.order_id AND r.refund_type = 'goods')
        AND EXISTS (SELECT 1 FROM refunds r WHERE r.order_id = o.order_id AND r.refund_type = 'shipping')
  shop/is-with-a-value-is-refused:
    kind: validate_fails_with_code
    expect: refuse
    why: IS accepts only null or a boolean, so a string store value is refused before inspecting orders.
    cites: [tests/integration/correctness/shop/models/orders.yml#model.measures.order_count, tests/integration/correctness/shop/models/orders.yml#model.dimensions.store_id, docs/QUERY_IR_SCHEMA.md#wherefilter]
    tags: [refusal]
    query:
      select: *orders
      where: [{field: dimension.shop_order_store_id, op: IS, value: x}]
    code: INVALID_QUERY
  shop/plan-revenue-by-store:
    kind: query_matches_snapshot
    expect: answer
    why: Revenue sums order amounts within each store, including order 8's null store with 6.
    cites: *store_cites
    tags: [planner]
    intent: revenue by store
    known_wrong: {planner: "The signup channel declares the value store, so the planner reads store as that value inside the grouping name and withholds execute readiness."}
    query: {select: *revenue, group_by: *store}
    expected_rows: [{dimension.shop_order_store_id: a, revenue: 43}, {dimension.shop_order_store_id: b, revenue: 25}, {dimension.shop_order_store_id: null, revenue: 6}]
    reference_sql: SELECT store_id, SUM(amount) FROM orders GROUP BY 1
  shop/plan-revenue-by-store-for-store-b:
    kind: query_matches_snapshot
    expect: answer
    why: Equality selects only b's orders 2, 5, 9 and 10, totaling 25.
    cites: *store_cites
    tags: [planner]
    intent: revenue by store for store b
    known_wrong: {planner: "The planner cannot resolve the store value yet and withholds execute readiness."}
    query: {select: *revenue, group_by: *store, where: [{field: dimension.shop_order_store_id, op: '=', value: b}]}
    expected_rows: [{dimension.shop_order_store_id: b, revenue: 25}]
    reference_sql: SELECT store_id, SUM(amount) FROM orders WHERE store_id = 'b' GROUP BY 1
  shop/plan-signups-excluding-web:
    kind: query_matches_snapshot
    expect: answer
    why: An exclusion keeps the signups with no recorded channel, so customers 102, 104 and 107 (store) and 105 (no channel) remain.
    cites: [tests/integration/correctness/shop/models/signups.yml#model.measures.signup_count, tests/integration/correctness/shop/models/signups.yml#model.dimensions.channel, docs/QUERY_IR_SCHEMA.md#wherefilter]
    tags: [planner]
    intent: signups excluding web
    query:
      select: &signups [{expression: {measure: measure.shop.signup_count}, as: signup_count}]
      where: &not_web [{field: dimension.shop_customer_channel, op: IS DISTINCT FROM, value: web}]
    expected_rows: [{signup_count: 4}]
    reference_sql: SELECT COUNT(DISTINCT customer_id) FROM signups WHERE channel IS DISTINCT FROM 'web'
  shop/plan-signups-excluding-web-in-june-2024:
    kind: query_matches_snapshot
    expect: answer
    why: In June 2024 only customer 106 (web, June 25) and customer 107 (store, June 10) signed up; excluding web keeps 107.
    cites: [tests/integration/correctness/shop/models/signups.yml#model.measures.signup_count, tests/integration/correctness/shop/models/signups.yml#model.dimensions.channel, tests/integration/correctness/shop/models/signups.yml#model.times.signed_up_at, docs/QUERY_IR_SCHEMA.md#wherefilter, docs/QUERY_IR_SCHEMA.md#timeblock]
    tags: [planner, time-window]
    intent: signups excluding web in June 2024
    query:
      select: *signups
      time: {temporal_role: temporal_role.shop_customer_signed_up_at, grain: month, start: '2024-06-01', end: '2024-07-01'}
      where: *not_web
    expected_rows: [{temporal_role.shop_customer_signed_up_at__month: '2024-06-01T00:00:00', signup_count: 1}]
    reference_sql: |
      SELECT CAST(date_trunc('month', signed_up_at) AS DATE), COUNT(DISTINCT customer_id) FROM signups
      WHERE channel IS DISTINCT FROM 'web'
        AND signed_up_at >= TIMESTAMP '2024-06-01' AND signed_up_at < TIMESTAMP '2024-07-01'
      GROUP BY 1

  shop/plan-refunds-must-say-same-refund-or-separate:
