  shop/utc-fiscal_quarter:
    kind: query_matches_snapshot
    expect: answer
    why: Freeze the declared inputs and independent reference for utc fiscal quarter.
    cites:
      - tests/integration/correctness/shop/models/orders.yml#model.measures.revenue
      - tests/integration/correctness/shop/models/orders.yml#model.times.ordered_at
      - tests/integration/correctness/conftest.py#CLOCKS
      - tests/integration/correctness/shop/models/fiscal_calendar.yml#model.dimensions.quarter_start
      - docs/QUERY_IR_SCHEMA.md#empty-groups-null-or-0
      - docs/QUERY_IR_SCHEMA.md#selectexpression-discriminated-union
      - docs/QUERY_IR_SCHEMA.md#timeblock
    tags: [time-window]
    variant: utc_authored
    query:
      select:
      - expression:
          measure: measure.shop.revenue
        as: revenue
      time:
        temporal_role: temporal_role.shop_order_ordered_at
        grain: quarter
        start: '2023-08-01'
        end: '2024-11-01'
        fill: true
        calendar_id: fiscal
    reference_sql: WITH coverage AS (SELECT MIN(c.quarter_start) lo, MAX(CASE WHEN o.ordered_at <= (CURRENT_TIMESTAMP
      AT TIME ZONE 'UTC') THEN c.quarter_start END) hi FROM orders o JOIN dim_fiscal c ON c.date_day = CAST(o.ordered_at
      AS DATE)) SELECT f.quarter_start, COALESCE(SUM(o.amount), CASE WHEN f.quarter_start BETWEEN (SELECT lo FROM coverage)
      AND (SELECT hi FROM coverage) THEN 0 END) FROM dim_fiscal AS f LEFT JOIN orders AS o ON f.date_day = CAST(o.ordered_at
      AS DATE) WHERE f.date_day >= DATE '2023-08-01' AND f.date_day < DATE '2024-11-01' GROUP BY 1
    expected_rows:
      - {temporal_role.shop_order_ordered_at__quarter: '2023-08-01T00:00:00', revenue: null}
      - {temporal_role.shop_order_ordered_at__quarter: '2023-11-01T00:00:00', revenue: 42}
      - {temporal_role.shop_order_ordered_at__quarter: '2024-02-01T00:00:00', revenue: 12}
