          THEN COUNT(DISTINCT t.ticket_id) END
      FROM generate_series(TIMESTAMP '2024-09-23', TIMESTAMP '2024-10-14', INTERVAL '7 days') AS g(b)
      LEFT JOIN loaded AS t ON t.opened_at >= g.b AND t.opened_at < g.b + INTERVAL '7' DAY
