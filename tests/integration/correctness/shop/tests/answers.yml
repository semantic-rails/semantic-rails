  shop/prior_and_trailing_two_quarters:
    kind: query_matches_snapshot
    expect: answer
    why: Freeze the declared inputs and independent reference for prior and trailing two quarters.
    cites:
      - tests/integration/correctness/shop/models/orders.yml#model.measures.revenue
      - tests/integration/correctness/shop/models/orders.yml#model.times.ordered_at
      - tests/integration/correctness/conftest.py#CLOCKS
      - docs/QUERY_IR_SCHEMA.md#empty-groups-null-or-0
      - docs/QUERY_IR_SCHEMA.md#selectexpression-discriminated-union
      - docs/QUERY_IR_SCHEMA.md#timeblock
    tags: [time-window]
    variant: utc_implicit
    query:
      select:
      - expression:
          kind: prior_period
          input:
            measure: measure.shop.revenue
          offset:
            unit: quarter
            value: 2
        as: prior
      - expression:
          kind: rolling
          input:
            measure: measure.shop.revenue
          window:
            unit: quarter
            value: 2
        as: trailing
      time:
        temporal_role: temporal_role.shop_order_ordered_at
        grain: quarter
    reference_sql: |-
      WITH m AS (
                SELECT date_trunc('quarter', o.ordered_at) AS b, SUM(o.amount) AS v
                FROM orders AS o GROUP BY 1
              ),
              s AS (SELECT g.b FROM generate_series((SELECT MIN(b) FROM m), (SELECT MAX(b) FROM m), INTERVAL '3 month') AS g(b))
              SELECT s.b, CASE WHEN s.b - INTERVAL '6 month' < (SELECT MIN(b) FROM s) THEN NULL ELSE (SELECT CASE WHEN COUNT(*) = 0 THEN 0 ELSE MAX(m.v) END FROM m WHERE m.b = s.b - INTERVAL '6 month') END, (SELECT COALESCE(SUM(m.v), 0) FROM m WHERE m.b <= s.b AND m.b > s.b - INTERVAL '6 month') FROM s
    expected_rows:
      - {temporal_role.shop_order_ordered_at__quarter: '2023-10-01T00:00:00', prior: null, trailing: 22}
      - {temporal_role.shop_order_ordered_at__quarter: '2024-01-01T00:00:00', prior: null, trailing: 54}
      - {temporal_role.shop_order_ordered_at__quarter: '2024-04-01T00:00:00', prior: 22, trailing: 41}
      - {temporal_role.shop_order_ordered_at__quarter: '2024-07-01T00:00:00', prior: 32, trailing: 20}
