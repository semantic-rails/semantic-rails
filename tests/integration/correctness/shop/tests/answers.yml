      - measure.shop.revenue
      - expression: measure.shop.average_order
        as: average
      time:
        temporal_role: temporal_role.shop_order_ordered_at
        grain: month
        start: '2023-10-01'
        end: '2024-09-01'
    reference_sql: |-
      WITH m AS (
