      SELECT o.store_id, COUNT(*) FROM order_tags AS l
      LEFT JOIN orders AS o ON o.order_id = l.order_id GROUP BY o.store_id
  shop/row-grain-parents-by-child-column:
    kind: query_matches_snapshot
    expect: answer
    why: Orders by scan type, each order counted once per type it has a scan of, de-duplicated on the order key.
    cites: [tests/integration/correctness/shop/models/orders.yml#model.measures.order_count, tests/integration/correctness/shop/models/shipment_scans.yml#model.dimensions.scan_type]
    tags: [row-grain]
    query:
      select: [measure.shop.order_count]
      group_by: [dimension.shop_shipment_scans_scan_type]
    expected_rows:
      - {dimension.shop_shipment_scans_scan_type: pickup, order_count: 5}
      - {dimension.shop_shipment_scans_scan_type: delivery, order_count: 2}
    reference_sql: |
      SELECT s.scan_type, COUNT(DISTINCT o.order_id) FROM orders AS o
      JOIN shipment_scans AS s ON s.order_id = o.order_id GROUP BY s.scan_type
  shop/row-grain-three-facts-by-grandparent-column:
    kind: query_matches_snapshot
    expect: answer
    why: Scans, revenue and refunds by signup channel, each aggregated before they meet; the NULL channel holds what no signed-up channel reaches.
    cites: [tests/integration/correctness/shop/models/shipment_scans.yml#model.measures.scan_count, tests/integration/correctness/shop/models/orders.yml#model.measures.revenue, tests/integration/correctness/shop/models/refunds.yml#model.measures.refund_count]
    tags: [row-grain, second-fact, null-vs-zero]
    query:
      select: [measure.shop.scan_count, measure.shop.revenue, measure.shop.refund_count]
      group_by: [dimension.shop_customer_channel]
    expected_rows:
      - {dimension.shop_customer_channel: null, scan_count: 2, revenue: 2, refund_count: 2}
      - {dimension.shop_customer_channel: store, scan_count: 2, revenue: 17, refund_count: 3}
      - {dimension.shop_customer_channel: web, scan_count: 6, revenue: 55, refund_count: 1}
    reference_sql: |
      WITH scans AS (
        SELECT c.channel, COUNT(*) AS n FROM shipment_scans AS s
        LEFT JOIN orders AS o ON o.order_id = s.order_id
        LEFT JOIN signups AS c ON c.customer_id = o.customer_id GROUP BY c.channel
      ), revenue AS (
        SELECT c.channel, SUM(o.amount) AS n FROM orders AS o
        LEFT JOIN signups AS c ON c.customer_id = o.customer_id GROUP BY c.channel
      ), refunded AS (
        SELECT c.channel, COUNT(DISTINCT r.refund_id) AS n FROM refunds AS r
        LEFT JOIN orders AS o ON o.order_id = r.order_id
        LEFT JOIN signups AS c ON c.customer_id = o.customer_id GROUP BY c.channel
      ), channels AS (
        SELECT channel FROM scans UNION SELECT channel FROM revenue UNION SELECT channel FROM refunded
      )
      SELECT k.channel, s.n, v.n, f.n FROM channels AS k
      LEFT JOIN scans AS s ON s.channel IS NOT DISTINCT FROM k.channel
      LEFT JOIN revenue AS v ON v.channel IS NOT DISTINCT FROM k.channel
      LEFT JOIN refunded AS f ON f.channel IS NOT DISTINCT FROM k.channel
  shop/row-grain-pinned-route-filter:
    kind: query_matches_snapshot
    expect: answer
    why: A pinned route from scans through their order to its refunds filters the scans with EXISTS; order 2's two goods refunds keep its scan once.
    cites: [tests/integration/correctness/shop/models/shipment_scans.yml#model.measures.scan_weight, docs/QUERY_CALL.md#where]
    tags: [row-grain, child-scope]
    query:
      select: [measure.shop.scan_weight]
      where: [{field: dimension.shop_refund_refund_type, op: is, value: goods}]
      routes: [{from: entity.shop_shipment_scans, to: entity.shop_refund, via: [relationship.shipment_scans_order, relationship.refunds_order]}]
    expected_rows:
      - {scan_weight: 2.75}
    reference_sql: |
      SELECT SUM(s.weight) FROM shipment_scans AS s
      WHERE EXISTS (SELECT 1 FROM refunds AS r WHERE r.order_id = s.order_id AND r.refund_type = 'goods')
  shop/row-grain-pinned-route-grouped-refuses:
    kind: validate_fails_with_code
    expect: refuse
    code: MIXED_GRAIN_INVALID
    why: Grouping scans by a refund dimension would split each scan over its order's refunds; the lookup before the one-to-many hop is refused.
    cites: [tests/integration/correctness/shop/models/shipment_scans.yml#model.measures.scan_weight, docs/QUERY_CALL.md#group_by]
    tags: [row-grain, refusal]
    query:
      select: [measure.shop.scan_weight]
      group_by: [dimension.shop_refund_refund_type]
      routes: [{from: entity.shop_shipment_scans, to: entity.shop_refund, via: [relationship.shipment_scans_order, relationship.refunds_order]}]
  shop/row-grain-distinct-count-across-a-lookup-and-fan-out-refuses:
    kind: validate_fails_with_code
    expect: refuse
    code: MIXED_GRAIN_INVALID
    why: The scans' distinct orders grouped by refund type cross a lookup and then a one-to-many hop, which relates the two many-to-many.
    cites: [tests/integration/correctness/shop/models/shipment_scans.yml#model.measures.scanned_orders, docs/QUERY_CALL.md#group_by]
    tags: [row-grain, refusal]
    query:
      select: [measure.shop.scanned_orders]
      group_by: [dimension.shop_refund_refund_type]
  shop/row-grain-parent-sum-by-child-column:
    kind: query_matches_snapshot
    expect: answer
    why: Revenue by scan type counts each order once, with its whole amount, under every type it has a scan of. Pickup holds orders 1, 2, 4, 6 and 8 (45), delivery orders 1 and 4 (30), so the groups add up to 75 of the 74 in all; order 1's duplicate pickup scan counts once, and the scans with no order or an unknown one reach none.
    cites: [tests/integration/correctness/shop/models/orders.yml#model.measures.revenue, docs/QUERY_CALL.md#groups-across-a-one-to-many-hop]
    tags: [row-grain]
    query:
      select: [measure.shop.revenue]
      group_by: [dimension.shop_shipment_scans_scan_type]
    expected_rows:
      - {dimension.shop_shipment_scans_scan_type: pickup, revenue: 45}
      - {dimension.shop_shipment_scans_scan_type: delivery, revenue: 30}
    reference_sql: |
      SELECT s.scan_type, SUM(o.amount) FROM orders AS o
      JOIN (SELECT DISTINCT order_id, scan_type FROM shipment_scans) AS s ON s.order_id = o.order_id
      GROUP BY s.scan_type
  shop/bridge-parent-sum-by-tag:
    kind: query_matches_snapshot
    expect: answer
    why: Revenue by tag through the order tags link table counts each order's whole amount once under each of its tags. Gift holds orders 1 and 4 (order 1's link stored twice counts once), rush orders 1 and 2, fragile orders 4 and 9.
    cites: [tests/integration/correctness/shop/models/orders.yml#model.measures.revenue, tests/integration/correctness/shop/models/tags.yml#model.dimensions.tag_name, docs/QUERY_CALL.md#groups-across-a-one-to-many-hop]
    tags: [row-grain]
    query:
      select: [measure.shop.revenue]
      group_by: [dimension.shop_tag_tag_name]
    expected_rows:
      - {dimension.shop_tag_tag_name: gift, revenue: 30}
      - {dimension.shop_tag_tag_name: rush, revenue: 15}
      - {dimension.shop_tag_tag_name: fragile, revenue: 23}
    reference_sql: |
      SELECT t.tag_name, SUM(o.amount) FROM orders AS o
      JOIN (SELECT DISTINCT l.order_id, g.tag_name FROM order_tags AS l JOIN tags AS g ON g.tag_id = l.tag_id) AS t
        ON t.order_id = o.order_id
      GROUP BY t.tag_name
  shop/keyed-child-parent-sum-by-refund-type:
    kind: query_matches_snapshot
    expect: answer
    why: Revenue by refund type counts each order's whole amount once per type it has a refund of. Goods holds orders 2 (two goods refunds, counted once), 6 and 7 (no amount), shipping orders 4 and 7; the refunds' own amounts are other measures.
    cites: [tests/integration/correctness/shop/models/orders.yml#model.measures.revenue, tests/integration/correctness/shop/models/refunds.yml#model.dimensions.refund_type, docs/QUERY_CALL.md#groups-across-a-one-to-many-hop]
    tags: [null-vs-zero]
    query:
      select: [measure.shop.revenue]
      group_by: [dimension.shop_refund_refund_type]
    expected_rows:
      - {dimension.shop_refund_refund_type: goods, revenue: 9}
      - {dimension.shop_refund_refund_type: shipping, revenue: 20}
    reference_sql: |
      SELECT r.refund_type, SUM(o.amount) FROM orders AS o
      JOIN (SELECT DISTINCT order_id, refund_type FROM refunds) AS r ON r.order_id = o.order_id
      GROUP BY r.refund_type
  shop/one-per-key-rooms-by-booker:
    kind: query_matches_snapshot
    expect: answer
    why: Each room counts once under every booker of it. Ana booked r1 twice and r2 (2 rooms), Ben r3, Cy r5; Dee's r9 is no room and Eve's booking has none, so neither is a group.
    cites: [tests/integration/correctness/shop/models/rooms.yml#model.measures.room_count, tests/integration/correctness/shop/models/room_bookings.yml#model.dimensions.booker, docs/QUERY_CALL.md#groups-across-a-one-to-many-hop]
    tags: [one-per-key, row-grain]
    query:
      select: [measure.shop.room_count]
      group_by: [dimension.shop_room_bookings_booker]
    expected_rows:
      - {dimension.shop_room_bookings_booker: ana, room_count: 2}
      - {dimension.shop_room_bookings_booker: ben, room_count: 1}
      - {dimension.shop_room_bookings_booker: cy, room_count: 1}
    reference_sql: |
      SELECT b.booker, COUNT(*) FROM (SELECT DISTINCT room_id FROM room_rows WHERE room_id IS NOT NULL) AS r
      JOIN (SELECT DISTINCT room_id, booker FROM room_bookings) AS b ON b.room_id = r.room_id
      GROUP BY b.booker
  shop/bridge-parent-sum-by-tag-with-a-grand-total:
    kind: query_matches_snapshot
    expect: answer
    why: The grand total is the call without the grouping, every order once (74, untagged orders included), never the 68 the overlapping tag groups add up to.
    cites: [tests/integration/correctness/shop/models/orders.yml#model.measures.revenue, docs/QUERY_CALL.md#groups-across-a-one-to-many-hop, docs/QUERY_CALL.md#totals]
    tags: [row-grain]
    query:
      select: [measure.shop.revenue]
      group_by: [dimension.shop_tag_tag_name]
      totals: []
    expected_rows:
      - {dimension.shop_tag_tag_name: gift, revenue: 30, total_over: null}
      - {dimension.shop_tag_tag_name: rush, revenue: 15, total_over: null}
      - {dimension.shop_tag_tag_name: fragile, revenue: 23, total_over: null}
      - {dimension.shop_tag_tag_name: null, revenue: 74, total_over: dimension.shop_tag_tag_name}
    reference_sql: |
      SELECT t.tag_name, SUM(o.amount), CAST(NULL AS VARCHAR(64)) FROM orders AS o
      JOIN (SELECT DISTINCT l.order_id, g.tag_name FROM order_tags AS l JOIN tags AS g ON g.tag_id = l.tag_id) AS t
        ON t.order_id = o.order_id
      GROUP BY t.tag_name
      UNION ALL
      SELECT NULL, SUM(amount), 'dimension.shop_tag_tag_name' FROM orders
  shop/one-per-key-room-area-by-booker:
    kind: query_matches_snapshot
    expect: answer
    why: Each room's whole area counts once under every booker of it. Ana's r1 and r2 add 400 and Ben's r3 100; Cy's r5 has two areas, so its area reads NULL and Cy's group is NULL, not 0.
    cites: [tests/integration/correctness/shop/models/rooms.yml#model.measures.room_area, docs/QUERY_CALL.md#groups-across-a-one-to-many-hop, docs/PACKAGE_AUTHORING.md#one-row-per-key]
    tags: [one-per-key, null-vs-zero]
    query:
      select: [measure.shop.room_area]
      group_by: [dimension.shop_room_bookings_booker]
    expected_rows:
      - {dimension.shop_room_bookings_booker: ana, room_area: 400}
      - {dimension.shop_room_bookings_booker: ben, room_area: 100}
      - {dimension.shop_room_bookings_booker: cy, room_area: null}
    reference_sql: |
      SELECT b.booker, SUM(r.area) FROM (
        SELECT room_id, CASE WHEN COUNT(DISTINCT area) = 1 THEN MIN(area) END AS area
        FROM room_rows WHERE room_id IS NOT NULL GROUP BY room_id
      ) AS r
      JOIN (SELECT DISTINCT room_id, booker FROM room_bookings) AS b ON b.room_id = r.room_id
      GROUP BY b.booker
  shop/share-over-overlapping-groups-refuses:
    kind: validate_fails_with_code
    expect: refuse
    code: MIXED_GRAIN_INVALID
    why: Each order counts under every tag it has, so a share's total over the tags, the sum of the groups (6), is not the 5 tagged orders; the share is refused rather than read below each tag's fraction.
    cites: [tests/integration/correctness/shop/models/orders.yml#model.measures.order_count, docs/QUERY_CALL.md#groups-across-a-one-to-many-hop]
    tags: [refusal]
    query:
      select:
        - measure.shop.order_count
        - {as: tag_share, expression: {kind: share, input: measure.shop.order_count, over: [dimension.shop_tag_tag_name]}}
      group_by: [dimension.shop_tag_tag_name]
  shop/row-grain-entity-filter-on-its-rows-refuses:
    kind: validate_fails_with_code
    expect: refuse
    code: ROW_GRAIN_UNSUPPORTED
    why: An aggregate per scan needs to tell scans apart, which a model with no key can't.
    cites: [tests/integration/correctness/shop/models/shipment_scans.yml#model.measures.scan_weight, docs/QUERY_CALL.md#entity-filters]
    tags: [row-grain, refusal]
    query:
      select: [measure.shop.scan_count]
      where:
        - entity: entity.shop_shipment_scans
          having: [{field: measure.shop.scan_weight, op: gte, value: 1}]
          over: all_time
  shop/row-grain-per-row-distribution-refuses:
    kind: validate_fails_with_code
    expect: refuse
    code: ROW_GRAIN_UNSUPPORTED
    why: A distribution over each scan's value needs to tell scans apart.
    cites: [tests/integration/correctness/shop/models/shipment_scans.yml#model.measures.scan_weight, docs/QUERY_CALL.md#inline-expression-kinds]
    tags: [row-grain, refusal]
    query:
      select:
        - as: median_scan
          expression: {kind: distribution, function: median, over: {kind: entity_value, entity: entity.shop_shipment_scans, input: measure.shop.scan_weight}}
  shop/row-grain-non-additive-sum-refuses:
    kind: validate_fails_with_code
    expect: refuse
    code: ROW_GRAIN_UNSUPPORTED
    why: Summing a value that must not be summed needs each row's key fixed, and a model with no key has none.
    cites: [tests/integration/correctness/shop/models/shipment_scans.yml#model.measures.heaviest_scan, docs/QUERY_CALL.md#inline-expression-kinds]
    tags: [row-grain, refusal]
    query:
      select:
        - {as: total, expression: {kind: measure, measure: measure.shop.heaviest_scan, aggregation: sum}}
  shop/row-grain-non-additive-default-answers:
    kind: query_matches_snapshot
    expect: answer
    why: The non-additive measure's own maximum reads every row and needs no key.
    cites: [tests/integration/correctness/shop/models/shipment_scans.yml#model.measures.heaviest_scan, tests/integration/correctness/shop/models/orders.yml#model.dimensions.store_id]
    tags: [row-grain]
    query:
      select: [measure.shop.heaviest_scan]
      group_by: [dimension.shop_order_store_id]
    expected_rows:
      - {dimension.shop_order_store_id: null, heaviest_scan: 4}
      - {dimension.shop_order_store_id: a, heaviest_scan: 3.25}
      - {dimension.shop_order_store_id: b, heaviest_scan: 2}
    reference_sql: |
      SELECT o.store_id, MAX(s.weight) FROM shipment_scans AS s
      LEFT JOIN orders AS o ON o.order_id = s.order_id GROUP BY o.store_id
  shop/one-per-key-conflicting-area-reads-null:
    kind: query_matches_snapshot
    expect: answer
    why: A one-per-key model reads one row per room. r5's two rows disagree on its area, so its area reads NULL, and the row with no room is no room.
    cites: [tests/integration/correctness/shop/models/rooms.yml#model.measures.room_area, docs/PACKAGE_AUTHORING.md#one-row-per-key]
    tags: [one-per-key]
    query:
      select: [measure.shop.room_area]
      group_by: [dimension.shop_room_id]
    expected_rows:
      - {dimension.shop_room_id: r1, room_area: 100}
      - {dimension.shop_room_id: r2, room_area: 300}
      - {dimension.shop_room_id: r3, room_area: 100}
      - {dimension.shop_room_id: r4, room_area: 50}
      - {dimension.shop_room_id: r5, room_area: null}
    reference_sql: |
      SELECT room_id, CASE WHEN COUNT(DISTINCT area) = 1 THEN MIN(area) END FROM room_rows
      WHERE room_id IS NOT NULL GROUP BY room_id
  shop/one-per-key-null-beside-a-value-reads-the-value:
    kind: query_matches_snapshot
    expect: answer
    why: One of r3's rows has no floor, so its floor is the one value its rows hold, 1.
    cites: [tests/integration/correctness/shop/models/rooms.yml#model.dimensions.floor, docs/PACKAGE_AUTHORING.md#one-row-per-key]
    tags: [one-per-key]
    query:
      select: [measure.shop.room_count]
      group_by: [dimension.shop_room_floor]
    expected_rows:
      - {dimension.shop_room_floor: 1, room_count: 2}
      - {dimension.shop_room_floor: 2, room_count: 2}
      - {dimension.shop_room_floor: 3, room_count: 1}
    reference_sql: |
      SELECT floor, COUNT(*) FROM (
        SELECT room_id, CASE WHEN COUNT(DISTINCT floor) = 1 THEN MIN(floor) END AS floor
        FROM room_rows WHERE room_id IS NOT NULL GROUP BY room_id
      ) AS rooms
      GROUP BY floor
  shop/one-per-key-boolean-reads-its-one-value:
    kind: query_matches_snapshot
    expect: answer
    why: A true or false column is read as other columns are. r3's second row doesn't say, so r3 is accessible; r5's rows disagree, so r5, like r4, reads NULL.
    cites: [tests/integration/correctness/shop/models/rooms.yml#model.dimensions.accessible, docs/PACKAGE_AUTHORING.md#one-row-per-key]
    tags: [one-per-key]
    query:
      select: [measure.shop.room_count]
      group_by: [dimension.shop_room_accessible]
    expected_rows:
      - {dimension.shop_room_accessible: null, room_count: 2}
      - {dimension.shop_room_accessible: false, room_count: 1}
      - {dimension.shop_room_accessible: true, room_count: 2}
    reference_sql: |
      SELECT accessible, COUNT(*) FROM (
        SELECT room_id, CASE WHEN COUNT(DISTINCT accessible) = 1 THEN BOOL_OR(accessible) END
          AS accessible
        FROM room_rows WHERE room_id IS NOT NULL GROUP BY room_id
      ) AS rooms
      GROUP BY accessible
  shop/one-per-key-stored-rows-look-up-their-room:
    kind: query_matches_snapshot
    expect: answer
    why: Every stored room row counts and looks up its room's building; the row with no room reads NULL.
    cites: [tests/integration/correctness/shop/models/room_rows.yml#model.measures.room_row_count, tests/integration/correctness/shop/models/rooms.yml#model.dimensions.building]
    tags: [one-per-key, row-grain]
    query:
      select: [measure.shop.room_row_count]
      group_by: [dimension.shop_room_building]
    expected_rows:
      - {dimension.shop_room_building: null, room_row_count: 1}
      - {dimension.shop_room_building: north, room_row_count: 3}
      - {dimension.shop_room_building: south, room_row_count: 5}
    reference_sql: |
      SELECT r.building, COUNT(*) FROM room_rows AS s
      LEFT JOIN (SELECT DISTINCT room_id, building FROM room_rows WHERE room_id IS NOT NULL) AS r
        ON r.room_id = s.room_id
      GROUP BY r.building
  shop/link-rooms-count-once-in-each-department:
    kind: query_matches_snapshot
    expect: answer
    why: A room counts once in every department it has a row in. r1 is in design and finance, r3's duplicated row counts once, and r4, with no department, is the NULL group.
    cites: &room_link_cites [tests/integration/correctness/shop/models/rooms.yml#model.measures.room_count, tests/integration/correctness/shop/models/room_rows.yml#model.dimensions.department, docs/QUERY_CALL.md#groups-across-a-link]
    tags: [link]
    query:
      select: [measure.shop.room_count]
      group_by: [dimension.shop_room_rows_department]
    expected_rows:
      - {dimension.shop_room_rows_department: null, room_count: 1}
      - {dimension.shop_room_rows_department: design, room_count: 2}
      - {dimension.shop_room_rows_department: finance, room_count: 2}
      - {dimension.shop_room_rows_department: legal, room_count: 1}
    reference_sql: |
      SELECT department, COUNT(DISTINCT room_id) FROM room_rows WHERE room_id IS NOT NULL
      GROUP BY department
  shop/link-room-total-counts-unique-rooms:
    kind: query_matches_snapshot
    expect: answer
    why: An ungrouped total crosses no link, so it counts five rooms, though the departments' counts add up to six.
    cites: *room_link_cites
    tags: [link]
    query:
      select: [measure.shop.room_count]
    expected_rows:
      - {room_count: 5}
    reference_sql: |
      SELECT COUNT(DISTINCT room_id) FROM room_rows
  shop/link-equal-areas-both-count:
    kind: query_matches_snapshot
    expect: answer
    why: r1 and r3 are both 100 and both in finance, so finance is 200; a room's amount is kept by room, never merged by value. Legal's only room, r5, has no one area, so legal reads NULL.
    cites: [tests/integration/correctness/shop/models/rooms.yml#model.measures.room_area, tests/integration/correctness/shop/models/room_rows.yml#model.dimensions.department, docs/QUERY_CALL.md#groups-across-a-link]
    tags: [link, null-vs-zero]
    query:
      select: [measure.shop.room_area]
      group_by: [dimension.shop_room_rows_department]
    expected_rows:
      - {dimension.shop_room_rows_department: null, room_area: 50}
      - {dimension.shop_room_rows_department: design, room_area: 400}
      - {dimension.shop_room_rows_department: finance, room_area: 200}
      - {dimension.shop_room_rows_department: legal, room_area: null}
    reference_sql: |
      WITH rooms AS (
        SELECT room_id, CASE WHEN COUNT(DISTINCT area) = 1 THEN MIN(area) END AS area
        FROM room_rows WHERE room_id IS NOT NULL GROUP BY room_id
      ), memberships AS (
        SELECT DISTINCT room_id, department FROM room_rows WHERE room_id IS NOT NULL
      )
      SELECT m.department, SUM(r.area) FROM memberships AS m JOIN rooms AS r ON r.room_id = m.room_id
      GROUP BY m.department
  shop/link-average-area-per-room:
    kind: query_matches_snapshot
    expect: answer
    why: A department's average area is over its rooms, each once (design's 100 and 300, finance's 100 and 100).
    cites: [tests/integration/correctness/shop/models/rooms.yml#model.measures.average_area, tests/integration/correctness/shop/models/room_rows.yml#model.dimensions.department, docs/QUERY_CALL.md#groups-across-a-link]
    tags: [link]
    query:
      select: [measure.shop.average_area]
      group_by: [dimension.shop_room_rows_department]
    expected_rows:
      - {dimension.shop_room_rows_department: null, average_area: 50}
      - {dimension.shop_room_rows_department: design, average_area: 200}
      - {dimension.shop_room_rows_department: finance, average_area: 100}
      - {dimension.shop_room_rows_department: legal, average_area: null}
    reference_sql: |
      WITH rooms AS (
        SELECT room_id, CASE WHEN COUNT(DISTINCT area) = 1 THEN MIN(area) END AS area
        FROM room_rows WHERE room_id IS NOT NULL GROUP BY room_id
      ), memberships AS (
        SELECT DISTINCT room_id, department FROM room_rows WHERE room_id IS NOT NULL
      )
      SELECT m.department, AVG(r.area) FROM memberships AS m JOIN rooms AS r ON r.room_id = m.room_id
      GROUP BY m.department
  shop/link-headcount-keeps-orphans-in-the-null-group:
    kind: query_matches_snapshot
    expect: answer
    why: People reach departments through their room. Person 5's room has no department, person 6's room has no row and person 7 has no room, so all three are the NULL group, none dropped; r1's two people count in design and in finance.
    cites: &people_link_cites [tests/integration/correctness/shop/models/people.yml#model.measures.headcount, tests/integration/correctness/shop/models/room_rows.yml#model.dimensions.department, docs/QUERY_CALL.md#groups-across-a-link]
    tags: [link, null-vs-zero]
    query:
      select: [measure.shop.headcount]
      group_by: [dimension.shop_room_rows_department]
    expected_rows:
      - {dimension.shop_room_rows_department: null, headcount: 3}
      - {dimension.shop_room_rows_department: design, headcount: 3}
      - {dimension.shop_room_rows_department: finance, headcount: 3}
    reference_sql: |
      SELECT m.department, COUNT(DISTINCT p.person_id) FROM people AS p
      LEFT JOIN (SELECT DISTINCT room_id, department FROM room_rows WHERE room_id IS NOT NULL) AS m
        ON m.room_id = p.room_id
      GROUP BY m.department
  shop/link-average-salary-weighs-people-not-rooms:
    kind: query_matches_snapshot
    expect: answer
    why: Design's average is over its three people (100, 100 and 400), 200; the average of its two rooms' averages would be 250.
    cites: [tests/integration/correctness/shop/models/people.yml#model.measures.average_salary, tests/integration/correctness/shop/models/room_rows.yml#model.dimensions.department, docs/QUERY_CALL.md#groups-across-a-link]
    tags: [link]
    query:
      select: [measure.shop.average_salary]
      group_by: [dimension.shop_room_rows_department]
    expected_rows:
      - {dimension.shop_room_rows_department: null, average_salary: 60}
      - {dimension.shop_room_rows_department: design, average_salary: 200}
      - {dimension.shop_room_rows_department: finance, average_salary: 150}
    reference_sql: |
      SELECT department, AVG(salary) FROM (
        SELECT DISTINCT p.person_id, m.department, p.salary FROM people AS p
        LEFT JOIN (SELECT DISTINCT room_id, department FROM room_rows WHERE room_id IS NOT NULL) AS m
          ON m.room_id = p.room_id
      ) AS members
      GROUP BY department
  shop/link-distinct-titles-repeat-across-rooms:
    kind: query_matches_snapshot
    expect: answer
    why: Design's two rooms hold only engineers, so design has one title, not one per room.
    cites: [tests/integration/correctness/shop/models/people.yml#model.measures.titles, tests/integration/correctness/shop/models/room_rows.yml#model.dimensions.department, docs/QUERY_CALL.md#groups-across-a-link]
    tags: [link]
    query:
      select: [measure.shop.titles]
      group_by: [dimension.shop_room_rows_department]
    expected_rows:
      - {dimension.shop_room_rows_department: null, titles: 2}
      - {dimension.shop_room_rows_department: design, titles: 1}
      - {dimension.shop_room_rows_department: finance, titles: 2}
    reference_sql: |
      SELECT m.department, COUNT(DISTINCT p.title) FROM people AS p
      LEFT JOIN (SELECT DISTINCT room_id, department FROM room_rows WHERE room_id IS NOT NULL) AS m
        ON m.room_id = p.room_id
      GROUP BY m.department
  shop/link-ratio-divides-department-totals:
    kind: query_matches_snapshot
    expect: answer
    why: Salary per person divides each department's total by its people (design 600 over 3), never averages its rooms' ratios (250).
    cites: [tests/integration/correctness/shop/models/people.yml#model.measures.salary, tests/integration/correctness/shop/models/people.yml#model.measures.headcount, docs/QUERY_CALL.md#groups-across-a-link]
    tags: [link]
    query:
      select:
        - as: per_person
          expression: {kind: ratio, numerator: measure.shop.salary, denominator: measure.shop.headcount}
      group_by: [dimension.shop_room_rows_department]
    expected_rows:
      - {dimension.shop_room_rows_department: null, per_person: 60.0}
      - {dimension.shop_room_rows_department: design, per_person: 200.0}
      - {dimension.shop_room_rows_department: finance, per_person: 150.0}
    reference_sql: |
      SELECT department, SUM(salary) / CAST(COUNT(*) AS DOUBLE PRECISION) FROM (
        SELECT DISTINCT p.person_id, m.department, p.salary FROM people AS p
        LEFT JOIN (SELECT DISTINCT room_id, department FROM room_rows WHERE room_id IS NOT NULL) AS m
          ON m.room_id = p.room_id
      ) AS members
      GROUP BY department
  shop/link-filter-counts-each-person-once:
    kind: query_matches_snapshot
    expect: answer
    why: A filter on a department keeps the people whose room has a row there; r1 is in both departments, and its two people still count once each.
    cites: *people_link_cites
    tags: [link, child-scope]
    query:
      select: [measure.shop.headcount]
      where:
        - {field: dimension.shop_room_rows_department, op: in, value: [design, finance]}
    expected_rows:
      - {headcount: 4}
    reference_sql: |
      SELECT COUNT(*) FROM people AS p WHERE EXISTS (
        SELECT 1 FROM room_rows AS r
        WHERE r.room_id = p.room_id AND r.department IN ('design', 'finance')
      )
  shop/link-negated-filter-asks:
    kind: validate_fails_with_code
    expect: clarify
    why: Not in design may mean a room with a row outside design (r1) or a room with no design row; the call must say which.
    cites: *people_link_cites
    tags: [link, child-scope]
    query:
      select: [measure.shop.headcount]
      where:
        - {field: dimension.shop_room_rows_department, op: not, value: design}
    code: AMBIGUOUS_CHILD_SCOPE
    clarify: {options: [any_not, none]}
  shop/link-two-groupings-read-one-stored-row:
    kind: query_matches_snapshot
    expect: answer
    why: Department and use are read off the same stored row. r1 is a design lab and a finance office, so it is never a design office.
    cites: [tests/integration/correctness/shop/models/rooms.yml#model.measures.room_count, tests/integration/correctness/shop/models/room_rows.yml#model.dimensions.room_use, docs/QUERY_CALL.md#groups-across-a-link]
    tags: [link]
    query:
      select: [measure.shop.room_count]
      group_by: [dimension.shop_room_rows_department, dimension.shop_room_rows_room_use]
    expected_rows:
      - {dimension.shop_room_rows_department: null, dimension.shop_room_rows_room_use: storage, room_count: 1}
      - {dimension.shop_room_rows_department: design, dimension.shop_room_rows_room_use: lab, room_count: 1}
      - {dimension.shop_room_rows_department: design, dimension.shop_room_rows_room_use: office, room_count: 1}
      - {dimension.shop_room_rows_department: finance, dimension.shop_room_rows_room_use: office, room_count: 2}
      - {dimension.shop_room_rows_department: legal, dimension.shop_room_rows_room_use: lab, room_count: 1}
      - {dimension.shop_room_rows_department: legal, dimension.shop_room_rows_room_use: office, room_count: 1}
    reference_sql: |
      SELECT department, room_use, COUNT(DISTINCT room_id) FROM room_rows
      WHERE room_id IS NOT NULL GROUP BY department, room_use
  shop/link-grouping-and-filter-read-one-stored-row:
    kind: query_matches_snapshot
    expect: answer
    why: Rooms by department where the use is office read both off one row, so design counts r2 only; r1's office row is finance's.
    cites: [tests/integration/correctness/shop/models/rooms.yml#model.measures.room_count, tests/integration/correctness/shop/models/room_rows.yml#model.dimensions.room_use, docs/QUERY_CALL.md#groups-across-a-link]
    tags: [link]
    query:
      select: [measure.shop.room_count]
      group_by: [dimension.shop_room_rows_department]
      where:
        - {field: dimension.shop_room_rows_room_use, op: is, value: office}
    expected_rows:
      - {dimension.shop_room_rows_department: design, room_count: 1}
      - {dimension.shop_room_rows_department: finance, room_count: 2}
      - {dimension.shop_room_rows_department: legal, room_count: 1}
    reference_sql: |
      SELECT department, COUNT(DISTINCT room_id) FROM room_rows
      WHERE room_id IS NOT NULL AND room_use = 'office' GROUP BY department
  shop/link-distinct-bookers-need-no-row-key:
    kind: query_matches_snapshot
    expect: answer
    why: Bookings have no key, but a distinct count of bookers needs none. Ana books r1 and r2 and counts once in design; dee's room has no row and eve's booking has no room, so both are the NULL group.
    cites: [tests/integration/correctness/shop/models/room_bookings.yml#model.measures.bookers, tests/integration/correctness/shop/models/room_rows.yml#model.dimensions.department, docs/QUERY_CALL.md#groups-across-a-link]
    tags: [link, row-grain]
    query:
      select: [measure.shop.bookers]
      group_by: [dimension.shop_room_rows_department]
    expected_rows:
      - {dimension.shop_room_rows_department: null, bookers: 2}
      - {dimension.shop_room_rows_department: design, bookers: 1}
      - {dimension.shop_room_rows_department: finance, bookers: 2}
      - {dimension.shop_room_rows_department: legal, bookers: 1}
    reference_sql: |
      SELECT m.department, COUNT(DISTINCT b.booker) FROM room_bookings AS b
      LEFT JOIN (SELECT DISTINCT room_id, department FROM room_rows WHERE room_id IS NOT NULL) AS m
        ON m.room_id = b.room_id
      GROUP BY m.department
  shop/link-booking-rows-refuse:
    kind: validate_fails_with_code
    expect: refuse
    code: MIXED_GRAIN_INVALID
    why: Bookings have no key, so nothing tells their rows apart to count each once in a department; a sum of them across a link is refused.
    cites: [tests/integration/correctness/shop/models/room_bookings.yml#model.measures.bookings, docs/QUERY_CALL.md#groups-across-a-link]
    tags: [link, row-grain, refusal]
    query:
      select: [measure.shop.bookings]
      group_by: [dimension.shop_room_rows_department]
  shop/link-share-refuses:
    kind: validate_fails_with_code
    expect: refuse
    code: MIXED_GRAIN_INVALID
    why: The departments overlap, so a share of their summed headcount (9) is no share of the 7 people.
    cites: *people_link_cites
    tags: [link, refusal]
    query:
      select:
        - as: share
          expression: {kind: share, input: measure.shop.headcount, over: [dimension.shop_room_rows_department]}
      group_by: [dimension.shop_room_rows_department]
  shop/link-cumulative-refuses:
    kind: validate_fails_with_code
    expect: refuse
    code: MIXED_GRAIN_INVALID
    why: A running total adds groups up, and groups across a link overlap.
    cites: *people_link_cites
    tags: [link, refusal]
    query:
      select:
        - {as: running, expression: {kind: cumulative, input: measure.shop.headcount}}
      group_by: [dimension.shop_room_rows_department]
      time: {temporal_role: temporal_role.shop_person_started_on, grain: month}
  shop/not-a-link-keeps-refusing:
    kind: validate_fails_with_code
    expect: refuse
    code: MIXED_GRAIN_INVALID
    why: Bookings are not on the rooms' relation, so people grouped by booker cross a lookup and then a plain one-to-many hop, which stays refused.
    cites: [tests/integration/correctness/shop/models/people.yml#model.measures.headcount, tests/integration/correctness/shop/models/room_bookings.yml#model.dimensions.booker]
    tags: [link, refusal]
    query:
      select: [measure.shop.headcount]
      group_by: [dimension.shop_room_bookings_booker]

  # Row filters through joins. The regional policy (shop/policies.yml) filters stores by the
  # caller's trusted region, and an order is visible only when its store is: a West manager's
  # answer is exactly an unfiltered caller's answer on the rows a West manager can see. Each
  # reference reads those rows through explicit visibility CTEs; an auditor is unfiltered.
  shop/row-filter-total-revenue:
    kind: query_matches_snapshot
    expect: answer
    why: A West manager sees Elm's orders 1, 3, 4, 6, 7 and 11; Oak's are hidden, and order 8 has no store, so no filtered caller counts it.
    cites: &row_filter_revenue_cites [tests/integration/correctness/shop/models/orders.yml#model.measures.revenue, tests/integration/correctness/shop/models/stores.yml#model.dimensions.region, docs/PACKAGE_AUTHORING.md#policiesyml]
    tags: [row-filter]
    context: &west {roles: [regional], attributes: {region: West}}
    query:
      select: &row_filter_revenue [measure.shop.revenue]
    expected_rows: [{revenue: 43}]
    reference_sql: |
      WITH visible_stores AS (SELECT store_id FROM stores WHERE region = 'West'),
      visible_orders AS (SELECT * FROM orders WHERE store_id IN (SELECT store_id FROM visible_stores))
      SELECT SUM(amount) FROM visible_orders
  shop/row-filter-total-revenue-unfiltered:
    kind: query_matches_snapshot
    expect: answer
    why: An auditor is outside the regional policy and sees every order, order 8 with no store included, so regions can sum below this total (43 + 25 of 74).
    cites: *row_filter_revenue_cites
    tags: [row-filter]
    context: &unfiltered {roles: [auditor]}
    query:
      select: *row_filter_revenue
    expected_rows: [{revenue: 74}]
    reference_sql: SELECT SUM(amount) FROM orders
  shop/row-filter-revenue-by-tag:
    kind: query_matches_snapshot
    expect: answer
    why: A West manager sees Elm's orders and their tag links alone, so gift holds orders 1 and 4 (30), rush order 1 (10) and fragile order 4 (20); Oak's orders 2 and 9 drop out of rush and fragile.
    cites: [tests/integration/correctness/shop/models/orders.yml#model.measures.revenue, tests/integration/correctness/shop/models/tags.yml#model.dimensions.tag_name, docs/QUERY_CALL.md#groups-across-a-one-to-many-hop, docs/PACKAGE_AUTHORING.md#policiesyml]
    tags: [row-filter]
    context: *west
    query:
      select: [measure.shop.revenue]
      group_by: [dimension.shop_tag_tag_name]
    expected_rows:
      - {dimension.shop_tag_tag_name: gift, revenue: 30}
      - {dimension.shop_tag_tag_name: rush, revenue: 10}
      - {dimension.shop_tag_tag_name: fragile, revenue: 20}
    reference_sql: |
      WITH visible_stores AS (SELECT store_id FROM stores WHERE region = 'West'),
      visible_orders AS (SELECT * FROM orders WHERE store_id IN (SELECT store_id FROM visible_stores)),
      visible_links AS (SELECT * FROM order_tags WHERE order_id IN (SELECT order_id FROM visible_orders))
      SELECT t.tag_name, SUM(o.amount) FROM visible_orders AS o
      JOIN (SELECT DISTINCT l.order_id, g.tag_name FROM visible_links AS l JOIN tags AS g ON g.tag_id = l.tag_id) AS t
        ON t.order_id = o.order_id
      GROUP BY t.tag_name
  shop/row-filter-revenue-by-store:
