      time: {temporal_role: temporal_role.shop_shipment_scans_scanned_at, grain: month}
    expected_rows:
      - {period: '2023-11-01', period_partial: false, scan_count: 4}
      - {period: '2024-01-01', period_partial: false, scan_count: 2}
      - {period: '2024-04-01', period_partial: false, scan_count: 1}
      - {period: '2024-05-01', period_partial: false, scan_count: 2}
      - {period: '2024-06-01', period_partial: false, scan_count: 1}
    reference_sql: |
      SELECT CAST(date_trunc('month', scanned_at) AS DATE) AS period, COUNT(*) FROM shipment_scans
      GROUP BY 1
  shop/row-grain-cumulative-rows:
    kind: query_matches_snapshot
    expect: answer
    why: A running total over the model's own clock sums its monthly row counts.
    cites: [tests/integration/correctness/shop/models/shipment_scans.yml#model.measures.scan_count, docs/QUERY_CALL.md#inline-expression-kinds]
    tags: [row-grain, time-window]
    query:
      select:
        - {as: running, expression: {kind: cumulative, input: measure.shop.scan_count}}
      time: {temporal_role: temporal_role.shop_shipment_scans_scanned_at, grain: month}
    expected_rows:
      - {period: '2023-11-01', period_partial: false, running: 4}
      - {period: '2024-01-01', period_partial: false, running: 6}
      - {period: '2024-04-01', period_partial: false, running: 7}
      - {period: '2024-05-01', period_partial: false, running: 9}
      - {period: '2024-06-01', period_partial: false, running: 10}
    reference_sql: |
      WITH monthly AS (
        SELECT CAST(date_trunc('month', scanned_at) AS DATE) AS period, COUNT(*) AS scans
        FROM shipment_scans GROUP BY 1
      )
      SELECT period, SUM(scans) OVER (ORDER BY period ROWS UNBOUNDED PRECEDING) FROM monthly
  shop/row-grain-parent-filtered-by-child-aggregate:
    kind: query_matches_snapshot
