      time: {temporal_role: temporal_role.shop_order_ordered_at, grain: month}
    expected_rows:
      - {dimension.shop_customer_history_customer_id: null, period: '2023-11-01', revenue: 10}
      - {dimension.shop_customer_history_customer_id: 102, period: '2023-11-01', revenue: 5}
      - {dimension.shop_customer_history_customer_id: 101, period: '2023-12-01', revenue: 7}
      - {dimension.shop_customer_history_customer_id: null, period: '2024-01-01', revenue: 20}
      - {dimension.shop_customer_history_customer_id: null, period: '2024-03-01', revenue: 8}
      - {dimension.shop_customer_history_customer_id: 102, period: '2024-03-01', revenue: 4}
      - {dimension.shop_customer_history_customer_id: null, period: '2024-05-01', revenue: 6}
      - {dimension.shop_customer_history_customer_id: null, period: '2024-06-01', revenue: 3}
      - {dimension.shop_customer_history_customer_id: null, period: '2024-07-01', revenue: 9}
      - {dimension.shop_customer_history_customer_id: null, period: '2024-08-01', revenue: 2}
    reference_sql: |
      SELECT h.customer_id, date_trunc('month', o.ordered_at), SUM(o.amount)
      FROM orders o LEFT JOIN customer_history h
        ON o.customer_id = h.customer_id AND o.ordered_at >= h.valid_from
        AND (o.ordered_at < h.valid_to OR h.valid_to IS NULL)
