      - docs/QUERY_CALL.md#time
    tags: [time-window]
    variant: utc_authored
    query:
      select:
      - measure.shop.revenue
      - expression: measure.shop.order_count
        as: orders
      time:
        temporal_role: temporal_role.shop_order_ordered_at
        grain: day
        start: '2024-05-06'
        end: '2024-05-08'
    reference_sql: |-
      SELECT g.b, CASE WHEN COUNT(o.order_id) = 0 THEN 0 ELSE SUM(o.amount) END, COUNT(o.order_id) FROM generate_series(date_trunc('day', TIMESTAMP '2024-05-06'), TIMESTAMP '2024-05-07', INTERVAL '1 day') AS g(b) LEFT JOIN orders AS o ON date_trunc('day', o.ordered_at) = g.b AND o.ordered_at >= TIMESTAMP '2024-05-06' AND o.ordered_at < TIMESTAMP '2024-05-08' GROUP BY 1
    expected_rows:
      - {period: '2024-05-06', revenue: null, orders: 1}
      - {period: '2024-05-07', revenue: 0, orders: 0}
