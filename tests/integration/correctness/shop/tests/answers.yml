    now: '2024-07-05T06:00:00Z'
    expected_rows: [{period: '2024-01-01', seats: 220}]
    reference_sql: |
      SELECT TIMESTAMP '2024-01-01', SUM(a.seats) FROM account_days AS a
      WHERE a.snapshot_day = (SELECT MAX(snapshot_day) FROM account_days
        WHERE snapshot_day >= DATE '2024-01-01' AND snapshot_day < DATE '2024-02-01')
  shop/a-running-total-over-a-window-without-a-grain-asks-for-one:
