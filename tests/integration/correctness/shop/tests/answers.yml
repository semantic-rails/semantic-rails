    cites: [tests/integration/correctness/shop/metrics/metrics.yml#metrics, tests/integration/correctness/shop/models/orders.yml#model.measures.order_count, docs/QUERY_CALL.md#empty-groups-null-or-0]
    tags: [null-vs-zero, time-window]
