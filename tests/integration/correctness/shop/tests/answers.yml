  shop/today-in-a-week-by-day-after-last-nights-load-reads-null:
    kind: query_matches_snapshot
    expect: answer
    why: 'This week by day on Friday November 15, 2024 at 06:00, after a load through Thursday the 14th: Monday to Thursday are loaded and quiet, so they read 0; today starts at the load''s edge, nothing of it is loaded, so it reads NULL.'
    cites: *exported_cites
    tags: [null-vs-zero, time-window]
    query:
      select: [measure.shop.exported_tickets]
      time: {this: week, grain: day}
    now: '2024-11-15T06:00:00Z'
    expected_rows:
      - {period: '2024-11-11', exported_tickets: 0}
      - {period: '2024-11-12', exported_tickets: 0}
      - {period: '2024-11-13', exported_tickets: 0}
      - {period: '2024-11-14', exported_tickets: 0}
      - {period: '2024-11-15', exported_tickets: null}
    reference_sql: |
      SELECT g.b,
        CASE WHEN COUNT(t.ticket_id) > 0
            OR g.b < (SELECT CAST(MAX(through_day) AS TIMESTAMP) + INTERVAL '1' DAY FROM ticket_exports)
          THEN COUNT(DISTINCT t.ticket_id) END
      FROM generate_series(TIMESTAMP '2024-11-11', TIMESTAMP '2024-11-15', INTERVAL '1 day') AS g(b)
      LEFT JOIN tickets AS t ON t.opened_at >= g.b AND t.opened_at < g.b + INTERVAL '1' DAY
        AND t.opened_at <= TIMESTAMP '2024-11-15 06:00:00'
      GROUP BY g.b
  shop/an-entity-filter-0-passes-over-weeks-past-the-load-log-is-refused:
    kind: validate_fails_with_code
    expect: refuse
    code: INVALID_METRIC_PREDICATE
    why: 'Tickets with no ticket opened that week, by week to October 21, 2024: the load log covers only through September 29, so a ticket''s 0 in a later week is not known; the filter can''t yet read those weeks as NULL for each ticket, so the call is refused rather than counting an unloaded week as 0.'
    cites: [tests/integration/correctness/shop/models/tickets.yml#model.measures.tickets_opened, tests/integration/correctness/shop/models/tickets.yml#model.zero_through, docs/QUERY_CALL.md#entity-filters]
    tags: [refusal, time-window]
    query:
      select: [measure.shop.tickets_opened]
      where:
        - entity: entity.shop_ticket
          having: [{field: measure.shop.tickets_opened, op: lte, value: 0}]
          over: period
      time: {start: '2024-09-23', end: '2024-10-21', grain: week}
    now: '2024-10-21T06:00:00Z'
  shop/an-entity-filter-0-fails-reads-nothing-past-the-load-log:
    kind: query_matches_snapshot
    expect: answer
    why: 'Tickets opened at least once that week, by week to October 21, 2024: a threshold 0 fails reads only real counts, and nothing past the load log''s September 29 is read, so the stray ticket 4 isn''t either; the loaded week of September 23 reads 0 and the later weeks NULL.'
    cites: [tests/integration/correctness/shop/models/tickets.yml#model.measures.tickets_opened, tests/integration/correctness/shop/models/tickets.yml#model.zero_through, docs/QUERY_CALL.md#entity-filters, docs/QUERY_CALL.md#empty-groups-null-or-0]
    tags: [null-vs-zero, time-window]
    query:
      select: [measure.shop.tickets_opened]
      where:
        - entity: entity.shop_ticket
          having: [{field: measure.shop.tickets_opened, op: gte, value: 1}]
          over: period
      time: {start: '2024-09-23', end: '2024-10-21', grain: week}
    now: '2024-10-21T06:00:00Z'
    expected_rows:
      - {period: '2024-09-23', tickets_opened: 0}
      - {period: '2024-09-30', tickets_opened: null}
      - {period: '2024-10-07', tickets_opened: null}
      - {period: '2024-10-14', tickets_opened: null}
    reference_sql: |
      WITH loaded AS (
        SELECT x.* FROM tickets AS x
        WHERE x.opened_at <= TIMESTAMP '2024-10-21 06:00:00'
          AND x.opened_at < (SELECT CAST(MAX(through_day) AS TIMESTAMP) + INTERVAL '1' DAY FROM ticket_loads)
      )
      SELECT g.b,
        CASE WHEN COUNT(t.ticket_id) > 0 OR g.b + INTERVAL '7' DAY <= (SELECT CAST(MAX(through_day) AS TIMESTAMP) + INTERVAL '1' DAY FROM ticket_loads)
          THEN COUNT(DISTINCT t.ticket_id) END
      FROM generate_series(TIMESTAMP '2024-09-23', TIMESTAMP '2024-10-14', INTERVAL '7 days') AS g(b)
      LEFT JOIN (
        SELECT x.ticket_id, x.opened_at FROM loaded AS x
        WHERE (SELECT COUNT(*) FROM loaded AS y WHERE y.ticket_id = x.ticket_id
          AND date_trunc('week', y.opened_at) = date_trunc('week', x.opened_at)) >= 1
      ) AS t ON t.opened_at >= g.b AND t.opened_at < g.b + INTERVAL '7' DAY
      GROUP BY g.b
  shop/a-ratio-with-no-denominator-in-the-window-reads-null:
