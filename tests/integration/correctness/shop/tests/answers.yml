    reference_sql: |
      SELECT COUNT(DISTINCT c.customer_id) FROM signups AS c
      WHERE EXISTS (SELECT 1 FROM shipment_scans AS s JOIN orders AS o ON o.order_id = s.order_id
        WHERE o.customer_id = c.customer_id)
  shop/row-grain-parent-filtered-by-child-rows:
