    expect: answer
    why: The model's own clock buckets its rows; a month with no scan has no row.
    cites: [tests/integration/correctness/shop/models/shipment_scans.yml#model.measures.scan_count, tests/integration/correctness/shop/models/shipment_scans.yml#model.times.scanned_at]
    tags: [row-grain, time-window]
