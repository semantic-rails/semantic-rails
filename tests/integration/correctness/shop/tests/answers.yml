      group_by: [dimension.shop_tag_tag_name]
    expected_rows:
      - {dimension.shop_tag_tag_name: rush, order_count: 2}
      - {dimension.shop_tag_tag_name: gift, order_count: 2}
      - {dimension.shop_tag_tag_name: fragile, order_count: 2}
    reference_sql: |
      SELECT t.tag_name, COUNT(DISTINCT o.order_id) FROM orders AS o
      JOIN order_tags AS l ON l.order_id = o.order_id JOIN tags AS t ON t.tag_id = l.tag_id
