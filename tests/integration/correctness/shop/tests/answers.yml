  shop/median-store-a-net-order-value-reads-only-orders-with-rows:
    kind: query_matches_snapshot
    expect: answer
    why: "Store a revenue less goods refunds per order. An order enters a month where one of the two has rows for it there: order 2 (store b, refunded 6) reads 0 - 6, beside order 1's 10, so November reads 2. Store b's orders with no refund (5, 9 and 10) and order 8 (no store) have no rows of either and stay out, so March reads order 6 alone (0) and June and July have no row. Order 7's amount is unknown, so May reads NULL."
    cites: *net_order_cites
    tags: [null-vs-zero, time-window]
    variant: utc_authored
    query:
      select:
      - expression:
          kind: distribution
          function: median
          over:
            kind: entity_value
            entity: entity.shop_order
            input:
              kind: arithmetic
              op: subtract
              left:
                kind: aggregate
                measure: measure.shop.revenue
                filter:
                  all: [{field: dimension.shop_order_store_id, op: is, value: a}]
              right: measure.shop.goods_refunded
        as: median
      time: {temporal_role: temporal_role.shop_order_ordered_at, grain: month}
    expected_rows:
      - {period: '2023-11-01', median: 2}
      - {period: '2023-12-01', median: 7}
      - {period: '2024-01-01', median: null}
      - {period: '2024-03-01', median: 0}
      - {period: '2024-05-01', median: null}
      - {period: '2024-08-01', median: 2}
    reference_sql: |
      WITH store_a AS (
        SELECT order_id, date_trunc('month', ordered_at) AS b, SUM(amount) AS v
        FROM orders WHERE store_id = 'a' GROUP BY 1, 2
      ),
      goods AS (
        SELECT o.order_id, date_trunc('month', o.ordered_at) AS b, SUM(r.goods_amount) AS v
        FROM refunds AS r JOIN orders AS o ON o.order_id = r.order_id GROUP BY 1, 2
      ),
      per_order AS (
        SELECT COALESCE(store_a.b, goods.b) AS b,
          CASE WHEN store_a.order_id IS NULL THEN 0 ELSE store_a.v END
            - CASE WHEN goods.order_id IS NULL THEN 0 ELSE goods.v END AS v
        FROM store_a FULL JOIN goods ON goods.order_id = store_a.order_id AND goods.b = store_a.b
      )
      SELECT b, percentile_cont(0.5) WITHIN GROUP (ORDER BY v) FROM per_order GROUP BY b
