  shop/stores-over-a-window-without-a-grain-are-listed-once:
    kind: query_matches_snapshot
    expect: answer
    why: 'Without a grain a window is one total: the stores with orders from November to December 2023 are listed once each (a and b), not once per order time (three orders).'
