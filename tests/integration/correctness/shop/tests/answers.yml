  shop/scoped-period-predicate-beside-a-where-answers-by-dataset:
    kind: query_matches_snapshot
    expect: answer
    why: Beside a row condition too, the scoped aggregate's own per-quarter predicate is read through its set under the dataset scope, so store a reads 24 (orders 4 and 6).
    cites: *quiet_cites
    tags: [null-vs-zero, time-window]
    query:
      select:
        - as: qualifying_revenue
          expression:
            kind: scoped_aggregate
            measure: measure.shop.revenue
            aggregation: sum
            predicates: [{entity: entity.shop_customer, measure: measure.shop.order_count, op: gte, value: 1, over: period}]
      group_by: [dimension.shop_order_store_id]
      where:
        - {field: dimension.shop_order_store_id, op: is, value: a}
      time: {temporal_role: temporal_role.shop_order_ordered_at, grain: quarter, start: '2024-01-01', end: '2024-04-01'}
    now: '2024-09-01T00:00:00Z'
    reference_sql: |
      SELECT o.store_id, date_trunc('quarter', o.ordered_at), SUM(o.amount) FROM orders AS o
      WHERE o.ordered_at >= TIMESTAMP '2024-01-01' AND o.ordered_at < TIMESTAMP '2024-04-01' AND o.store_id = 'a'
        AND EXISTS (SELECT 1 FROM orders AS x WHERE x.customer_id = o.customer_id
          AND date_trunc('quarter', x.ordered_at) = date_trunc('quarter', o.ordered_at)
          AND x.ordered_at >= TIMESTAMP '2024-01-01' AND x.ordered_at < TIMESTAMP '2024-04-01')
      GROUP BY 1, 2
    expected_rows:
      - {dimension.shop_order_store_id: a, period: '2024-01-01', qualifying_revenue: 24}
  shop/scoped-predicate-unknown-aggregate-fails-not:
    kind: query_matches_snapshot
    expect: answer
    why: A scoped aggregate's predicate takes the same per-entity threshold, so an order whose tax total is unknown never meets not 0.
    cites: *tax_cites
    tags: [null-vs-zero, empty-result]
    query:
      select:
        - as: refunds
          expression:
            kind: scoped_aggregate
            measure: measure.shop.refund_count
            predicates: [{entity: entity.shop_order, input: measure.shop.tax_refunded, op: not, value: 0, over: all_time}]
      group_by: [dimension.shop_order_id]
      observation_scope: query
    reference_sql: |
      SELECT r.order_id, COUNT(*) FROM refunds r
      WHERE r.order_id IN (SELECT order_id FROM refunds GROUP BY order_id
        HAVING SUM(tax_amount) IS NOT NULL AND SUM(tax_amount) <> 0)
      GROUP BY 1
    expected_rows: []
