  shop/entity-filter-over-a-start-only-window-ends-at-now:
    kind: query_matches_snapshot
    expect: answer
    why: 'The window runs from November 2023 to now (mid-April 2024), and the filter counts orders in that same window: 101 and 102 ordered twice in it, but 103 only once (order 4), as its second order (9, in June) is after now. Read without the end, 103 would qualify and add order 4 to store a.'
    cites: [tests/integration/correctness/shop/models/orders.yml#model.measures.revenue, tests/integration/correctness/shop/models/orders.yml#model.measures.order_count, docs/QUERY_CALL.md#entity-filters]
    tags: [child-scope, time-window]
    query:
      select: [measure.shop.revenue]
      group_by: [dimension.shop_order_store_id]
      time: {temporal_role: temporal_role.shop_order_ordered_at, start: '2023-11-01'}
      where:
        - entity: entity.shop_customer
          having: [{field: measure.shop.order_count, op: gte, value: 2}]
          over: window
    now: '2024-04-15T12:00:00Z'
    expected_rows:
      - {dimension.shop_order_store_id: a, revenue: 21}
      - {dimension.shop_order_store_id: b, revenue: 5}
    reference_sql: |
      SELECT o.store_id, SUM(o.amount) FROM orders o
      WHERE o.ordered_at >= TIMESTAMP '2023-11-01' AND o.ordered_at < TIMESTAMP '2024-04-15 12:00:00'
        AND o.customer_id IN (SELECT customer_id FROM orders
          WHERE ordered_at >= TIMESTAMP '2023-11-01' AND ordered_at < TIMESTAMP '2024-04-15 12:00:00'
          GROUP BY customer_id HAVING COUNT(*) >= 2)
      GROUP BY 1
  shop/text-compared-with-the-order-clock-reads-as-its-instant:
    kind: query_matches_snapshot
    expect: answer
    why: 'The condition compares the order clock with the text 2024-01-01 and reads the text as that instant, a typed literal where the warehouse refuses a timestamp beside text: the orders from January 2024 on count, the earlier ones do not.'
    cites: [tests/integration/correctness/shop/models/orders.yml#model.times.ordered_at, docs/QUERY_CALL.md#inline-expression-kinds]
    tags: [clock]
    query:
      select:
      - expression:
          kind: aggregate_if
          aggregation: count
          value: {kind: column, column: order_id, entity: entity.shop_order}
          condition:
            kind: comparison
            op: '>='
            left: {kind: column, column: ordered_at, entity: entity.shop_order}
            right: {kind: literal, value: '2024-01-01'}
        as: orders
    expected_rows:
      - {orders: 8}
    reference_sql: |
      SELECT COUNT(*) FROM orders WHERE ordered_at >= TIMESTAMP '2024-01-01'
  shop/text-compared-with-a-computed-time-reads-as-its-instant:
    kind: query_matches_snapshot
    expect: answer
    why: 'Each condition compares a time computed from the order clocks (a day after the order, the close or else the order time, the order time in store a and the close time elsewhere) with date text, and reads the text as that instant: the orders whose computed time is on or after it count.'
    cites: [tests/integration/correctness/shop/models/orders.yml#model.times.ordered_at, tests/integration/correctness/shop/models/orders.yml#model.times.closed_at, docs/QUERY_CALL.md#inline-expression-kinds]
    tags: [clock]
    query:
      select:
      - expression:
          kind: aggregate_if
          aggregation: count
          value: {kind: column, column: order_id, entity: entity.shop_order}
          condition:
            kind: comparison
            op: '>='
            left: {kind: date_add, unit: day, value: {kind: literal, value: 1}, date: {kind: column, column: ordered_at, entity: entity.shop_order}}
            right: {kind: literal, value: '2024-01-02'}
        as: day_after
      - expression:
          kind: aggregate_if
          aggregation: count
          value: {kind: column, column: order_id, entity: entity.shop_order}
          condition:
            kind: comparison
            op: '>='
            left: {kind: call, name: COALESCE, args: [{kind: column, column: closed_at, entity: entity.shop_order}, {kind: column, column: ordered_at, entity: entity.shop_order}]}
            right: {kind: literal, value: '2024-01-01'}
        as: closed_or_ordered
      - expression:
          kind: aggregate_if
          aggregation: count
          value: {kind: column, column: order_id, entity: entity.shop_order}
          condition:
            kind: comparison
            op: '>='
            left:
              kind: case
              whens:
              - when: {kind: comparison, op: '=', left: {kind: column, column: store_id, entity: entity.shop_order}, right: {kind: literal, value: a}}
                then: {kind: column, column: ordered_at, entity: entity.shop_order}
              else: {kind: column, column: closed_at, entity: entity.shop_order}
            right: {kind: literal, value: '2024-01-01'}
        as: by_store
    expected_rows:
      - {day_after: 8, closed_or_ordered: 8, by_store: 4}
    reference_sql: |
      SELECT COUNT(CASE WHEN ordered_at + INTERVAL '1 day' >= TIMESTAMP '2024-01-02' THEN 1 END),
             COUNT(CASE WHEN COALESCE(closed_at, ordered_at) >= TIMESTAMP '2024-01-01' THEN 1 END),
             COUNT(CASE WHEN (CASE WHEN store_id = 'a' THEN ordered_at ELSE closed_at END) >= TIMESTAMP '2024-01-01' THEN 1 END)
      FROM orders
