      SELECT SUM(o.amount) / CAST(NULLIF(COUNT(o.order_id), 0) AS DOUBLE PRECISION) FROM orders AS o
      WHERE o.ordered_at >= TIMESTAMP '2024-04-29' AND o.ordered_at < TIMESTAMP '2024-05-06'
  shop/a-balance-by-month-reads-the-closing-day:
