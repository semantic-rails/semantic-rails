    cites: [tests/integration/correctness/shop/models/shipment_scans.yml#model.measures.scan_count, tests/integration/correctness/shop/models/signups.yml#model.measures.signup_count, docs/QUERY_CALL.md#entity-filters]
    tags: [row-grain, child-scope]
    query:
      select: [measure.shop.signup_count]
