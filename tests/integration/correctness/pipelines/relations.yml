# A relation pipeline whose filter step reads a date, a timestamp and a text column. Text
# compared with the date or the timestamp is a temporal literal; with the text column, text.
relations:
  recent:
    source: events
    columns: [id, day, ts, label]
    steps:
      - where:
          - {field: day, op: gte, value: "2026-01-01"}
          - {field: label, op: not, value: "2025-01-01"}
          - kind: comparison
            op: "<"
            left: {kind: column, column: ts}
            right: {kind: literal, value: "2026-02-01 00:00:00"}
