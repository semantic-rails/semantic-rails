# Terminal: a new user answers a question in the interactive REPL, on a copy of the bundled
# jaffle_shop package. The expected figures are case J01 of
# tests/semantic_rails/mcp_context/eval_jaffle.jsonl, limited to the first quarter of 2017.
task: |
  I'm an analytics engineer, new to Semantic Rails. The folder jaffle_shop holds a sample
  project. Using the Semantic Rails REPL, find each store's revenue for each month of the first
  quarter of 2017, and tell me the numbers.
terminal:
  repl: semantic-rails repl
setup: >-
  cp -R {repo}/configs/semantic_rails/jaffle_shop jaffle_shop && mkdir jaffle_shop/data
  && cp -R {repo}/data/jaffle_csv {repo}/data/seed_jaffle.sql jaffle_shop/data/
check: >-
  for value in 45017.95 43358.12 49092.33 24857.99; do
  tr -d ',$' < "$AGENT_FINAL_ANSWER" | grep -q "$value" || exit 1; done
max_turns: 20
max_tokens: 200000
