services:
  semantic-rails:
    build: .
    image: semantic-rails:local
    ports:
      # Bind to loopback only: the API is unauthenticated with permissive
      # CORS out of the box, so it must not be reachable from other hosts
      # by default. To expose it beyond localhost, change the mapping AND
      # configure SEMANTIC_RAILS_API_KEYS (or SEMANTIC_RAILS_API_KEY_FILE)
      # plus SEMANTIC_RAILS_CORS_ORIGINS below.
      - "127.0.0.1:8080:8080"
    environment:
      SEMANTIC_RAILS_PACKAGE: jaffle_shop
      SEMANTIC_RAILS_HOST: 0.0.0.0
      SEMANTIC_RAILS_PORT: "8080"
      SEMANTIC_RAILS_AUDIT_LOGS: "1"
      # For non-local deployments, require API keys and restrict CORS:
      # SEMANTIC_RAILS_API_KEYS: "<comma-separated keys>"
      # SEMANTIC_RAILS_API_KEY_FILE: "/run/secrets/semantic_rails_api_keys"
      # SEMANTIC_RAILS_CORS_ORIGINS: "https://your-app.example.com"
    healthcheck:
      # Same endpoint as the Dockerfile HEALTHCHECK — keep them in sync.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/ready', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
