name: Dependabot auto-merge

# Grouped patch and minor updates (the python-deps and actions groups in dependabot.yml)
# merge themselves: this enables auto-merge, so the pull request enters the merge queue once
# the required checks pass, and the queue runs the full CI again before it lands. Updates to
# number-affecting dependencies (DuckDB, Arrow, pandas, date and time-zone parsing, warehouse
# drivers) are excluded from that group and, like every major update, wait for a review.
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  enable:
    name: Enable auto-merge for grouped patch and minor updates
    # Only Dependabot's own pushes: a person pushing to its branch turns this off.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Read the update's metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Enable auto-merge
        if: >-
          contains(fromJSON('["python-deps", "actions"]'), steps.metadata.outputs.dependency-group)
          && contains(fromJSON('["version-update:semver-patch", "version-update:semver-minor"]'), steps.metadata.outputs.update-type)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
