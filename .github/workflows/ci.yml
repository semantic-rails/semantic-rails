name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Pushes to main arrive in bursts from the merge queue; each commit keeps its own run.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    # Merge groups always run every job, so there's nothing to filter.
    if: ${{ github.event_name != 'merge_group' }}
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            backend:
              - ".github/workflows/**"
              - "CHANGELOG.md"
              - "changelog.d/**"
              - "CODE_OF_CONDUCT.md"
              - "CONTRIBUTING.md"
              - "LICENSE"
              - "Makefile"
              - "SECURITY.md"
              - "SUPPORT.md"
              - "configs/**"
              - "data/**"
              - "comparisons/semantic_layers/cube/**"
              - "comparisons/semantic_layers/malloy/**"
              - "pyproject.toml"
              - "README.md"
              - "scripts/**"
              - "security/**"
              - "schemas/**"
              - "semantic_rails/**"
              - "tests/**"
              - "uv.lock"
            docs:
              - "README.md"
              - "docs/**"

  backend:
    name: Backend (py${{ matrix.python-version }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'push' && (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        shard: [0, 1, 2]
    env:
      SR_SHARD_COUNT: "3"
      SR_SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The guard diffs the merge-group base against its synthetic head.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: uv.lock
      - if: matrix.python-version != '3.12'
        run: uv sync --group dev --locked
      - name: Install ADBC extras
        if: matrix.python-version == '3.12'
        run: |
          uv sync --group dev --extra snowflake-adbc --extra postgres --locked
          uv run --no-sync python -c "import pyarrow, adbc_driver_manager.dbapi, adbc_driver_postgresql.dbapi"
      - run: uv run python scripts/changelog_fragments.py check
      - run: uv run pytest -q tests/semantic_rails -n auto --validate-quarantine --junitxml=backend-results.xml
      - name: Verify DuckDB confinement tests ran without skips
        run: |
          uv run --no-sync python - <<'PY'
          import xml.etree.ElementTree as ET
          from scripts.test_sharding import in_shard

          cases = ET.parse("backend-results.xml").findall(".//testcase")
          if not in_shard("tests/semantic_rails/test_duckdb_confinement.py"):
              raise SystemExit(0)
          selected = [case for case in cases if case.get("classname") == "tests.semantic_rails.test_duckdb_confinement"]
          skipped = [case.attrib["name"] for case in selected if case.find("skipped") is not None]
          if not selected or skipped:
              raise SystemExit(f"DuckDB confinement tests must run without skips: {skipped}")
          print(f"All {len(selected)} DuckDB confinement tests ran without skips.")
          PY
      - name: Verify ADBC tests ran without skips
        if: matrix.python-version == '3.12'
        run: |
          uv run --no-sync python - <<'PY'
          import xml.etree.ElementTree as ET
          from scripts.test_sharding import in_shard

          cases = ET.parse("backend-results.xml").findall(".//testcase")
          for module in ("test_adbc_adapter", "test_adbc_snowflake"):
              if not in_shard(f"tests/semantic_rails/{module}.py"):
                  continue
              selected = [case for case in cases if case.get("classname") == f"tests.semantic_rails.{module}"]
              skipped = [case.attrib["name"] for case in selected if case.find("skipped") is not None]
              if not selected or skipped:
                  raise SystemExit(f"{module} must run without skips: {skipped}")
              print(f"All {len(selected)} {module} tests ran without skips.")
          PY
      - name: Catch intermittent failures
        if: github.event_name == 'merge_group' && matrix.python-version == '3.12'
        timeout-minutes: 5
        env:
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
        run: uv run python scripts/flake_guard.py --base "$MERGE_BASE" --durations-from backend-results.xml
      - name: ClickHouse driver guards (no skips)
        if: matrix.python-version == '3.12' && matrix.shard == 0
        env:
          SR_SHARD_COUNT: '1'
          SR_SHARD_INDEX: '0'
        run: |
          uv sync --group dev --extra clickhouse --locked
          uv run --no-sync pytest -v -rs tests/semantic_rails/test_dialect_clickhouse.py --junitxml=clickhouse-results.xml
          uv run --no-sync python - <<'PY'
          import xml.etree.ElementTree as ET
          from scripts.test_sharding import in_shard

          cases = ET.parse("clickhouse-results.xml").findall(".//testcase")
          skipped = [case.attrib["name"] for case in cases if case.find("skipped") is not None]
          if not cases or skipped:
              raise SystemExit(f"ClickHouse tests must run without skips: {skipped}")
          print(f"All {len(cases)} ClickHouse tests ran without skips.")
          PY
      - name: Upload backend test results
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-results-${{ matrix.shard }}
          path: backend-results.xml
      - if: matrix.shard == 0
        run: uv run semantic-rails parse-config --package jaffle_shop
      - if: matrix.shard == 0
        run: uv run semantic-rails validate-config --package jaffle_shop --quiet
      - if: matrix.shard == 0
        run: uv run semantic-rails test-package --package jaffle_shop
      - if: matrix.python-version == '3.12' && matrix.shard == 0
        run: uv run python scripts/generate_contract_artifacts.py --check
      # Release-readiness check only needs to run once (covers hygiene,
      # prelaunch gaps, and v1 completion).
      - if: matrix.python-version == '3.12' && matrix.shard == 0
        run: uv run python scripts/verify_release_readiness.py

  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --group dev --locked
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format check
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy semantic_rails
      - run: uv run python scripts/benchmark_plan.py --gate

  security:
    name: Security audit
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --group dev --locked
      - name: Audit core and individual warehouse connectors
        run: uv run --no-sync python scripts/audit_dependencies.py
      - name: npm audit (Malloy comparison harness)
        run: |
          npm ci --prefix comparisons/semantic_layers/malloy
          npm audit --prefix comparisons/semantic_layers/malloy --audit-level=high
      - name: Verify captured Cube evidence (offline, no npm install)
        run: python3 comparisons/semantic_layers/cube/scripts/verify_evidence.py

  docs:
    name: Docs
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.docs == 'true') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --group dev --locked
      - run: uv run python scripts/verify_release_readiness.py

  postgres:
    uses: ./.github/workflows/postgres-correctness.yml

  all-checks:
    name: All checks pass
    if: ${{ always() }}
    needs: [changes, backend, lint, security, docs, postgres]
    runs-on: ubuntu-latest
    steps:
      - name: Verify no required job failed or was cancelled
        # Skipped jobs from path filters count as success, except Postgres:
        # its live correctness suite must run on every CI event.
        # Every path-filtered job (backend, lint, security, docs) must
        # succeed or be skipped for the gate to pass. The `lint` job runs ruff +
        # mypy and IS required — they were continue-on-error during
        # the round-six cleanup but are now load-bearing.
        # A merge-queue group has no path filter, so there every suite
        # job must have run and succeeded; a skip there means it never ran.
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results"
          python3 - <<'EOF'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          bad = {n: r["result"] for n, r in needs.items()
                 if r["result"] in ("failure", "cancelled")}
          postgres = needs.get("postgres", {}).get("result", "missing")
          if postgres != "success":
              bad["postgres"] = postgres
          if os.environ["EVENT"] == "merge_group":
              for name in ("backend", "lint", "security", "docs"):
                  result = needs.get(name, {}).get("result", "missing")
                  if result != "success":
                      bad[name] = result
          if bad:
              print(f"Failed jobs: {bad}", file=sys.stderr)
              sys.exit(1)
          print("All required jobs passed or were skipped.")
          EOF
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
