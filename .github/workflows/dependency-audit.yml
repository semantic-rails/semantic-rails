name: Dependency audit

# The full audit of the locked core install and every warehouse extra. Pull requests run it in
# diff mode (ci.yml), so an advisory published against an existing dependency shows up here:
# nightly, and on main when the audit's inputs change. A failure opens or updates one tracking
# issue; the next green run closes it.
on:
  schedule:
    - cron: "23 5 * * *"
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "security/audit-exceptions.toml"
      - "scripts/audit_dependencies.py"
      - ".github/workflows/dependency-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Full dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --group dev --locked
      - name: Audit core and individual warehouse connectors
        run: uv run --no-sync python scripts/audit_dependencies.py
      - name: Open, update or close the tracking issue
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Dependency audit fails on main"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number,title --jq "map(select(.title == \"$title\"))[0].number // empty")
          if [ "$OUTCOME" = success ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "The full audit passes again: $RUN_URL"
            fi
          elif [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "The full dependency audit failed on main. Pull requests fail only on advisories they introduce, so this one fails here until a fix or a listed exception merges (see CONTRIBUTING.md, Dependency advisories). Run: $RUN_URL"
          fi
