name: README quickstart

# Runs the README's published-package commands in clean environments. It tests the
# latest release on PyPI, not this checkout, so it catches README drift and install traps.
on:
  pull_request:
    paths:
      - "README.md"
      - "docs/AGENT_QUICKSTART.md"
      - "scripts/verify_readme_quickstart.py"
      - ".github/workflows/quickstart.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/AGENT_QUICKSTART.md"
      - "scripts/verify_readme_quickstart.py"
      - ".github/workflows/quickstart.yml"
  # Weekly, because a new PyPI release can break the README without any change here.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Clean containers (Ubuntu 22.04, 24.04, python:3.12-slim)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run the README quickstart in each image
        run: >-
          python3 scripts/verify_readme_quickstart.py
          --image ubuntu:22.04 --image ubuntu:24.04 --image python:3.12-slim

  macos:
    name: Stock macOS PATH (system Python only)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.17"
      - name: Run the README quickstart with PATH limited to /usr/bin:/bin and uv
        run: python3 scripts/verify_readme_quickstart.py --local
