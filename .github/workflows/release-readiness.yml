name: Release Readiness

on:
  workflow_dispatch:
  # Nightly on main: the full suite on Python 3.13, which the merge queue doesn't run.
  schedule:
    - cron: "41 5 * * *"

permissions:
  contents: read

concurrency:
  # The nightly never cancels a dispatched release gate on the same ref, or the reverse.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  suite:
    name: Test suite (py${{ matrix.python-version }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        # A release runs the suite on 3.12 and on 3.13, the version the merge queue
        # leaves out (it runs 3.11, 3.12 and 3.14 on every merge); the nightly on 3.13.
        python-version: ${{ fromJSON(github.event_name == 'schedule' && '["3.13"]' || '["3.12", "3.13"]') }}
        shard: [0, 1, 2, 3]
    env:
      # The full suite outgrew one job's time limit; shard it the way ci.yml does.
      SR_SHARD_COUNT: "4"
      SR_SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --group dev --locked
      - run: uv run pytest -q tests/semantic_rails -n auto --dist worksteal

  release-readiness:
    name: Release readiness
    needs: suite
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --group dev --locked
      - run: uv run python scripts/generate_contract_artifacts.py --check
      - run: uv run python scripts/benchmark_plan.py --gate --output dist/agentic-governance-scorecard.json --markdown-output dist/agentic-governance-scorecard.md
      - run: uv run semantic-rails check --package jaffle_shop --artifact dist/jaffle_shop.semantic-rails.tar.gz
      - run: SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD) uv build --out-dir dist
      - run: uv run python scripts/verify_package_distribution.py --dist-dir dist --no-build
      - name: Verify release surface and tag/version agreement
        run: |
          uv run python scripts/verify_release_readiness.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-artifacts
          path: |
            dist/jaffle_shop.semantic-rails.tar.gz
            dist/semantic_rails-*.tar.gz
            dist/*.whl
            dist/agentic-governance-scorecard.*
            semantic_rails/contracts/*.json
