name: Publish to PyPI

# Tag-triggered release: pushing a `v*` tag runs the full gate and builds the
# sdist + wheel exactly once. Those verified bytes are transferred to PyPI,
# verified byte-for-byte from the public index, and only then attached to a
# GitHub Release with the complete public contract bundle and SHA256SUMS.
# No job rebuilds release artifacts.
#
# One-time setup on pypi.org: add a "trusted publisher" for the
# `semantic-rails` project pointing at this repo, workflow `publish.yml`,
# environment `pypi`; then create the matching `pypi` environment in the
# GitHub repo settings (optionally with required reviewers as a manual gate).
#
# Third-party actions are SHA-pinned (the trailing comment records the tag
# the SHA was resolved from).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  test:
    name: Build and test release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --group dev --locked
      - run: uv run python scripts/generate_contract_artifacts.py --check
      - run: uv run pytest -q tests/semantic_rails tests/mf2sr -n auto
      - run: uv run python scripts/benchmark_plan.py --gate --output dist/agentic-governance-scorecard.json --markdown-output dist/agentic-governance-scorecard.md
      - run: uv run semantic-rails check --package jaffle_shop --artifact dist/jaffle_shop.semantic-rails.tar.gz
      - run: uv build --out-dir dist
      - run: uv run python scripts/verify_package_distribution.py --dist-dir dist --no-build
      - run: uv run python scripts/verify_release_readiness.py --tag "${GITHUB_REF_NAME}"
      - name: Assemble checksummed release bundle
        run: |
          mkdir -p release-assets/python release-assets/github
          cp dist/semantic_rails-*.whl dist/semantic_rails-*.tar.gz release-assets/python/
          cp release-assets/python/* schemas/*.json release-assets/github/
          (
            cd release-assets/github
            sha256sum semantic_rails-* *.json > SHA256SUMS
          )
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error

  publish:
    name: Publish verified artifacts
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      # Required for PyPI Trusted Publishing (OIDC token exchange).
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets
          path: release-assets
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          packages-dir: release-assets/python/

  post-publish:
    name: Verify published bytes and installed smoke
    runs-on: ubuntu-latest
    needs: publish
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets
          path: release-assets
      - name: Verify release-bundle checksums
        working-directory: release-assets/github
        run: sha256sum --check SHA256SUMS
      - name: Match PyPI digests and smoke the published wheel
        run: |
          version="${GITHUB_REF_NAME#v}"
          python scripts/verify_published_release.py \
            --version "$version" \
            --dist-dir release-assets/python

  release:
    name: Create checksummed GitHub Release
    runs-on: ubuntu-latest
    needs: post-publish
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets
          path: release-assets
      - name: Verify release-bundle checksums
        working-directory: release-assets/github
        run: sha256sum --check SHA256SUMS
      - name: Create GitHub Release from the PyPI-verified bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-assets/github/*.whl \
            release-assets/github/*.tar.gz \
            release-assets/github/*.json \
            release-assets/github/SHA256SUMS \
            --verify-tag \
            --title "Semantic Rails ${GITHUB_REF_NAME}" \
            --generate-notes
