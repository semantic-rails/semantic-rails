name: Publish to PyPI

# Tag-triggered release: pushing a `v*` tag runs the full gate and builds the
# sdist + wheel exactly once. Those verified bytes are transferred to PyPI,
# verified byte-for-byte from the public index, and only then attached to a
# GitHub Release with the complete public contract bundle and SHA256SUMS.
# No job rebuilds release artifacts.
#
# Release tags are immutable, and a re-run reuses the workflow file of the
# original run. If a tag-push run fails for a workflow reason, publish the same
# tag with this workflow from main: `gh workflow run publish.yml -f tag=vX.Y.Z`.
# Every job still checks out and builds the tag, never main. The `pypi`
# environment must allow deployments from `main` as well as `v*` tags.
#
# One-time setup on pypi.org: add a "trusted publisher" for the
# `semantic-rails` project pointing at this repo, workflow `publish.yml`,
# environment `pypi`; then create the matching `pypi` environment in the
# GitHub repo settings (optionally with required reviewers as a manual gate).
#
# Third-party actions are SHA-pinned (the trailing comment records the tag
# the SHA was resolved from).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing final release tag on main to publish, such as v1.2.3"
        required: true
        type: string

permissions:
  contents: read

env:
  # The release tag every job checks out and publishes: the pushed tag, or the
  # dispatch input (checked by the first step of `suite`).
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  # Keyed on the tag, so a dispatch and a tag push for one tag never overlap.
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}

jobs:
  suite:
    name: Test suite (py${{ matrix.python-version }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        # 3.12, and 3.13, which the merge queue leaves out: with the merge queue's 3.11,
        # 3.12 and 3.14 every supported Python passes the suite before a release uploads.
        python-version: ["3.12", "3.13"]
        shard: [0, 1, 2, 3]
    env:
      # The full suite outgrew one job's time limit; shard it the way ci.yml does.
      SR_SHARD_COUNT: "4"
      SR_SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - name: Refuse a dispatch unless the tag is a final release tag on main
        if: github.event_name == 'workflow_dispatch'
        run: |
          fail() { echo "::error title=Refusing to publish::$1"; exit 1; }
          [[ "${GITHUB_REF}" == refs/heads/main ]] ||
            fail "dispatch this workflow from main, not ${GITHUB_REF}"
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
            fail "the tag input must be a final release tag such as v1.2.3; a pre-release publishes only from its tag push"
          git init -q "${RUNNER_TEMP}/release-tag"
          cd "${RUNNER_TEMP}/release-tag"
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git ls-remote --exit-code origin "refs/tags/${RELEASE_TAG}" > /dev/null ||
            fail "tag ${RELEASE_TAG} does not exist on origin"
          git fetch -q --no-tags --filter=tree:0 origin \
            "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" "+refs/heads/main:refs/remotes/origin/main"
          commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          git merge-base --is-ancestor "${commit}" refs/remotes/origin/main ||
            fail "tag ${RELEASE_TAG} points at ${commit}, which is not on main"
          echo "Publishing ${RELEASE_TAG} (${commit}) with this workflow from main."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --group dev --locked
      - run: uv run pytest -q tests/semantic_rails -n auto --dist worksteal

  test:
    name: Build and test release
    needs: suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --group dev --locked
      - run: uv run python scripts/generate_contract_artifacts.py --check
      - run: uv run python scripts/benchmark_plan.py --gate --output dist/agentic-governance-scorecard.json --markdown-output dist/agentic-governance-scorecard.md
      - run: uv run semantic-rails check --package jaffle_shop --artifact dist/jaffle_shop.semantic-rails.tar.gz
      - run: SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD) uv build --out-dir dist
      - run: uv run python scripts/verify_package_distribution.py --dist-dir dist --no-build
      - run: uv run python scripts/verify_release_readiness.py --tag "${RELEASE_TAG}"
      - name: Assemble checksummed release bundle
        run: |
          mkdir -p release-assets/python release-assets/github
          cp dist/semantic_rails-*.whl dist/semantic_rails-*.tar.gz release-assets/python/
          cp release-assets/python/* schemas/*.json release-assets/github/
          (
            cd release-assets/github
            sha256sum semantic_rails-* *.json > SHA256SUMS
          )
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error

  publish:
    name: Publish verified artifacts
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      # Required for PyPI Trusted Publishing (OIDC token exchange).
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-assets
          path: release-assets
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: release-assets/python/

  post-publish:
    name: Verify published bytes and installed smoke
    runs-on: ubuntu-latest
    needs: publish
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-assets
          path: release-assets
      - name: Verify release-bundle checksums
        working-directory: release-assets/github
        run: sha256sum --check SHA256SUMS
      - name: Match PyPI digests and smoke the published wheel
        run: |
          version="${RELEASE_TAG#v}"
          python scripts/verify_published_release.py \
            --version "$version" \
            --dist-dir release-assets/python

  release:
    name: Create checksummed GitHub Release
    runs-on: ubuntu-latest
    needs: post-publish
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-assets
          path: release-assets
      - name: Verify release-bundle checksums
        working-directory: release-assets/github
        run: sha256sum --check SHA256SUMS
      - name: Create GitHub Release from the PyPI-verified bytes
        env:
          GH_TOKEN: ${{ github.token }}
          # This job intentionally does not check out the repo — it publishes
          # the artifact bytes that `post-publish` already verified against
          # PyPI. Without a git remote to infer from, `gh` exits with
          # "fatal: not a git repository"; it does not fall back to
          # GITHUB_REPOSITORY. `--verify-tag` and `--generate-notes` are
          # resolved server-side, so GH_REPO is all that is needed.
          GH_REPO: ${{ github.repository }}
        run: |
          # Only a final or post-release tag can become "Latest"; any other tag, such as
          # v0.3.2rc1, is a GitHub pre-release.
          prerelease=true
          if [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.post[0-9]+)?$ ]]; then
            prerelease=false
          fi
          gh release create "${RELEASE_TAG}" \
            release-assets/github/*.whl \
            release-assets/github/*.tar.gz \
            release-assets/github/*.json \
            release-assets/github/SHA256SUMS \
            --verify-tag \
            --prerelease="${prerelease}" \
            --title "Semantic Rails ${RELEASE_TAG}" \
            --generate-notes
